---
- name: Audit VMware vSphere Network Architecture (Read-Only)
  hosts: localhost
  gather_facts: false
  vars:
    # Credenciales y servidor vCenter
    vcenter_hostname: "vcenter.company.com"
    vcenter_username: "read_only_user@vsphere.local"
    vcenter_password: "YourPasswordHere"
    validate_certs: false
    output_file: "VMware_Network_Audit_Report.md"

  tasks:
    # 1. Obtener información de red de todos los hosts ESXi
    - name: Gather Network Info for ESXi Hosts
      community.vmware.vmware_host_network_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ validate_certs }}"
      register: host_network_info

    # 2. Obtener información de los switches distribuidos (vDS)
    - name: Gather Distributed Virtual Switches (vDS) Info
      community.vmware.vmware_dvswitch_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ validate_certs }}"
      register: vds_info

    # 3. Obtener información de Port Groups y políticas de seguridad
    - name: Gather Distributed Port Groups Info
      community.vmware.vmware_dvs_portgroup_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ validate_certs }}"
      register: portgroup_info

    # 4. Generar el reporte estructurado en Markdown
    - name: Generate Markdown Audit Report
      ansible.builtin.copy:
        dest: "{{ output_file }}"
        content: |
          # VMware / NSX Network Audit Report
          Generated on: {{ lookup('pipe', 'date +"%Y-%m-%d %H:%M:%S UTC"') }}
          Target vCenter: {{ vcenter_hostname }}

          ---

          ## 1. Physical Host NICs & Uplinks

          | Host | Physical NIC | MAC Address | Driver / Speed |
          | :--- | :--- | :--- | :--- |
          {% for host_name, host_data in host_network_info.host_network_info.items() %}
          {% for pnic in host_data.pnic %}
          | {{ host_name }} | {{ pnic.device }} | {{ pnic.mac }} | {{ pnic.driver | default('N/A') }} / {{ pnic.speed | default('Unknown') }} |
          {% endfor %}
          {% endfor %}

          ## 2. Distributed Virtual Switches (vDS)

          | vDS Name | MTU | Num Ports |
          | :--- | :--- | :--- |
          {% for vds in vds_info.dvs_info %}
          | {{ vds.name }} | {{ vds.mtu | default('1500') }} | {{ vds.num_ports | default('N/A') }} |
          {% endfor %}

          ## 3. Port Groups & Security Policies

          | Port Group Name | VLAN ID | vDS Name | Promiscuous Mode | MAC Changes | Forged Transmits |
          | :--- | :--- | :--- | :--- | :--- | :--- |
          {% for pg_name, pg in portgroup_info.dvs_portgroup_info.items() %}
          | {{ pg_name }} | {{ pg.vlan_id | default('N/A') }} | {{ pg.dvs_name | default('N/A') }} | {{ pg.security_policy.allow_promiscuous | default('Inherited/Default') }} | {{ pg.security_policy.mac_changes | default('Inherited/Default') }} | {{ pg.security_policy.forged_transmits | default('Inherited/Default') }} |
          {% endfor %}

          ## 4. VMkernel Interfaces (IPs & Subnets)

          | Host | Interface | IP Address | Subnet Mask | Port Group | MTU |
          | :--- | :--- | :--- | :--- | :--- | :--- |
          {% for host_name, host_data in host_network_info.host_network_info.items() %}
          {% for vnk in host_data.vmk %}
          | {{ host_name }} | {{ vnk.device }} | {{ vnk.ip }} | {{ vnk.netmask }} | {{ vnk.portgroup | default(vnk.dvs_portgroup | default('N/A')) }} | {{ vnk.mtu | default('1500') }} |
          {% endfor %}
          {% endfor %}

    # 5. Notificación final
    - name: Display Completion Message
      ansible.builtin.debug:
        msg: "Audit complete. The report has been saved to {{ output_file }}"
