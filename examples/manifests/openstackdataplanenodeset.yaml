---
apiVersion: dataplane.openstack.org/v1beta1
kind: OpenStackDataPlaneNodeSet
metadata:
  name: openstack-edpm
  namespace: openstack
spec:
  # Network configuration
  networkAttachments:
    - ctlplane
  
  # Node configuration
  nodes:
    edpm-compute-0:
      hostName: edpm-compute-0
      ansible:
        ansibleHost: 192.168.122.100
      networks:
        - name: ctlplane
          subnetName: subnet1
          defaultRoute: true
          fixedIP: 192.168.122.100
        - name: internalapi
          subnetName: subnet1
        - name: storage
          subnetName: subnet1
        - name: tenant
          subnetName: subnet1
          
  # Node template
  nodeTemplate:
    ansibleSSHPrivateKeySecret: dataplane-ansible-ssh-private-key-secret
    
    # Services to deploy on data plane nodes
    services:
      - download-cache
      - configure-network
      - validate-network
      - install-os
      - configure-os
      - run-os
      - install-certs
      - libvirt
      - nova
      - ovn
      
  # Environment configuration
  env:
    - name: ANSIBLE_FORCE_COLOR
      value: "True"
