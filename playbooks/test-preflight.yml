---
- name: Validate Assisted Installer and generic Redfish prerequisites
  hosts: all
  gather_facts: false
  connection: local
  vars:
    validate_certs: false
  pre_tasks:
    - name: Validate required host and cluster inputs
      ansible.builtin.assert:
        that:
          - bmc_endpoint is defined or idrac_ip is defined
          - bmc_username is defined or idrac_user is defined
          - bmc_password is defined or idrac_password is defined
          - assisted_api_url is defined
          - assisted_auth_mode is defined
          - cluster_name is defined
          - base_dns_domain is defined
          - openshift_version is defined
          - pull_secret_file is defined
          - ssh_public_key_file is defined
          - api_vip is defined
          - ingress_vip is defined
        fail_msg: >-
          Define the generic bmc_* variables and required Assisted Installer
          cluster settings. Legacy idrac_* aliases remain accepted only for
          backward compatibility.
      tags: always

    - name: Create installation artifact directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0750"
      loop:
        - "{{ artifacts_dir }}"
        - "{{ artifacts_dir }}/{{ cluster_name }}"
        - "{{ artifacts_dir }}/{{ cluster_name }}/auth"
        - "{{ artifacts_dir }}/{{ cluster_name }}/raw"
        - "{{ artifacts_dir }}/{{ cluster_name }}/reports"
      run_once: true
      tags: always

  roles:
    - role: assisted_auth
      run_once: true
      tags:
        - always
        - assisted_auth

    - role: bmc_discovery
      tags:
        - always
        - bmc_discovery
        - redfish_discovery
