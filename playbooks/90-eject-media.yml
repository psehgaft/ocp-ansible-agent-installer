---
- name: Eject discovery ISO from all BMCs
  hosts: baremetal
  gather_facts: false
  connection: local
  any_errors_fatal: false
  roles:
    - role: preflight
      vars:
        preflight_require_cluster_inputs: false
        preflight_require_secret_files: false
        preflight_validate_inventory_counts: false
    - role: bmc_discovery
    - role: bmc_eject_media
