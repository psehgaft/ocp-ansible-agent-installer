---
- name: Install cert-manager Operator for Red Hat OpenShift
  ansible.builtin.import_playbook: platform-operator-bundle.yml
  vars:
    platform_operator_components:
      - cert_manager
    platform_operator_resources: "{{ cert_manager_resources | default([]) }}"
    platform_operator_render_root: "{{ playbook_dir }}/../../rendered/day2/platform-operators/cert-manager"
