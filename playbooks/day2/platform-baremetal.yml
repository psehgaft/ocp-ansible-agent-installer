---
- name: Configure the OpenShift Bare Metal Operator
  ansible.builtin.import_playbook: platform-operator-bundle.yml
  vars:
    platform_operator_components:
      - baremetal_operator
    platform_operator_resources: "{{ baremetal_resources | default([]) }}"
    platform_operator_render_root: "{{ playbook_dir }}/../../rendered/day2/platform-operators/baremetal"
