---
- name: Configure LDAP or Active Directory identity provider
  hosts: localhost
  gather_facts: false
  vars:
    ldap_provider_name: corporate-ldap
    ldap_mapping_method: claim
    ldap_bind_secret_name: ldap-bind-password
    ldap_ca_configmap_name: ldap-ca
    ldap_bind_dn: ''
    ldap_bind_password: ''
    ldap_url: ''
    ldap_insecure: false
    ldap_ca_bundle: ''
    ldap_attributes:
      id: [dn]
      preferredUsername: [sAMAccountName]
      name: [displayName, cn]
      email: [mail]
  pre_tasks:
    - name: Validate LDAP configuration
      ansible.builtin.assert:
        that:
          - ldap_provider_name | length > 0
          - ldap_url | length > 0
          - ldap_bind_dn | length > 0
          - ldap_bind_password | length > 0
          - ldap_attributes.id | length > 0
          - ldap_attributes.preferredUsername | length > 0
        fail_msg: Store LDAP bind credentials in Ansible Vault and provide the LDAP URL and attributes.

    - name: Require a CA bundle for secure LDAP
      ansible.builtin.assert:
        that:
          - ldap_ca_bundle | length > 0
        fail_msg: Provide ldap_ca_bundle for LDAPS or set ldap_insecure=true only for an explicitly approved lab.
      when: not ldap_insecure | bool

    - name: Build LDAP supporting resources
      ansible.builtin.set_fact:
        oauth_supporting_resources: >-
          {{
            [
              {
                'apiVersion': 'v1',
                'kind': 'Secret',
                'metadata': {
                  'name': ldap_bind_secret_name,
                  'namespace': 'openshift-config'
                },
                'type': 'Opaque',
                'stringData': {
                  'bindPassword': ldap_bind_password
                }
              }
            ]
            +
            (
              [] if ldap_insecure | bool else
              [
                {
                  'apiVersion': 'v1',
                  'kind': 'ConfigMap',
                  'metadata': {
                    'name': ldap_ca_configmap_name,
                    'namespace': 'openshift-config'
                  },
                  'data': {
                    'ca.crt': ldap_ca_bundle
                  }
                }
              ]
            )
          }}
      no_log: true

    - name: Build base LDAP provider
      ansible.builtin.set_fact:
        ldap_provider_definition:
          name: "{{ ldap_provider_name }}"
          mappingMethod: "{{ ldap_mapping_method }}"
          type: LDAP
          ldap:
            attributes: "{{ ldap_attributes }}"
            bindDN: "{{ ldap_bind_dn }}"
            bindPassword:
              name: "{{ ldap_bind_secret_name }}"
            insecure: "{{ ldap_insecure | bool }}"
            url: "{{ ldap_url }}"
      no_log: true

    - name: Add LDAP CA reference for secure mode
      ansible.builtin.set_fact:
        ldap_provider_definition: >-
          {{
            ldap_provider_definition
            | combine(
                {
                  'ldap': ldap_provider_definition.ldap
                  | combine({'ca': {'name': ldap_ca_configmap_name}})
                },
                recursive=True
              )
          }}
      when: not ldap_insecure | bool
      no_log: true

    - name: Publish LDAP provider desired state
      ansible.builtin.set_fact:
        oauth_identity_providers:
          - "{{ ldap_provider_definition }}"
      no_log: true

  roles:
    - role: day2_identity
