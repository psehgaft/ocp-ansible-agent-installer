---
- import_playbook: platform-operator-bundle.yml
  vars:
    platform_operator_components: []
    platform_operator_resources: >-
      {{ network_observability_resources | default([
        {
          'apiVersion': 'v1',
          'kind': 'Namespace',
          'metadata': {'name': 'openshift-netobserv-operator'}
        },
        {
          'apiVersion': 'operators.coreos.com/v1alpha1',
          'kind': 'Subscription',
          'metadata': {
            'name': 'netobserv-operator',
            'namespace': 'openshift-netobserv-operator'
          },
          'spec': {
            'channel': netobserv_channel | default('stable'),
            'installPlanApproval': netobserv_install_plan_approval | default('Manual'),
            'name': 'netobserv-operator',
            'source': netobserv_catalog_source | default('redhat-operators'),
            'sourceNamespace': 'openshift-marketplace'
          }
        }
      ]) }}
    platform_operator_render_root: "{{ playbook_dir }}/../../rendered/day2/platform-operators/network-observability"
