---
- name: Install and configure OpenShift Logging and Loki
  ansible.builtin.import_playbook: platform-operator-bundle.yml
  vars:
    platform_operator_components:
      - loki
      - logging
    platform_operator_resources: "{{ logging_resources | default([]) }}"
    platform_operator_render_root: "{{ playbook_dir }}/../../rendered/day2/platform-operators/logging"
