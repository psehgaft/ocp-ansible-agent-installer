---
- name: Run certificate audit
  hosts: localhost
  gather_facts: false
  roles:
    - role: day2_operational_workflow
      vars:
        day2_operation_domain: certificate-audit
        day2_operation_resources: []
        day2_operation_checks: "{{ certificate_audit_commands | default([['oc','get','secrets','-A','-o','json']]) }}"
