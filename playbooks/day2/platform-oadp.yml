---
- import_playbook: platform-operator-bundle.yml
  vars:
    platform_operator_components: []
    platform_operator_resources: >-
      {{ oadp_resources | default([
        {
          'apiVersion': 'v1',
          'kind': 'Namespace',
          'metadata': {'name': 'openshift-adp'}
        },
        {
          'apiVersion': 'operators.coreos.com/v1',
          'kind': 'OperatorGroup',
          'metadata': {'name': 'redhat-oadp-operator', 'namespace': 'openshift-adp'},
          'spec': {'targetNamespaces': ['openshift-adp']}
        },
        {
          'apiVersion': 'operators.coreos.com/v1alpha1',
          'kind': 'Subscription',
          'metadata': {'name': 'redhat-oadp-operator', 'namespace': 'openshift-adp'},
          'spec': {
            'channel': oadp_channel | default('stable-1.5'),
            'installPlanApproval': oadp_install_plan_approval | default('Manual'),
            'name': 'redhat-oadp-operator',
            'source': oadp_catalog_source | default('redhat-operators'),
            'sourceNamespace': 'openshift-marketplace'
          }
        }
      ]) }}
    platform_operator_render_root: "{{ playbook_dir }}/../../rendered/day2/platform-operators/oadp"
