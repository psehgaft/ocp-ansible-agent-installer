---
- name: Install and configure Red Hat OpenStack Services on OpenShift
  ansible.builtin.import_playbook: platform-operator-bundle.yml
  vars:
    platform_operator_components:
      - rhoso
    platform_operator_resources: "{{ rhoso_resources | default([]) }}"
    platform_operator_render_root: "{{ playbook_dir }}/../../rendered/day2/platform-operators/rhoso"
