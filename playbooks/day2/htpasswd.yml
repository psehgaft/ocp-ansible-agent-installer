---
- name: Configure HTPasswd identity provider
  hosts: localhost
  gather_facts: false
  vars:
    htpasswd_provider_name: local-htpasswd
    htpasswd_secret_name: local-htpasswd
    htpasswd_mapping_method: claim
    htpasswd_users: []
  pre_tasks:
    - name: Validate HTPasswd input
      ansible.builtin.assert:
        that:
          - htpasswd_users is sequence
          - htpasswd_users | length > 0
          - htpasswd_users | map(attribute='name') | list | length == htpasswd_users | length
          - htpasswd_users | map(attribute='password') | list | length == htpasswd_users | length
        fail_msg: Define htpasswd_users with name and password values in Ansible Vault.

    - name: Create temporary HTPasswd file
      ansible.builtin.tempfile:
        state: file
        suffix: .htpasswd
      register: htpasswd_file

    - name: Add local users to HTPasswd file
      community.general.htpasswd:
        path: "{{ htpasswd_file.path }}"
        name: "{{ item.name }}"
        password: "{{ item.password }}"
        crypt_scheme: bcrypt
        mode: '0600'
      loop: "{{ htpasswd_users }}"
      no_log: true

    - name: Read generated HTPasswd file
      ansible.builtin.slurp:
        src: "{{ htpasswd_file.path }}"
      register: htpasswd_content
      no_log: true

    - name: Build HTPasswd desired state
      ansible.builtin.set_fact:
        oauth_supporting_resources:
          - apiVersion: v1
            kind: Secret
            metadata:
              name: "{{ htpasswd_secret_name }}"
              namespace: openshift-config
            type: Opaque
            data:
              htpasswd: "{{ htpasswd_content.content }}"
        oauth_identity_providers:
          - name: "{{ htpasswd_provider_name }}"
            mappingMethod: "{{ htpasswd_mapping_method }}"
            type: HTPasswd
            htpasswd:
              fileData:
                name: "{{ htpasswd_secret_name }}"
      no_log: true

  roles:
    - role: day2_identity

  post_tasks:
    - name: Remove temporary HTPasswd file
      ansible.builtin.file:
        path: "{{ htpasswd_file.path }}"
        state: absent
      no_log: true
