services:
  installer-ui:
    build:
      context: .
      dockerfile: Containerfile
      args:
        OPENSHIFT_VERSION: "4.18.41"
    image: localhost/ocp-ansible-agent-installer-ui:task3
    environment:
      INSTALLER_UI_AUTH_TOKENS: "${INSTALLER_UI_AUTH_TOKENS:?Set INSTALLER_UI_AUTH_TOKENS to a token and role mapping}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - installer-ui-data:/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  installer-ui-data: {}
