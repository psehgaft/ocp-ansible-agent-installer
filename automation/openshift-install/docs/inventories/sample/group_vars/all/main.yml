# -----------------------------------------------------------------------------
# RHOSO bootstrap variables (example)
# -----------------------------------------------------------------------------
# IMPORTANT:
# - Store real values in Ansible Vault (recommended) or a secure secret store.
# - RHOSO service passwords in osp-secret should not be changed after control plane deploy.
# -----------------------------------------------------------------------------

# Plaintext values; the role base64-encodes them into Secret.data fields.
# Recommended: 32-character alphanumeric strings for all *Password* keys.
# Mandatory: HeatAuthEncryptionKey must be exactly 32 characters.

rhoso_osp_secret:
  AdminPassword:        "CHANGE_ME_32_CHARS________________"
  AodhPassword:         "CHANGE_ME_32_CHARS________________"
  BarbicanPassword:     "CHANGE_ME_32_CHARS________________"
  # Fernet key string (already base64-like). The template will base64-encode it for Secret.data.
  BarbicanSimpleCryptoKEK: "CHANGE_ME_FERNET_KEY_STRING"
  CeilometerPassword:   "CHANGE_ME_32_CHARS________________"
  CinderPassword:       "CHANGE_ME_32_CHARS________________"
  DbRootPassword:       "CHANGE_ME_32_CHARS________________"
  DesignatePassword:    "CHANGE_ME_32_CHARS________________"
  GlancePassword:       "CHANGE_ME_32_CHARS________________"
  HeatAuthEncryptionKey:"CHANGE_ME_32_CHARS________________"
  HeatPassword:         "CHANGE_ME_32_CHARS________________"
  IronicInspectorPassword: "CHANGE_ME_32_CHARS________________"
  IronicPassword:       "CHANGE_ME_32_CHARS________________"
  ManilaPassword:       "CHANGE_ME_32_CHARS________________"
  MetadataSecret:       "CHANGE_ME_32_CHARS________________"
  NeutronPassword:      "CHANGE_ME_32_CHARS________________"
  NovaPassword:         "CHANGE_ME_32_CHARS________________"
  OctaviaHeartbeatKey:  "CHANGE_ME_32_CHARS________________"
  OctaviaPassword:      "CHANGE_ME_32_CHARS________________"
  PlacementPassword:    "CHANGE_ME_32_CHARS________________"
  SwiftPassword:        "CHANGE_ME_32_CHARS________________"
