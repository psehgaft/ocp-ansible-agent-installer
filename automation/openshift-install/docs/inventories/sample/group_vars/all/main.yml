# Where rendered manifests are written locally before applying to the cluster.
rhoso_render_dir: "./artifacts/{{ cluster_name }}/rendered"

# This will require trust and sudoers access
os_director_ip: 10.150.23.9
os_fabric_name: "openstack-llas1"

# Imaging network information
node_ipv4_prefix: 24
node_ipv4_gateway: "10.150.18.1"
rhoso_default_gw: "{{ node_ipv4_gateway }}"
node_dns_servers:
  - "10.146.16.248"
  - "10.146.16.249"

# iDRAC credentials (store with ansible-vault in real use)
idrac_user: root
idrac_password: "CHANGEME_VAULT_THIS"

# -----------------------------------------------------------------------------
# Openshift Assited installer
# -----------------------------------------------------------------------------

# Assisted Installer / Assisted Service endpoint
assisted_api_url: "https://api.openshift.com/api/assisted-install/v2"
# Choose one:
assisted_auth_mode: "saas"        # saas | onprem
assisted_offline_token: "CHANGEME_VAULT_THIS"  # only for saas
# assisted_access_token: ""       # only for onprem if you already have a bearer token

# Cluster identity
cluster_name: "openshift-llas1"
base_dns_domain: "ulti.io"
openshift_version: "4.18"
cpu_architecture: "x86_64"

# Nodes (must match hosts above)
control_plane_count: 3
compute_count: 6

# Networking (not discoverable from iDRAC)
machine_network_cidr: "10.150.18.0/24"
api_vip: "10.150.18.254"
ingress_vip: "10.150.18.253"
dns_servers: "{{ node_dns_servers }}"
ntp_servers:
  - "135.84.76.123"

# OCP networking (defaults are OK for most cases)
service_network_cidr: "172.30.0.0/16"
cluster_network_cidr: "10.128.0.0/14"
cluster_network_host_prefix: 23

# Primary Machine Network 
vlan_machine: 0

# RHOSO / OpenStack networks
vlan_external: 110
vlan_tenant: 120
vlan_internalapi: 130
vlan_storagemgmt: 140
vlan_storage: 150

# Extra storage segments
vlan_storage_1_1: 151
vlan_storage_1_2: 152
vlan_storage_2_2: 162
vlan_storage_3_1: 171
vlan_storage_3_2: 172

# NFS segments
vlan_nfs_1: 201
vlan_nfs_2: 202
vlan_nfs_3: 203

# Pull-secret and SSH key locations (files on the Ansible control node)
pull_secret_file: "./secrets/pull-secret.json"

# This should be the ~/stack/.ssh/id_rsa_tripleo.pub
ssh_public_key_file: "./secrets/id_rsa.pub"

# ISO delivery options
iso_delivery_mode: "local_http"   # direct_url | local_http
iso_http_port: 8080               # only for local_http # VALIDATE THIS IN PRODUCTION!!!!!!!!
iso_http_bind_ip: "0.0.0.0"       # only for local_http
iso_http_server: "10.150.23.9"
iso_http_dir: /tmp/ISOs

# Local outputs
artifacts_dir: "./artifacts"
output_kubeconfig: "./artifacts/{{ cluster_name }}/auth/kubeconfig"
output_kubeadmin_password: "./artifacts/{{ cluster_name }}/auth/kubeadmin-password"

# Local kubeconfig with cluster-admin access (kubeadmin is fine)
kubeconfig_path: "{{ output_kubeconfig }}"

# oc binary name/path on the Ansible control node
oc_bin: "~/bin/oc"

# OperatorHub source (connected) or your mirrored CatalogSource (disconnected)
operator_source: "redhat-operators"
operator_source_namespace: "openshift-marketplace"

# Channels (adjust if your org standardizes specific channels)
nmstate_channel: "stable"
metallb_channel: "stable"
cert_manager_channel: "stable-v1"
openstack_channel: "stable-v1.0"
rhoso_startingcsv: "1.0.19"

# Toggle optional operand CR creation
create_nmstate_cr: true
create_metallb_cr: true
create_certmanager_cr: true
create_openstack_cr: false

# Path to kubeconfig used by oc. You can also export KUBECONFIG in your shell instead.
rhoso_kubeconfig: "{{ output_kubeconfig }}"

# Controls password validation behavior.
# - HeatAuthEncryptionKey MUST be exactly 32 chars (per RHOSO docs).
# - Other passwords are recommended to be 32 chars as well.
rhoso_enforce_32char_passwords: true

# If true, generate any missing secret values on the controller host.
# Requires python3-cryptography ONLY if BarbicanSimpleCryptoKEK is missing.
rhoso_generate_missing_secrets: false

# If true, values provided in rhoso_osp_secret are already base64-encoded.
# Default (false): provide plaintext and the template will base64-encode into Secret.data.
rhoso_osp_secret_values_are_base64: false

# Namespace where RHOSO control plane services will run.
rhoso_project_name: "openstack"
rhoso_osp_secret_name: "osp-secret"

# Safety guardrails:
# - If true, fail whenever any required value remains "TBD!".
rhoso_fail_on_tbd: true

# NMState: label used to identify worker nodes (used for selectors).
rhoso_worker_label_key: "node-role.kubernetes.io/worker"

# MetalLB:
rhoso_metallb_namespace: "metallb-system"

# If true, create MetalLB resources (IPAddressPools / L2Advertisements).
rhoso_enable_metallb: false

# If true, patch OVN-Kubernetes gatewayConfig.ipForwarding to Global when needed.
rhoso_enable_ovn_global_forwarding: true

# -----------------------------------------------------------------------------
# RHOSO networking variables
# -----------------------------------------------------------------------------
# NOTE: Any missing IP or network value is intentionally set to "TBD!" so you can
#       fill it in before running with rhoso_fail_on_tbd: true.
# -----------------------------------------------------------------------------

# Worker nodes that will host RHOSO control plane pods (edit as needed).
# TODO: Dry this up. Worker nodes are already set in the inventory
rhoso_worker_nodes:
  - llas1rh1ocs1000
  - llas1rh1ocs1001
  - llas1rh1ocs1002
  - llas1rh1ocs2000
  - llas1rh1ocs2001
  - llas1rh1ocs2002
  - llas1rh1ocs3000
  - llas1rh1ocs3001
  - llas1rh1ocs3002

# Base interface used to create VLAN sub-interfaces for isolated networks.
# IMPORTANT: Do NOT use a base interface managed by the cluster network (for example, br-ex)
# unless your design explicitly supports it.
rhoso_isolated_base_iface: "bond0"

# Optional: Configure DNS resolvers via NMState desiredState (leave as-is if managed elsewhere).
rhoso_dns_nameservers:
  - 10.146.16.248
  - 10.146.16.249

# -----------------------------------------------------------------------------
# Isolated networks (defaults based on the "REDES" table you provided).
# - "pod_ipam_*" are used by Whereabouts IPAM for pods (NetworkAttachmentDefinition)
# - "metallb_pool_*" must be a NON-OVERLAPPING range used by MetalLB VIPs
# -----------------------------------------------------------------------------
rhoso_isolated_networks:
  - name: internalapi
    vip_enabled: true
    mtu: 9000
    vlan_id: 401
    subnet_cidr: "10.150.19.0/24"
    prefix_length: 24
    pod_ipam_start: "10.150.19.15"
    pod_ipam_end: "10.150.19.250"
    metallb_pool_start: "TBD!"
    metallb_pool_end: "TBD!"
    metallb_advertise_interface: "internalapi"

  - name: storage
    vip_enabled: true
    mtu: 9000
    vlan_id: 402
    subnet_cidr: "10.150.20.0/24"
    prefix_length: 24
    pod_ipam_start: "10.150.20.15"
    pod_ipam_end: "10.150.20.250"
    metallb_pool_start: "TBD!"
    metallb_pool_end: "TBD!"
    metallb_advertise_interface: "storage"

  - name: tenant
    vip_enabled: true
    mtu: 9000
    vlan_id: 403
    subnet_cidr: "10.150.21.0/24"
    prefix_length: 24
    pod_ipam_start: "10.150.21.15"
    pod_ipam_end: "10.150.21.250"
    metallb_pool_start: "TBD!"
    metallb_pool_end: "TBD!"
    metallb_advertise_interface: "tenant"

  - name: storagemgmt
    vip_enabled: true
    mtu: 9000
    vlan_id: 404
    subnet_cidr: "10.150.22.0/24"
    prefix_length: 24
    pod_ipam_start: "10.150.22.15"
    pod_ipam_end: "10.150.22.250"
    metallb_pool_start: "TBD!"
    metallb_pool_end: "TBD!"
    metallb_advertise_interface: "storagemgmt"

  - name: external
    vip_enabled: true
    mtu: 9000
    vlan_id: 201
    subnet_cidr: "10.150.23.0/24"
    prefix_length: 24
    pod_ipam_start: "10.150.23.15"
    pod_ipam_end: "10.150.23.250"
    metallb_pool_start: "TBD!"
    metallb_pool_end: "TBD!"
    metallb_advertise_interface: "external"

