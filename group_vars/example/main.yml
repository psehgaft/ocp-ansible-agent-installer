  - examplerh1ocs3002

# Base interface used to create VLAN sub-interfaces for isolated networks.
# IMPORTANT: Do NOT use a base interface managed by the cluster network (for example, br-ex)
# unless your design explicitly supports it.
rhoso_isolated_base_iface: "bond0"

# Optional: Configure DNS resolvers via NMState desiredState (leave as-is if managed elsewhere).
rhoso_dns_nameservers:
  - 10.146.16.248
  - 10.146.16.249

# -----------------------------------------------------------------------------
# Isolated networks (defaults based on the "REDES" table you provided).
# - "pod_ipam_*" are used by Whereabouts IPAM for pods (NetworkAttachmentDefinition)
# - "metallb_pool_*" must be a NON-OVERLAPPING range used by MetalLB VIPs
# -----------------------------------------------------------------------------
rhoso_isolated_networks:
  - name: internal_api
    bond: bond0
    vip_enabled: true
    mtu: 9000
    vlan_id: 401
    subnet_cidr: "10.150.19.0/24"
    prefix_length: 24
    pod_ipam_start: "10.150.19.15"
    pod_ipam_end: "10.150.19.250"
    metallb_pool_start: "TBD!"
    metallb_pool_end: "TBD!"
    metallb_advertise_interface: "internal_api"
    os_subnet_id: "341e96d7-c42b-4b1b-8b1b-5b48cc8f81ca"

