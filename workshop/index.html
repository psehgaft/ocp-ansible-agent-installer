{id:"home",group:(lang==='es'?"Inicio":lang==='de'?"Startseite":lang==='pt'?"Início":"Home"),title:"OpenShift Automation Framework Workshop",summary:(lang==='es'?"Inicio del workshop: resultados, rutas de despliegue y materiales.":lang==='de'?"Workshop-Startseite: Ergebnisse, Bereitstellungspfade und Ressourcen.":lang==='pt'?"Início do workshop: resultados, caminhos de implementação e recursos.":"Workshop home: outcomes, deployment paths, and materials."),minutes:10,html:(lang==='es'?"<p style=\"text-align:center\"><img src=\"open-demo-days-logo.png\" alt=\"Open Demo Days\" style=\"width:min(230px,60%);height:auto\"></p><p>Este workshop despliega una base OpenShift repetible y basada en contratos con Assisted Installer y gestión fuera de banda Redfish, y luego aplica una base Day-2 ordenada y con puertas de preparación. Cada módulo construye el conjunto mínimo de salidas que exige el siguiente.</p><h3>Qué vas a lograr</h3><ul><li>Elige ansible-playbook o la GUI contenerizada para la misma instalación.</li><li>Configura clúster, red, BMC, runtime y secretos con validación.</li><li>Espeja imágenes de release y operadores para entornos parciales y air-gapped.</li><li>Arranca los hosts por Redfish, espera el registro e instala OpenShift.</li><li>Aplica la base Day-2 ordenada con GitOps o Ansible.</li><li>Audita la salud del clúster y levanta las puertas de preparación de los operadores.</li><li>Crea un segundo clúster desde ACM.</li><li>Quedarás listo para el reto: espejar, arrancar e instalar un perfil desde cero.</li></ul><h3>Los dos caminos de despliegue</h3><p>El repositorio admite dos caminos equivalentes para la instalación inicial: <strong>playbooks Ansible</strong> o la <strong>interfaz GUI</strong> contenerizada en un nodo bastión. Para el Día 2, los mismos operadores se entregan con <strong>GitOps</strong> (Argo CD) o <strong>Ansible</strong> directo. El clúster de ejemplo usa dos VIPs y modo conectado; el espejo con oc-mirror v2 solo aplica en implementaciones desconectadas.</p>":lang==='de'?"<p style=\"text-align:center\"><img src=\"open-demo-days-logo.png\" alt=\"Open Demo Days\" style=\"width:min(230px,60%);height:auto\"></p><p>Dieser Workshop stellt eine vertragsbasierte, wiederholbare OpenShift-Grundlage mit dem Assisted Installer und Redfish-Out-of-Band-Management bereit und wendet danach eine geordnete Day-2-Grundlage mit Readiness Gates an. Jedes Modul erzeugt genau die Ausgaben, die das nächste benötigt.</p><h3>Was du erreichen wirst</h3><ul><li>Wähle ansible-playbook oder die containerisierte GUI für dieselbe Installation.</li><li>Konfiguriere Cluster, Netzwerk, BMC, Runtime und Secrets mit Validierung.</li><li>Spiegele Release-Images und Operatoren für teilweise getrennte und Air-Gapped-Standorte.</li><li>Boote die Hosts über Redfish, warte auf die Registrierung und installiere OpenShift.</li><li>Wende die geordnete Day-2-Grundlage mit GitOps oder Ansible an.</li><li>Prüfe die Cluster-Gesundheit und hebe die Operator Readiness Gates auf.</li><li>Erstelle einen zweiten Cluster von ACM.</li><li>Du bist bereit für den Challenge: ein Profil spiegeln, booten und von Grund auf installieren.</li></ul><h3>Die zwei Bereitstellungspfade</h3><p>Das Repository unterstützt zwei gleichwertige Pfade für die Erstinstallation: <strong>Ansible-Playbooks</strong> oder die containerisierte <strong>GUI</strong> auf einem Bastion-Knoten. Für Day 2 werden dieselben Operatoren mit <strong>GitOps</strong> (Argo CD) oder direktem <strong>Ansible</strong> ausgeliefert. Der Beispiel-Cluster nutzt zwei VIPs und den Connected-Modus; das Spiegeln mit oc-mirror v2 gilt nur für getrennte Bereitstellungen.</p>":lang==='pt'?"<p style=\"text-align:center\"><img src=\"open-demo-days-logo.png\" alt=\"Open Demo Days\" style=\"width:min(230px,60%);height:auto\"></p><p>Este workshop implementa uma fundação OpenShift repetível e baseada em contratos com o Assisted Installer e gestão fora de banda Redfish, e depois aplica uma fundação Day-2 ordenada e com gates de prontidão. Cada módulo constrói o conjunto mínimo de saídas que o seguinte exige.</p><h3>O que vais alcançar</h3><ul><li>Escolhe ansible-playbook ou a GUI contentorizada para a mesma instalação.</li><li>Configura cluster, rede, BMC, runtime e segredos com validação.</li><li>Espelha imagens de release e operadores para ambientes parcialmente desligados e air-gapped.</li><li>Arranca os hosts por Redfish, aguarda o registo e instala o OpenShift.</li><li>Aplica a fundação Day-2 ordenada com GitOps ou Ansible.</li><li>Audita a saúde do cluster e levanta as gates de prontidão dos operadores.</li><li>Cria um segundo cluster a partir do ACM.</li><li>Ficas pronto para o desafio: espelhar, arrancar e instalar um perfil a partir do zero.</li></ul><h3>Os dois caminhos de implementação</h3><p>O repositório suporta dois caminhos equivalentes para a instalação inicial: <strong>playbooks Ansible</strong> ou a <strong>interface GUI</strong> contentorizada num nó bastião. Para o Day 2, os mesmos operadores são entregues com <strong>GitOps</strong> (Argo CD) ou <strong>Ansible</strong> direto. O cluster de exemplo usa dois VIPs e modo connected; o espelho com oc-mirror v2 aplica-se apenas a implementações desligadas.</p>":"<p style=\"text-align:center\"><img src=\"open-demo-days-logo.png\" alt=\"Open Demo Days\" style=\"width:min(230px,60%);height:auto\"></p><p>This workshop deploys a contract-first, repeatable OpenShift foundation with the Assisted Installer and Redfish out-of-band management, then applies an ordered, readiness-gated Day-2 foundation. Every module builds the minimum set of outputs the next one requires.</p><h3>What you will achieve</h3><ul><li>Choose ansible-playbook or the containerized GUI for the same installation.</li><li>Configure cluster, network, BMC, runtime, and secrets with validation.</li><li>Mirror release images and operators for partially disconnected and air-gapped sites.</li><li>Boot hosts through Redfish, wait for registration, and install OpenShift.</li><li>Apply the ordered Day-2 foundation with GitOps or Ansible.</li><li>Audit cluster health and raise operator readiness gates.</li><li>Create a second cluster from ACM.</li><li>Finish ready for the challenge: mirror, boot, and install a profile from scratch.</li></ul><h3>The two deployment paths</h3><p>The repository supports two equivalent paths for the initial installation: <strong>Ansible playbooks</strong> or the containerized <strong>GUI interface</strong> on a bastion node. For Day 2, the same operators are delivered with <strong>GitOps</strong> (Argo CD) or direct <strong>Ansible</strong>. The sample cluster uses two VIPs and connected mode; oc-mirror v2 mirroring applies only to disconnected deployments.</p>"),checks:[]},
{id:"deploy-playbooks",group:(lang==='es'?"Rutas de despliegue":lang==='de'?"Bereitstellungspfade":lang==='pt'?"Caminhos de implementação":"Deployment paths"),title:"1. Deployment with Playbooks",summary:(lang==='es'?"La ruta de referencia: qué editar y rellenar en cada archivo, preflight y site.yml.":lang==='de'?"Der Referenzpfad: was du in jeder Datei bearbeiten und ausfüllen musst, Preflight und site.yml.":lang==='pt'?"O caminho de referência: o que editar e preencher em cada ficheiro, preflight e site.yml.":"The reference path: what to edit and fill in each file, preflight, and site.yml."),minutes:25,html:(lang==='es'?"<p>La ruta de playbooks es la referencia: el mismo grafo de tareas que envuelve la GUI. Las ejecuciones son de grano grueso y no usan <code>--limit</code> salvo en auditorías de solo lectura documentadas y en limpiezas con objetivo.</p><h3>Qué tienes que editar y rellenar</h3><p>Nunca ejecutes contra el ejemplo sin editarlo: copia el inventario y rellena la copia. El preflight falla si queda cualquier marcador <code>CHANGE_ME</code>.</p><pre><code>cp -r inventories/sample inventories/prod</code></pre><ol><li><strong><code>inventories/prod/hosts.yml</code></strong> — un bloque por servidor, bajo <code>control_plane</code> (masters) o <code>workers</code>. Por host: <code>bmc_type</code> (<code>ilo</code>, <code>idrac</code>, <code>generic</code> o <code>auto</code>), <code>bmc_endpoint</code> con la IP real del BMC (<code>https://&lt;IP-iLO/iDRAC&gt;</code>), <code>node_role</code> (<code>master</code> o <code>worker</code>), <code>node_hostname</code> final y <code>node_ipv4_address</code> estática sin prefijo. Opcionales: <code>installation_disk_id</code> (ruta estable <code>/dev/disk/by-id/…</code>) y <code>mac_interface_map_override</code> si el orden de NICs es ambiguo. <strong>No toques</strong> <code>bmc_username</code> ni <code>bmc_password</code>: se resuelven desde el Vault por nombre de host del inventario.</li><li><strong><code>group_vars/all/00-required.yml</code></strong> — <code>cluster_name</code> (sustituye <code>CHANGE_ME_CLUSTER_NAME</code>), <code>base_dns_domain</code>, <code>openshift_version</code>, <code>deployment_mode</code> (<code>connected</code> o <code>disconnected</code>), conteos que coincidan con tu lista de hosts, <code>machine_networks</code>, <code>cluster_networks</code>, <code>service_networks</code>, <code>vip_allocation_mode</code> y las VIPs <code>api_vips</code> e <code>ingress_vips</code>.</li><li><strong><code>group_vars/all/10-assisted-installer.yml</code></strong> — <code>assisted_auth_mode</code>: <code>saas</code> (URL pública predeterminada) u <code>onprem</code> (apunta <code>assisted_api_url</code> a tu servicio local).</li><li><strong><code>group_vars/all/20-network.yml</code></strong> — <code>node_dns_servers</code> reales, modo <code>static</code> o <code>dhcp</code> y, si usas bond, las interfaces de <code>install_network_bond_ports</code>.</li><li><strong><code>group_vars/all/30-disconnected.yml</code></strong> — solo si <code>deployment_mode: disconnected</code>: <code>disconnected_environment</code>, <code>oc_mirror_workflow</code> y <code>oc_mirror_registry</code> de tu registro espejo.</li><li><strong><code>group_vars/all/50-runtime.yml</code></strong> — <code>iso_http_advertise_address</code>: sustituye <code>CHANGE_ME_CONTROL_NODE_IP</code> por la IP alcanzable del bastión.</li><li><strong><code>group_vars/vault.yml</code></strong> — cópialo de <code>vault.yml.example</code> y rellena: <code>vault_pull_secret</code> (descargado de la consola de Red Hat), <code>vault_ssh_public_key</code>, <code>vault_assisted_offline_token</code> (token de API de tu cuenta en cloud.redhat.com; solo modo saas — en onprem usa <code>vault_assisted_access_token</code>) y <code>vault_bmc_credentials</code> con una entrada por cada nombre de host del inventario (master-0, worker-0…) con el usuario y la contraseña de administración de su iLO/iDRAC. Después cifra el archivo: <code>ansible-vault encrypt inventories/prod/group_vars/vault.yml</code>.</li><li><strong>Contraseña del Vault</strong> — exporta <code>ANSIBLE_VAULT_PASSWORD_FILE</code> o pasa <code>--ask-vault-pass</code> para que los playbooks puedan leer los secretos.</li></ol><h3>Preflight y ejecución</h3><pre><code>ansible-galaxy collection install -r collections/requirements.yml\n./scripts/preflight.sh inventories/prod/hosts.yml\nmake validate INVENTORY=inventories/prod/hosts.yml\nansible-playbook -i inventories/prod/hosts.yml playbooks/site.yml</code></pre><p>El preflight comprueba las herramientas (python3, ansible, curl, jq, oc, podman), que no quede ningún <code>CHANGE_ME</code> y que el Vault esté cifrado. <code>site.yml</code> ejecuta en orden: assisted_mirror → assisted_sync → assisted_boot → assisted_install.</p><h3>Día 2 por CLI</h3><pre><code>make day2-render\nmake day2-deploy   # GitOps\n# o Ansible directo:\nansible-playbook -i inventories/prod/hosts.yml playbooks/day2.yml</code></pre>":lang==='de'?"<p>Der Playbook-Pfad ist die Referenz: derselbe Task-Graph, den die GUI umschließt. Läufe sind grobkörnig und nutzen <code>--limit</code> nur für dokumentierte Read-only-Audits und gezielte Bereinigungen.</p><h3>Was du bearbeiten und ausfüllen musst</h3><p>Führe niemals das unbearbeitete Beispiel aus: Kopiere das Inventar und fülle die Kopie aus. Preflight schlägt fehl, wenn ein <code>CHANGE_ME</code>-Platzhalter übrig bleibt.</p><pre><code>cp -r inventories/sample inventories/prod</code></pre><ol><li><strong><code>inventories/prod/hosts.yml</code></strong> — ein Block pro Server, unter <code>control_plane</code> (Masters) oder <code>workers</code>. Pro Host: <code>bmc_type</code> (<code>ilo</code>, <code>idrac</code>, <code>generic</code> oder <code>auto</code>), <code>bmc_endpoint</code> mit der echten BMC-IP (<code>https://&lt;iLO/iDRAC-IP&gt;</code>), <code>node_role</code> (<code>master</code> oder <code>worker</code>), der endgültige <code>node_hostname</code> und eine statische <code>node_ipv4_address</code> ohne Präfix. Optional: <code>installation_disk_id</code> (ein stabiler <code>/dev/disk/by-id/…</code>-Pfad) und <code>mac_interface_map_override</code>, wenn die NIC-Reihenfolge mehrdeutig ist. <strong>Nicht anfassen:</strong> <code>bmc_username</code> und <code>bmc_password</code> — sie werden aus dem Vault per Inventar-Hostname aufgelöst.</li><li><strong><code>group_vars/all/00-required.yml</code></strong> — <code>cluster_name</code> (ersetze <code>CHANGE_ME_CLUSTER_NAME</code>), <code>base_dns_domain</code>, <code>openshift_version</code>, <code>deployment_mode</code> (<code>connected</code> oder <code>disconnected</code>), Anzahlen passend zu deiner Hostliste, <code>machine_networks</code>, <code>cluster_networks</code>, <code>service_networks</code>, <code>vip_allocation_mode</code> sowie <code>api_vips</code> und <code>ingress_vips</code>.</li><li><strong><code>group_vars/all/10-assisted-installer.yml</code></strong> — <code>assisted_auth_mode</code>: <code>saas</code> (Standard-URL) oder <code>onprem</code> (setze <code>assisted_api_url</code> auf deinen lokalen Dienst).</li><li><strong><code>group_vars/all/20-network.yml</code></strong> — echte <code>node_dns_servers</code>, Modus <code>static</code> oder <code>dhcp</code> und, bei Bonding, die Interfaces in <code>install_network_bond_ports</code>.</li><li><strong><code>group_vars/all/30-disconnected.yml</code></strong> — nur bei <code>deployment_mode: disconnected</code>: <code>disconnected_environment</code>, <code>oc_mirror_workflow</code> und die <code>oc_mirror_registry</code> deiner Mirror-Registry.</li><li><strong><code>group_vars/all/50-runtime.yml</code></strong> — <code>iso_http_advertise_address</code>: Ersetze <code>CHANGE_ME_CONTROL_NODE_IP</code> durch die erreichbare IP der Bastion.</li><li><strong><code>group_vars/vault.yml</code></strong> — kopiere sie aus <code>vault.yml.example</code> und fülle aus: <code>vault_pull_secret</code> (aus der Red-Hat-Konsole heruntergeladen), <code>vault_ssh_public_key</code>, <code>vault_assisted_offline_token</code> (das API-Token deines cloud.redhat.com-Kontos; nur saas-Modus — onprem nutzt <code>vault_assisted_access_token</code>) und <code>vault_bmc_credentials</code> mit einem Eintrag pro Inventar-Hostname (master-0, worker-0…) mit Administrator-Benutzer und Passwort des jeweiligen iLO/iDRAC. Verschlüssele die Datei danach: <code>ansible-vault encrypt inventories/prod/group_vars/vault.yml</code>.</li><li><strong>Vault-Passwort</strong> — exportiere <code>ANSIBLE_VAULT_PASSWORD_FILE</code> oder übergebe <code>--ask-vault-pass</code>, damit die Playbooks die Secrets lesen können.</li></ol><h3>Preflight und Ausführung</h3><pre><code>ansible-galaxy collection install -r collections/requirements.yml\n./scripts/preflight.sh inventories/prod/hosts.yml\nmake validate INVENTORY=inventories/prod/hosts.yml\nansible-playbook -i inventories/prod/hosts.yml playbooks/site.yml</code></pre><p>Preflight prüft die Werkzeuge (python3, ansible, curl, jq, oc, podman), dass kein <code>CHANGE_ME</code> übrig ist und dass der Vault verschlüsselt ist. <code>site.yml</code> führt in dieser Reihenfolge aus: assisted_mirror → assisted_sync → assisted_boot → assisted_install.</p><h3>Day 2 per CLI</h3><pre><code>make day2-render\nmake day2-deploy   # GitOps\n# oder direktes Ansible:\nansible-playbook -i inventories/prod/hosts.yml playbooks/day2.yml</code></pre>":lang==='pt'?"<p>O caminho dos playbooks é a referência: o mesmo grafo de tarefas que a GUI envolve. As execuções são de grão grosso e não usam <code>--limit</code> exceto em auditorias só de leitura documentadas e limpezas dirigidas.</p><h3>O que tens de editar e preencher</h3><p>Nunca executes o exemplo sem editar: copia o inventário e preenche a cópia. O preflight falha se restar qualquer marcador <code>CHANGE_ME</code>.</p><pre><code>cp -r inventories/sample inventories/prod</code></pre><ol><li><strong><code>inventories/prod/hosts.yml</code></strong> — um bloco por servidor, em <code>control_plane</code> (masters) ou <code>workers</code>. Por host: <code>bmc_type</code> (<code>ilo</code>, <code>idrac</code>, <code>generic</code> ou <code>auto</code>), <code>bmc_endpoint</code> com o IP real do BMC (<code>https://&lt;IP-iLO/iDRAC&gt;</code>), <code>node_role</code> (<code>master</code> ou <code>worker</code>), o <code>node_hostname</code> final e um <code>node_ipv4_address</code> estático sem prefixo. Opcionais: <code>installation_disk_id</code> (um caminho estável <code>/dev/disk/by-id/…</code>) e <code>mac_interface_map_override</code> quando a ordem das NICs é ambígua. <strong>Não toques</strong> em <code>bmc_username</code> nem <code>bmc_password</code>: resolvem-se a partir do Vault pelo nome de host do inventário.</li><li><strong><code>group_vars/all/00-required.yml</code></strong> — <code>cluster_name</code> (substitui <code>CHANGE_ME_CLUSTER_NAME</code>), <code>base_dns_domain</code>, <code>openshift_version</code>, <code>deployment_mode</code> (<code>connected</code> ou <code>disconnected</code>), contagens que coincidam com a tua lista de hosts, <code>machine_networks</code>, <code>cluster_networks</code>, <code>service_networks</code>, <code>vip_allocation_mode</code> e as VIPs <code>api_vips</code> e <code>ingress_vips</code>.</li><li><strong><code>group_vars/all/10-assisted-installer.yml</code></strong> — <code>assisted_auth_mode</code>: <code>saas</code> (URL pública predefinida) ou <code>onprem</code> (aponta <code>assisted_api_url</code> para o teu serviço local).</li><li><strong><code>group_vars/all/20-network.yml</code></strong> — <code>node_dns_servers</code> reais, modo <code>static</code> ou <code>dhcp</code> e, se usares bond, as interfaces em <code>install_network_bond_ports</code>.</li><li><strong><code>group_vars/all/30-disconnected.yml</code></strong> — só com <code>deployment_mode: disconnected</code>: <code>disconnected_environment</code>, <code>oc_mirror_workflow</code> e a <code>oc_mirror_registry</code> do teu registo espelho.</li><li><strong><code>group_vars/all/50-runtime.yml</code></strong> — <code>iso_http_advertise_address</code>: substitui <code>CHANGE_ME_CONTROL_NODE_IP</code> pelo IP alcançável do bastião.</li><li><strong><code>group_vars/vault.yml</code></strong> — copia de <code>vault.yml.example</code> e preenche: <code>vault_pull_secret</code> (descarregado da consola Red Hat), <code>vault_ssh_public_key</code>, <code>vault_assisted_offline_token</code> (o token de API da tua conta cloud.redhat.com; apenas no modo saas — onprem usa <code>vault_assisted_access_token</code>) e <code>vault_bmc_credentials</code> com uma entrada por cada nome de host do inventário (master-0, worker-0…) com o utilizador e a palavra-passe de administração do seu iLO/iDRAC. Depois cifra o ficheiro: <code>ansible-vault encrypt inventories/prod/group_vars/vault.yml</code>.</li><li><strong>Palavra-passe do Vault</strong> — exporta <code>ANSIBLE_VAULT_PASSWORD_FILE</code> ou passa <code>--ask-vault-pass</code> para os playbooks poderem ler os segredos.</li></ol><h3>Preflight e execução</h3><pre><code>ansible-galaxy collection install -r collections/requirements.yml\n./scripts/preflight.sh inventories/prod/hosts.yml\nmake validate INVENTORY=inventories/prod/hosts.yml\nansible-playbook -i inventories/prod/hosts.yml playbooks/site.yml</code></pre><p>O preflight verifica as ferramentas (python3, ansible, curl, jq, oc, podman), que não resta nenhum <code>CHANGE_ME</code> e que o Vault está cifrado. O <code>site.yml</code> executa, por ordem: assisted_mirror → assisted_sync → assisted_boot → assisted_install.</p><h3>Day 2 pela CLI</h3><pre><code>make day2-render\nmake day2-deploy   # GitOps\n# ou Ansible direto:\nansible-playbook -i inventories/prod/hosts.yml playbooks/day2.yml</code></pre>":"<p>The playbook path is the reference: the same task graph the GUI wraps. Runs are coarse-grained and do not use <code>--limit</code> except for documented read-only audits and targeted cleanup.</p><h3>What you must edit and fill in</h3><p>Never run against the sample unedited: copy the inventory and fill in the copy. Preflight fails if any <code>CHANGE_ME</code> placeholder remains.</p><pre><code>cp -r inventories/sample inventories/prod</code></pre><ol><li><strong><code>inventories/prod/hosts.yml</code></strong> — one block per server, under <code>control_plane</code> (masters) or <code>workers</code>. Per host: <code>bmc_type</code> (<code>ilo</code>, <code>idrac</code>, <code>generic</code>, or <code>auto</code>), <code>bmc_endpoint</code> with the real BMC IP (<code>https://&lt;iLO/iDRAC-IP&gt;</code>), <code>node_role</code> (<code>master</code> or <code>worker</code>), the final <code>node_hostname</code>, and a static <code>node_ipv4_address</code> without prefix. Optional: <code>installation_disk_id</code> (a stable <code>/dev/disk/by-id/…</code> path) and <code>mac_interface_map_override</code> when NIC ordering is ambiguous. <strong>Do not touch</strong> <code>bmc_username</code> or <code>bmc_password</code>: they resolve from the Vault by inventory hostname.</li><li><strong><code>group_vars/all/00-required.yml</code></strong> — <code>cluster_name</code> (replace <code>CHANGE_ME_CLUSTER_NAME</code>), <code>base_dns_domain</code>, <code>openshift_version</code>, <code>deployment_mode</code> (<code>connected</code> or <code>disconnected</code>), counts that match your host list, <code>machine_networks</code>, <code>cluster_networks</code>, <code>service_networks</code>, <code>vip_allocation_mode</code>, and the <code>api_vips</code> and <code>ingress_vips</code>.</li><li><strong><code>group_vars/all/10-assisted-installer.yml</code></strong> — <code>assisted_auth_mode</code>: <code>saas</code> (default public URL) or <code>onprem</code> (point <code>assisted_api_url</code> at your local service).</li><li><strong><code>group_vars/all/20-network.yml</code></strong> — real <code>node_dns_servers</code>, <code>static</code> or <code>dhcp</code> mode, and, when bonding, the interfaces in <code>install_network_bond_ports</code>.</li><li><strong><code>group_vars/all/30-disconnected.yml</code></strong> — only when <code>deployment_mode: disconnected</code>: <code>disconnected_environment</code>, <code>oc_mirror_workflow</code>, and the <code>oc_mirror_registry</code> of your mirror registry.</li><li><strong><code>group_vars/all/50-runtime.yml</code></strong> — <code>iso_http_advertise_address</code>: replace <code>CHANGE_ME_CONTROL_NODE_IP</code> with the bastion's reachable IP.</li><li><strong><code>group_vars/vault.yml</code></strong> — copy it from <code>vault.yml.example</code> and fill in: <code>vault_pull_secret</code> (downloaded from the Red Hat console), <code>vault_ssh_public_key</code>, <code>vault_assisted_offline_token</code> (the API token from your cloud.redhat.com account; saas mode only — onprem uses <code>vault_assisted_access_token</code>), and <code>vault_bmc_credentials</code> with one entry per inventory hostname (master-0, worker-0…) holding that server's iLO/iDRAC administrator user and password. Then encrypt the file: <code>ansible-vault encrypt inventories/prod/group_vars/vault.yml</code>.</li><li><strong>Vault password</strong> — export <code>ANSIBLE_VAULT_PASSWORD_FILE</code> or pass <code>--ask-vault-pass</code> so the playbooks can read the secrets.</li></ol><h3>Preflight and run</h3><pre><code>ansible-galaxy collection install -r collections/requirements.yml\n./scripts/preflight.sh inventories/prod/hosts.yml\nmake validate INVENTORY=inventories/prod/hosts.yml\nansible-playbook -i inventories/prod/hosts.yml playbooks/site.yml</code></pre><p>Preflight checks the tools (python3, ansible, curl, jq, oc, podman), that no <code>CHANGE_ME</code> remains, and that the Vault is encrypted. <code>site.yml</code> runs, in order: assisted_mirror → assisted_sync → assisted_boot → assisted_install.</p><h3>Day 2 from the CLI</h3><pre><code>make day2-render\nmake day2-deploy   # GitOps\n# or direct Ansible:\nansible-playbook -i inventories/prod/hosts.yml playbooks/day2.yml</code></pre>"),checks:[]},
{id:"deploy-gui",group:(lang==='es'?"Rutas de despliegue":lang==='de'?"Bereitstellungspfade":lang==='pt'?"Caminhos de implementação":"Deployment paths"),title:"2. Deployment with the GUI Interface",summary:(lang==='es'?"Formularios guiados: cómo llenar las variables, los grupos y de dónde sale cada token.":lang==='de'?"Geführte Formulare: Variablen ausfüllen, Gruppen und die Herkunft jedes Tokens.":lang==='pt'?"Formulários guiados: como preencher as variáveis, os grupos e de onde vem cada token.":"Guided forms: how to fill in the variables, the groups, and where each token comes from."),minutes:30,html:(lang==='es'?"<p>La GUI es un servicio Go contenerizado que convierte los mismos contratos YAML en formularios guiados, guarda cada configuración como perfil y ejecuta solo acciones permitidas por lista. El enfoque sigue siendo deliberadamente un servicio de bastión, no un operador de Kubernetes.</p><h3>Cómo llenar las variables</h3><p>No se edita YAML a mano. La GUI genera sus formularios desde los valores predeterminados de <code>inventories/sample/group_vars/all/*.yml</code> y los presenta precargados: cambia solo lo que difiere en tu entorno. Los campos obligatorios están marcados (nombre de clúster, dominio DNS base, versión, conteo de nodos y redes), y los campos condicionales aparecen según tus elecciones — el grupo Disconnected solo se muestra con <code>deployment_mode: disconnected</code>, y el token offline solo con <code>assisted_auth_mode: saas</code>. Las listas de redes se editan como YAML en su campo. Al guardar, la GUI pide la contraseña del Vault: escribe el inventario del perfil en <code>/data</code> y cifra todos los secretos; después, el botón <strong>Validate</strong> ejecuta los mismos contratos que los playbooks y lista los errores por campo. Los secretos guardados nunca se vuelven a mostrar: la GUI solo indica si están definidos o no.</p><pre><code>export INSTALLER_UI_AUTH_TOKENS=\"$(openssl rand -hex 24)=admin\"\nprintf 'INSTALLER_UI_AUTH_TOKENS=%s\\n' \"$INSTALLER_UI_AUTH_TOKENS\" &gt; .installer-ui.vault\nchmod 600 .installer-ui.vault\npodman compose build --no-cache installer-ui\npodman compose up -d   # http://127.0.0.1:8080</code></pre><h3>Grupos de variables que se deben usar</h3><ul><li><strong>Cluster</strong> (00-required): <code>deployment_mode</code>, <code>cluster_name</code>, <code>base_dns_domain</code>, <code>openshift_version</code>, <code>control_plane_count</code>, <code>compute_count</code>, redes de máquinas/clúster/servicios y VIPs de API e ingress.</li><li><strong>Assisted Installer API</strong> (10-assisted-installer): <code>assisted_api_url</code> y <code>assisted_auth_mode</code> (<code>saas</code> u <code>onprem</code>).</li><li><strong>Networking</strong> (20-network): <code>node_network_config_mode</code> (static o dhcp), servidores DNS y modo de interfaz (single o bond).</li><li><strong>Disconnected</strong> (30-disconnected): <code>disconnected_environment</code>, <code>oc_mirror_workflow</code> y el registro espejo — solo aplica en modo disconnected.</li><li><strong>BMC / Redfish</strong> (40-bmc): validación de certificados, tiempos de espera y dispositivo de arranque, más una <strong>tarjeta por host</strong>: nombre, rol (control plane o worker), tipo de BMC (auto, iLO, iDRAC o genérico), endpoint HTTPS, MAC, disco de instalación y red estática o DHCP.</li><li><strong>Runtime</strong> (50-runtime): directorio de artefactos y modo de entrega de la ISO.</li><li><strong>Day-2 GitOps</strong> (60-day2-gitops): repositorio y rama de estado deseado, perfiles y la selección de operadores del Día 2.</li><li><strong>Secrets</strong> (Vault): pull secret, llave pública SSH, token offline de Assisted Installer y las credenciales BMC de cada host — se guardan solo cifrados en <code>vault.yml</code>.</li></ul><h3>De dónde sale cada token</h3><ul><li><strong>Token de acceso a la GUI</strong> — lo generas tú; no viene de Red Hat ni de ningún servicio. Se exporta siempre así: <code>export INSTALLER_UI_AUTH_TOKENS=\"$(openssl rand -hex 24)=admin\"</code> (el token aleatorio tiene 48 caracteres, más del mínimo de 16). Guárdalo también en un archivo vault con el mismo nombre de la variable, <code>.installer-ui.vault</code> (permisos 600), y cárgalo en sesiones posteriores con <code>set -a; . ./.installer-ui.vault; set +a</code>. Así lo consumen igual <code>make gui-run</code>, Compose y el script de PowerShell. El formato es <code>token=rol</code>, con roles <code>viewer</code> (solo lectura), <code>operator</code> y <code>admin</code>, y se pueden declarar varios tokens separados por comas para distintas personas. La parte anterior al <code>=</code> es el token que tecleas en la pantalla de acceso de la GUI.</li><li><strong>Token offline de Assisted Installer</strong> (solo modo <code>saas</code>) — se genera en tu cuenta de Red Hat: en <strong>cloud.redhat.com</strong> (página de tokens de la API de OpenShift) creas el token offline y lo pegas en el grupo Secrets como <code>vault_assisted_offline_token</code>. En modo <code>onprem</code> no se usa: se usa el token de acceso del servicio Assisted local (<code>vault_assisted_access_token</code>).</li><li><strong>Pull secret</strong> — se descarga de la misma consola de Red Hat y se pega en Secrets (<code>vault_pull_secret</code>). Las <strong>credenciales BMC</strong> salen de cada servidor físico: el usuario y la contraseña de administración de su iLO o iDRAC, una por tarjeta de host.</li></ul><p>Orden de ejecución desde la GUI: <strong>validate → assisted_preflight → assisted_mirror → assisted_sync → assisted_boot → assisted_install → day2</strong>. Todas las acciones son las mismas que ejecutan los playbooks; la GUI nunca acepta un comando arbitrario.</p>":lang==='de'?"<p>Die GUI ist ein containerisierter Go-Dienst, der dieselben YAML-Verträge in geführte Formulare verwandelt, jede Konfiguration als Profil speichert und nur Aktionen von der Allowlist ausführt. Der Ansatz bleibt bewusst ein Bastion-Dienst, kein Kubernetes-Operator.</p><h3>So füllst du die Variablen aus</h3><p>Du bearbeitest kein YAML von Hand. Die GUI erzeugt ihre Formulare aus den Standardwerten in <code>inventories/sample/group_vars/all/*.yml</code> und zeigt sie vorausgefüllt: Ändere nur, was in deiner Umgebung anders ist. Pflichtfelder sind markiert (Clustername, Basis-DNS-Domain, Version, Knotenanzahl und Netzwerke), und bedingte Felder erscheinen je nach Auswahl — die Gruppe Disconnected erscheint nur mit <code>deployment_mode: disconnected</code> und das Offline-Token nur mit <code>assisted_auth_mode: saas</code>. Netzwerklisten werden als YAML in ihrem Feld bearbeitet. Beim Speichern fragt die GUI nach dem Vault-Passwort: Sie schreibt das Profil-Inventar nach <code>/data</code> und verschlüsselt alle Secrets; danach führt der Button <strong>Validate</strong> dieselben Verträge wie die Playbooks aus und listet Fehler pro Feld. Gespeicherte Secrets werden nie wieder angezeigt: Die GUI meldet nur, ob sie gesetzt sind oder nicht.</p><pre><code>export INSTALLER_UI_AUTH_TOKENS=\"$(openssl rand -hex 24)=admin\"\nprintf 'INSTALLER_UI_AUTH_TOKENS=%s\\n' \"$INSTALLER_UI_AUTH_TOKENS\" &gt; .installer-ui.vault\nchmod 600 .installer-ui.vault\npodman compose build --no-cache installer-ui\npodman compose up -d   # http://127.0.0.1:8080</code></pre><h3>Variablengruppen, die du verwenden musst</h3><ul><li><strong>Cluster</strong> (00-required): <code>deployment_mode</code>, <code>cluster_name</code>, <code>base_dns_domain</code>, <code>openshift_version</code>, <code>control_plane_count</code>, <code>compute_count</code>, Maschinen-/Cluster-/Service-Netzwerke sowie API- und Ingress-VIPs.</li><li><strong>Assisted Installer API</strong> (10-assisted-installer): <code>assisted_api_url</code> und <code>assisted_auth_mode</code> (<code>saas</code> oder <code>onprem</code>).</li><li><strong>Networking</strong> (20-network): <code>node_network_config_mode</code> (static oder dhcp), DNS-Server und Interface-Modus (single oder bond).</li><li><strong>Disconnected</strong> (30-disconnected): <code>disconnected_environment</code>, <code>oc_mirror_workflow</code> und die Mirror-Registry — gilt nur im disconnected-Modus.</li><li><strong>BMC / Redfish</strong> (40-bmc): Zertifikatsprüfung, Timeouts und Boot-Gerät, plus eine <strong>Karte pro Host</strong>: Name, Rolle (Control Plane oder Worker), BMC-Typ (auto, iLO, iDRAC oder generisch), HTTPS-Endpunkt, MAC, Installations-Disk und statisches oder DHCP-Netzwerk.</li><li><strong>Runtime</strong> (50-runtime): Artefakt-Verzeichnis und ISO-Auslieferungsmodus.</li><li><strong>Day-2 GitOps</strong> (60-day2-gitops): Repository und Branch des Desired State, Profile und die Day-2-Operator-Auswahl.</li><li><strong>Secrets</strong> (Vault): Pull Secret, SSH Public Key, Assisted Installer Offline-Token und die BMC-Zugangsdaten jedes Hosts — nur verschlüsselt in <code>vault.yml</code> gespeichert.</li></ul><h3>Woher jedes Token kommt</h3><ul><li><strong>GUI-Zugangstoken</strong> — du erzeugst es selbst; es kommt weder von Red Hat noch von einem Dienst. Exportiere es immer so: <code>export INSTALLER_UI_AUTH_TOKENS=\"$(openssl rand -hex 24)=admin\"</code> (das Zufallstoken hat 48 Zeichen, mehr als das Minimum von 16). Speichere es zusätzlich in einer Vault-Datei unter demselben Variablennamen, <code>.installer-ui.vault</code> (Modus 600), und lade es in späteren Sitzungen mit <code>set -a; . ./.installer-ui.vault; set +a</code>. <code>make gui-run</code>, Compose und das PowerShell-Skript nutzen es gleichermaßen. Das Format ist <code>token=rolle</code> mit den Rollen <code>viewer</code> (nur Lesen), <code>operator</code> und <code>admin</code>, und mehrere Tokens lassen sich kommagetrennt für verschiedene Personen deklarieren. Der Teil vor dem <code>=</code> ist das Token, das du auf dem Anmeldebildschirm der GUI eingibst.</li><li><strong>Assisted Installer Offline-Token</strong> (nur im <code>saas</code>-Modus) — wird in deinem Red-Hat-Konto erzeugt: Auf <strong>cloud.redhat.com</strong> (Seite der OpenShift-API-Tokens) erstellst du das Offline-Token und fügst es in der Gruppe Secrets als <code>vault_assisted_offline_token</code> ein. Im <code>onprem</code>-Modus wird es nicht verwendet: Stattdessen kommt das Access-Token des lokalen Assisted-Dienstes zum Einsatz (<code>vault_assisted_access_token</code>).</li><li><strong>Pull Secret</strong> — wird aus derselben Red-Hat-Konsole heruntergeladen und in Secrets eingefügt (<code>vault_pull_secret</code>). Die <strong>BMC-Zugangsdaten</strong> stammen von jedem physischen Server: Administrator-Benutzer und Passwort seines iLO oder iDRAC, eines pro Host-Karte.</li></ul><p>Ausführungsreihenfolge in der GUI: <strong>validate → assisted_preflight → assisted_mirror → assisted_sync → assisted_boot → assisted_install → day2</strong>. Jede Aktion ist dieselbe, die auch die Playbooks ausführen; die GUI akzeptiert niemals einen beliebigen Befehl.</p>":lang==='pt'?"<p>A GUI é um serviço Go contentorizado que transforma os mesmos contratos YAML em formulários guiados, guarda cada configuração como perfil e executa apenas ações da lista permitida. A abordagem mantém-se deliberadamente um serviço de bastião, não um operador Kubernetes.</p><h3>Como preencher as variáveis</h3><p>Não editas YAML à mão. A GUI gera os formulários a partir dos valores predefinidos em <code>inventories/sample/group_vars/all/*.yml</code> e apresenta-os pré-carregados: altera apenas o que difere no teu ambiente. Os campos obrigatórios estão marcados (nome do cluster, domínio DNS base, versão, contagem de nós e redes), e os campos condicionais aparecem conforme as tuas escolhas — o grupo Disconnected só aparece com <code>deployment_mode: disconnected</code>, e o token offline só com <code>assisted_auth_mode: saas</code>. As listas de redes editam-se como YAML no seu campo. Ao guardar, a GUI pede a palavra-passe do Vault: escreve o inventário do perfil em <code>/data</code> e cifra todos os segredos; depois, o botão <strong>Validate</strong> executa os mesmos contratos dos playbooks e lista os erros por campo. Os segredos guardados nunca voltam a ser mostrados: a GUI só indica se estão definidos ou não.</p><pre><code>export INSTALLER_UI_AUTH_TOKENS=\"$(openssl rand -hex 24)=admin\"\nprintf 'INSTALLER_UI_AUTH_TOKENS=%s\\n' \"$INSTALLER_UI_AUTH_TOKENS\" &gt; .installer-ui.vault\nchmod 600 .installer-ui.vault\npodman compose build --no-cache installer-ui\npodman compose up -d   # http://127.0.0.1:8080</code></pre><h3>Grupos de variáveis que tens de usar</h3><ul><li><strong>Cluster</strong> (00-required): <code>deployment_mode</code>, <code>cluster_name</code>, <code>base_dns_domain</code>, <code>openshift_version</code>, <code>control_plane_count</code>, <code>compute_count</code>, redes de máquinas/cluster/serviços e VIPs de API e ingress.</li><li><strong>Assisted Installer API</strong> (10-assisted-installer): <code>assisted_api_url</code> e <code>assisted_auth_mode</code> (<code>saas</code> ou <code>onprem</code>).</li><li><strong>Networking</strong> (20-network): <code>node_network_config_mode</code> (static ou dhcp), servidores DNS e modo de interface (single ou bond).</li><li><strong>Disconnected</strong> (30-disconnected): <code>disconnected_environment</code>, <code>oc_mirror_workflow</code> e o registo espelho — aplica-se apenas no modo disconnected.</li><li><strong>BMC / Redfish</strong> (40-bmc): validação de certificados, tempos limite e dispositivo de arranque, mais um <strong>cartão por host</strong>: nome, função (control plane ou worker), tipo de BMC (auto, iLO, iDRAC ou genérico), endpoint HTTPS, MAC, disco de instalação e rede estática ou DHCP.</li><li><strong>Runtime</strong> (50-runtime): diretório de artefactos e modo de entrega da ISO.</li><li><strong>Day-2 GitOps</strong> (60-day2-gitops): repositório e branch do estado desejado, perfis e a seleção de operadores Day-2.</li><li><strong>Secrets</strong> (Vault): pull secret, chave pública SSH, token offline do Assisted Installer e as credenciais BMC de cada host — guardados apenas cifrados em <code>vault.yml</code>.</li></ul><h3>De onde vem cada token</h3><ul><li><strong>Token de acesso à GUI</strong> — geras tu mesmo; não vem da Red Hat nem de nenhum serviço. Exporta-o sempre assim: <code>export INSTALLER_UI_AUTH_TOKENS=\"$(openssl rand -hex 24)=admin\"</code> (o token aleatório tem 48 caracteres, acima do mínimo de 16). Guarda-o também num ficheiro vault com o mesmo nome da variável, <code>.installer-ui.vault</code> (modo 600), e carrega-o em sessões posteriores com <code>set -a; . ./.installer-ui.vault; set +a</code>. O <code>make gui-run</code>, o Compose e o script PowerShell consomem-no da mesma forma. O formato é <code>token=função</code>, com funções <code>viewer</code> (só leitura), <code>operator</code> e <code>admin</code>, e podem declarar-se vários tokens separados por vírgulas para pessoas diferentes. A parte antes do <code>=</code> é o token que escreves no ecrã de acesso da GUI.</li><li><strong>Token offline do Assisted Installer</strong> (apenas no modo <code>saas</code>) — gera-se na tua conta Red Hat: em <strong>cloud.redhat.com</strong> (página de tokens da API OpenShift) crias o token offline e colas no grupo Secrets como <code>vault_assisted_offline_token</code>. No modo <code>onprem</code> não se usa: usa-se o token de acesso do serviço Assisted local (<code>vault_assisted_access_token</code>).</li><li><strong>Pull secret</strong> — descarrega-se da mesma consola Red Hat e cola-se em Secrets (<code>vault_pull_secret</code>). As <strong>credenciais BMC</strong> vêm de cada servidor físico: o utilizador e a palavra-passe de administração do seu iLO ou iDRAC, um por cartão de host.</li></ul><p>Ordem de execução a partir da GUI: <strong>validate → assisted_preflight → assisted_mirror → assisted_sync → assisted_boot → assisted_install → day2</strong>. Todas as ações são as mesmas que os playbooks executam; a GUI nunca aceita um comando arbitrário.</p>":"<p>The GUI is a containerized Go service that turns the same YAML contracts into guided forms, stores each configuration as a profile, and runs only allowlisted actions. The approach stays deliberately a bastion service, not a Kubernetes operator.</p><h3>How to fill in the variables</h3><p>You do not edit YAML by hand. The GUI generates its forms from the defaults in <code>inventories/sample/group_vars/all/*.yml</code> and presents them preloaded: change only what differs in your environment. Required fields are marked (cluster name, base DNS domain, version, node counts, and networks), and conditional fields appear based on your choices — the Disconnected group shows only with <code>deployment_mode: disconnected</code>, and the offline token only with <code>assisted_auth_mode: saas</code>. Network lists are edited as YAML in their field. On save, the GUI asks for the Vault password: it writes the profile inventory to <code>/data</code> and encrypts every secret; afterwards, the <strong>Validate</strong> button runs the same contracts as the playbooks and lists errors per field. Saved secrets are never shown again: the GUI only reports whether they are set or not.</p><pre><code>export INSTALLER_UI_AUTH_TOKENS=\"$(openssl rand -hex 24)=admin\"\nprintf 'INSTALLER_UI_AUTH_TOKENS=%s\\n' \"$INSTALLER_UI_AUTH_TOKENS\" &gt; .installer-ui.vault\nchmod 600 .installer-ui.vault\npodman compose build --no-cache installer-ui\npodman compose up -d   # http://127.0.0.1:8080</code></pre><h3>Variable groups you must use</h3><ul><li><strong>Cluster</strong> (00-required): <code>deployment_mode</code>, <code>cluster_name</code>, <code>base_dns_domain</code>, <code>openshift_version</code>, <code>control_plane_count</code>, <code>compute_count</code>, machine/cluster/service networks, and API and ingress VIPs.</li><li><strong>Assisted Installer API</strong> (10-assisted-installer): <code>assisted_api_url</code> and <code>assisted_auth_mode</code> (<code>saas</code> or <code>onprem</code>).</li><li><strong>Networking</strong> (20-network): <code>node_network_config_mode</code> (static or dhcp), DNS servers, and the interface mode (single or bond).</li><li><strong>Disconnected</strong> (30-disconnected): <code>disconnected_environment</code>, <code>oc_mirror_workflow</code>, and the mirror registry — applies only in disconnected mode.</li><li><strong>BMC / Redfish</strong> (40-bmc): certificate validation, timeouts, and boot device, plus one <strong>card per host</strong>: name, role (control plane or worker), BMC type (auto, iLO, iDRAC, or generic), HTTPS endpoint, MAC, installation disk, and static or DHCP networking.</li><li><strong>Runtime</strong> (50-runtime): artifacts directory and ISO delivery mode.</li><li><strong>Day-2 GitOps</strong> (60-day2-gitops): desired-state repository and branch, profiles, and the Day-2 operator selection.</li><li><strong>Secrets</strong> (Vault): pull secret, SSH public key, Assisted Installer offline token, and the BMC credentials of each host — stored only encrypted in <code>vault.yml</code>.</li></ul><h3>Where each token comes from</h3><ul><li><strong>GUI access token</strong> — you generate it yourself; it does not come from Red Hat or any service. Always export it like this: <code>export INSTALLER_UI_AUTH_TOKENS=\"$(openssl rand -hex 24)=admin\"</code> (the random token has 48 characters, above the 16-character minimum). Also save it in a vault file under the same variable name, <code>.installer-ui.vault</code> (mode 600), and load it in later sessions with <code>set -a; . ./.installer-ui.vault; set +a</code>. <code>make gui-run</code>, Compose, and the PowerShell script all consume it the same way. The format is <code>token=role</code>, with roles <code>viewer</code> (read-only), <code>operator</code>, and <code>admin</code>, and several comma-separated tokens can be declared for different people. The part before the <code>=</code> is the token you type on the GUI login screen.</li><li><strong>Assisted Installer offline token</strong> (<code>saas</code> mode only) — generated in your Red Hat account: at <strong>cloud.redhat.com</strong> (the OpenShift API token page) you create the offline token and paste it into the Secrets group as <code>vault_assisted_offline_token</code>. In <code>onprem</code> mode it is not used: the access token of the local Assisted service is used instead (<code>vault_assisted_access_token</code>).</li><li><strong>Pull secret</strong> — downloaded from the same Red Hat console and pasted into Secrets (<code>vault_pull_secret</code>). The <strong>BMC credentials</strong> come from each physical server: the administrator user and password of its iLO or iDRAC, one per host card.</li></ul><p>Run order from the GUI: <strong>validate → assisted_preflight → assisted_mirror → assisted_sync → assisted_boot → assisted_install → day2</strong>. Every action is the same the playbooks run; the GUI never accepts an arbitrary command.</p>"),checks:[]},
{id:"operators",group:(lang==='es'?"Rutas de despliegue":lang==='de'?"Bereitstellungspfade":lang==='pt'?"Caminhos de implementação":"Deployment paths"),title:"3. Operators",summary:(lang==='es'?"El catálogo Day-2 ordenado y sus reglas de puertas.":lang==='de'?"Der geordnete Day-2-Katalog und seine Gate-Regeln.":lang==='pt'?"O catálogo Day-2 ordenado e as suas regras de gates.":"The ordered Day-2 catalog and its gate rules."),minutes:20,html:(lang==='es'?"<p>El catálogo Day-2 (<code>framework/day2-operator-catalog.yml</code>) ordena cada operador tras una puerta de preparación. En la GUI, el operador elige un perfil y ajusta la selección; con GitOps, la misma ordenación se renderiza a manifiestos Kustomize para Argo CD; con Ansible, <code>playbooks/day2.yml</code> ejecuta los mismos roles.</p><h3>Orden de la base</h3><p>observability → security-compliance → logging → service-mesh → connectivity → virtualization-storage → gitops → identity → backup → developer-hub → pipelines → ai</p><h3>Reglas</h3><ul><li>Ninguna suscripción se crea antes de levantar la puerta anterior.</li><li>Los operadores con aprobación manual detienen la secuencia automáticamente.</li><li>La misma selección alimenta la GUI, el render GitOps y el playbook de Ansible.</li></ul>":lang==='de'?"<p>Der Day-2-Katalog (<code>framework/day2-operator-catalog.yml</code>) ordnet jeden Operator hinter einem Readiness Gate an. In der GUI wählt der Operator ein Profil und passt die Auswahl an; mit GitOps wird dieselbe Reihenfolge in Kustomize-Manifeste für Argo CD gerendert; mit Ansible führt <code>playbooks/day2.yml</code> dieselben Rollen aus.</p><h3>Reihenfolge der Grundlage</h3><p>observability → security-compliance → logging → service-mesh → connectivity → virtualization-storage → gitops → identity → backup → developer-hub → pipelines → ai</p><h3>Regeln</h3><ul><li>Keine Subscription wird erstellt, bevor das vorherige Gate aufgehoben ist.</li><li>Operatoren mit manueller Freigabe stoppen die Sequenz automatisch.</li><li>Dieselbe Auswahl speist die GUI, das GitOps-Rendering und das Ansible-Playbook.</li></ul>":lang==='pt'?"<p>O catálogo Day-2 (<code>framework/day2-operator-catalog.yml</code>) ordena cada operador atrás de uma gate de prontidão. Na GUI, o operador escolhe um perfil e ajusta a seleção; com GitOps, a mesma ordenação é renderizada para manifestos Kustomize para o Argo CD; com Ansible, <code>playbooks/day2.yml</code> executa os mesmos roles.</p><h3>Ordem da fundação</h3><p>observability → security-compliance → logging → service-mesh → connectivity → virtualization-storage → gitops → identity → backup → developer-hub → pipelines → ai</p><h3>Regras</h3><ul><li>Nenhuma Subscription é criada antes de levantar a gate anterior.</li><li>Operadores com aprovação manual param a sequência automaticamente.</li><li>A mesma seleção alimenta a GUI, o render GitOps e o playbook Ansible.</li></ul>":"<p>The Day-2 catalog (<code>framework/day2-operator-catalog.yml</code>) orders every operator behind a readiness gate. In the GUI the operator picks a profile and tunes the selection; with GitOps the same ordering is rendered to Kustomize manifests for Argo CD; with Ansible, <code>playbooks/day2.yml</code> executes the same roles.</p><h3>Foundation order</h3><p>observability → security-compliance → logging → service-mesh → connectivity → virtualization-storage → gitops → identity → backup → developer-hub → pipelines → ai</p><h3>Rules</h3><ul><li>No Subscription is created before the previous gate is raised.</li><li>Manual-approval operators stop the sequence automatically.</li><li>The same selection feeds the GUI, the GitOps render, and the Ansible playbook.</li></ul>"),checks:[]},
{id:"module-1",group:(lang==='es'?"Currículo":lang==='de'?"Lehrplan":lang==='pt'?"Currículo":"Curriculum"),title:"Module 1: Foundations",summary:(lang==='es'?"Prepara el nodo de control, carga los valores de ejemplo y entiende los contratos que gobiernan cada acción posterior.":lang==='de'?"Richte die Steuerungsebene ein, lade die Standardwerte der Beispiele und verstehe die Verträge, die jede spätere Aktion steuern.":lang==='pt'?"Prepara o nó de controlo, carrega os valores predefinidos de exemplo e compreende os contratos que regem cada ação posterior.":"Prepare the control node, load the sample defaults, and understand the contracts that govern every later action."),minutes:45,html:(lang==='es'?"<p>Prepara el nodo de control, carga los valores de ejemplo y entiende los contratos que gobiernan cada acción posterior.</p><ul><li>Comprueba Git, Python, Ansible, Podman y acceso de red.</li><li>Copia inventories/sample a un lugar de trabajo, o abre la GUI.</li><li>Decide: connected, partially disconnected o air-gapped.</li><li>Mapea cada variable de entorno a su archivo de valores.</li></ul><h3>Resultados esperados</h3><ul><li>Los valores se cargan desde los archivos group_vars/all/00-*.yml a 60-*.yml.</li><li>Inventario y Vault pasan la validación sin marcadores CHANGE_ME.</li><li>El preflight falla antes de imprimir secretos cuando Ansible Vault no está disponible.</li></ul>":lang==='de'?"<p>Richte die Steuerungsebene ein, lade die Standardwerte der Beispiele und verstehe die Verträge, die jede spätere Aktion steuern.</p><ul><li>Kontrolliere Git, Python, Ansible, Podman und den Netzzugang vor.</li><li>Kopiere inventories/sample an einen Arbeitsort oder öffne die GUI.</li><li>Lege fest: connected, teilweise getrennt oder air-gapped.</li><li>Ordne jeder Umgebungsvariable ihre Datei mit den Standardwerten zu.</li></ul><h3>Erwartete Ergebnisse</h3><ul><li>Die Standardwerte werden aus den Dateien group_vars/all/00-*.yml bis 60-*.yml geladen.</li><li>Inventar und Vault bestehen die Prüfung ohne CHANGE_ME-Platzhalter.</li><li>Preflight schlägt fehl, bevor sensible Daten gedruckt werden, wenn Ansible Vault nicht verfügbar ist.</li></ul>":lang==='pt'?"<p>Prepara o nó de controlo, carrega os valores predefinidos de exemplo e compreende os contratos que regem cada ação posterior.</p><ul><li>Verifica antecipadamente Git, Python, Ansible, Podman e acesso de rede.</li><li>Copia inventories/sample para um local de trabalho ou abre a GUI.</li><li>Decide: connected, parcialmente desligado ou air-gapped.</li><li>Mapeia cada variável de ambiente para o seu ficheiro de valores.</li></ul><h3>Resultados esperados</h3><ul><li>Os valores são carregados de group_vars/all/00-*.yml a 60-*.yml.</li><li>O inventário e o Vault passam na validação sem marcadores CHANGE_ME.</li><li>O preflight falha antes de imprimir segredos quando o Ansible Vault não está disponível.</li></ul>":"<p>Prepare the control node, load the sample defaults, and understand the contracts that govern every later action.</p><ul><li>Check Git, Python, Ansible, Podman, and network access up front.</li><li>Copy inventories/sample to a working location, or open the GUI.</li><li>Decide: connected, partially disconnected, or air-gapped.</li><li>Map each environment variable to its values file.</li></ul><h3>Expected results</h3><ul><li>Defaults load from the group_vars/all/00-*.yml through 60-*.yml files.</li><li>Inventory and Vault pass validation with no CHANGE_ME placeholders.</li><li>Preflight fails before printing secrets when Ansible Vault is unavailable.</li></ul>"),checks:[]},
{id:"module-2",group:(lang==='es'?"Currículo":lang==='de'?"Lehrplan":lang==='pt'?"Currículo":"Curriculum"),title:"Module 2: Redfish Validation",summary:(lang==='es'?"Prueba que cada host se puede controlar en remoto antes de cargar cualquier imagen.":lang==='de'?"Beweise, dass jeder Host fernsteuerbar ist, bevor ein Image geladen wird.":lang==='pt'?"Prova que cada host é controlável remotamente antes de carregar qualquer imagem.":"Prove that each host can be controlled remotely before loading any image."),minutes:45,html:(lang==='es'?"<p>Prueba que cada host se puede controlar en remoto antes de cargar cualquier imagen.</p><ul><li>Autenticación BMC e identidad de servicio (iLO, iDRAC o Redfish genérico).</li><li>IDs de sistema, gestor y chasis para evitar ambigüedades.</li><li>Medios virtuales disponibles y preparación del firmware.</li><li>Dispositivo de arranque y comandos de energía para el proveedor elegido.</li></ul><h3>Resultados esperados</h3><ul><li>assisted_node_bmc_validated para cada host con BMC.</li><li>Un informe de preparación rojo/verde por host.</li><li>La auditoría Redfish no reproduce valores secretos.</li></ul>":lang==='de'?"<p>Beweise, dass jeder Host fernsteuerbar ist, bevor ein Image geladen wird.</p><ul><li>Anmeldung beim BMC und Dienstidentität (iLO, iDRAC oder generisches Redfish).</li><li>System-, Manager- und Chassis-IDs zur Vermeidung von Mehrdeutigkeiten.</li><li>Verfügbare virtuelle Medien und Firmware-Bereitschaft.</li><li>Boot-Gerät und Power-Befehle für den ausgewählten Anbieter.</li></ul><h3>Erwartete Ergebnisse</h3><ul><li>assisted_node_bmc_validated für jeden BMC-fähigen Host.</li><li>Ein rot/grün-Bereitschaftsbericht pro Host.</li><li>Die Redfish-Audit spielt keine Secret-Werte ab.</li></ul>":lang==='pt'?"<p>Prova que cada host é controlável remotamente antes de carregar qualquer imagem.</p><ul><li>Autenticação no BMC e identidade do serviço (iLO, iDRAC ou Redfish genérico).</li><li>IDs de sistema, gestor e chassis para evitar ambiguidades.</li><li>Média virtual disponível e prontidão da firmware.</li><li>Dispositivo de arranque e comandos de energia para o fornecedor escolhido.</li></ul><h3>Resultados esperados</h3><ul><li>assisted_node_bmc_validated para cada host com BMC.</li><li>Um relatório de prontidão por host.</li><li>A auditoria Redfish não reproduz valores secretos.</li></ul>":"<p>Prove that each host can be controlled remotely before loading any image.</p><ul><li>BMC authentication and service identity (iLO, iDRAC, or generic Redfish).</li><li>System, manager, and chassis IDs to avoid ambiguity.</li><li>Available virtual media and firmware readiness.</li><li>Boot device and power commands for the selected vendor.</li></ul><h3>Expected results</h3><ul><li>assisted_node_bmc_validated for every BMC-capable host.</li><li>A red/green readiness report per host.</li><li>The Redfish audit never replays secret values.</li></ul>"),checks:[]},
{id:"module-3",group:(lang==='es'?"Currículo":lang==='de'?"Lehrplan":lang==='pt'?"Currículo":"Curriculum"),title:"Module 3: OpenShift Installation",summary:(lang==='es'?"Ejecuta la función de revisión de borrador, sincroniza la imagen de descubrimiento, arranca los hosts, espera las puertas de registro e instala.":lang==='de'?"Führe die Funktion zur Entwurfsprüfung aus, synchronisiere das Discovery-Image, boote die Hosts, warte auf die Registrierungs-Gates und installiere.":lang==='pt'?"Executa a função de verificação do rascunho, sincroniza a imagem de descoberta, arranca os hosts, aguarda as gates de registo e instala.":"Run the draft-review function, sync the discovery image, boot hosts, wait for the registration gates, and install."),minutes:45,html:(lang==='es'?"<p>Ejecuta la función de revisión de borrador, sincroniza la imagen de descubrimiento, arranca los hosts, espera las puertas de registro e instala.</p><ul><li>Espeja el release solo en rutas desconectadas (oc-mirror v2).</li><li>Sincroniza la imagen de descubrimiento y crea una superposición local firmada.</li><li>Arranca los hosts por Redfish y espera todos los registros (un HTTP 201 no basta).</li><li>Instala desde el bastión; el sync eliminó instalaciones anteriores detenidas.</li></ul><h3>Resultados esperados</h3><ul><li>Recuperación a la imagen de descubrimiento predeterminada de la API si la personalizada falla.</li><li>Limpiar un agente en la API también elimina el archivo ISO en disco.</li><li>kubeconfig y contraseña de kubeadmin en artifacts/<cluster-name>/auth/ (0600).</li></ul>":lang==='de'?"<p>Führe die Funktion zur Entwurfsprüfung aus, synchronisiere das Discovery-Image, boote die Hosts, warte auf die Registrierungs-Gates und installiere.</p><ul><li>Spiegele den Release nur für getrennte Pfade (oc-mirror v2).</li><li>Synchronisiere das Discovery-Image und lege ein signiertes lokales Overlay an.</li><li>Boote die Hosts über Redfish und warte auf alle Registrierungen (HTTP 201 reicht nicht).</li><li>Installiere vom bastion; der Sync entfernte gestoppte frühere Installationen.</li></ul><h3>Erwartete Ergebnisse</h3><ul><li>Fall back auf das API-Standard-Discovery-Image, wenn das benutzerdefinierte Image scheitert.</li><li>Ein bereinigter Agent in der API löscht auch die ISO-Datei auf der Festplatte.</li><li>kubeconfig und kubeadmin-Passwort in artifacts/<cluster-name>/auth/ (0600).</li></ul>":lang==='pt'?"<p>Executa a função de verificação do rascunho, sincroniza a imagem de descoberta, arranca os hosts, aguarda as gates de registo e instala.</p><ul><li>Espelha a release apenas nos caminhos desligados (oc-mirror v2).</li><li>Sincroniza a imagem de descoberta e cria um overlay local assinado.</li><li>Arranca os hosts por Redfish e aguarda todos os registos (HTTP 201 não basta).</li><li>Instala a partir do bastion; o sync removeu instalações anteriores paradas.</li></ul><h3>Resultados esperados</h3><ul><li>Recuperação para a imagem de descoberta padrão da API se a personalizada falhar.</li><li>Limpar um agente na API também apaga o ISO em disco.</li><li>kubeconfig e palavra-passe kubeadmin em artifacts/<cluster-name>/auth/ (0600).</li></ul>":"<p>Run the draft-review function, sync the discovery image, boot hosts, wait for the registration gates, and install.</p><ul><li>Mirror the release only for disconnected paths (oc-mirror v2).</li><li>Sync the discovery image and create a signed local overlay.</li><li>Boot hosts through Redfish and wait for every registration (an HTTP 201 is not enough).</li><li>Install from the bastion; the sync removed stopped earlier installations.</li></ul><h3>Expected results</h3><ul><li>Fallback to the API default discovery image if the custom image fails.</li><li>Clearing an agent in the API also removes the ISO file on disk.</li><li>kubeconfig and kubeadmin password in artifacts/<cluster-name>/auth/ (0600).</li></ul>"),checks:[]},
{id:"module-4",group:(lang==='es'?"Currículo":lang==='de'?"Lehrplan":lang==='pt'?"Currículo":"Curriculum"),title:"Module 4: Ordered Day-2 Foundation",summary:(lang==='es'?"El playbook day2.yml se detiene antes de cada puerta de preparación; cada operador permanece desactivado hasta que la puerta anterior se levanta explícitamente.":lang==='de'?"Das Playbook day2.yml stoppt vor jedem Readiness Gate; jeder Operator bleibt deaktiviert, bis das Gate davor explizit aufgehoben wird.":lang==='pt'?"O playbook day2.yml para antes de cada gate de prontidão; cada operador fica desativado até a gate anterior ser levantada explicitamente.":"The day2.yml playbook stops before every readiness gate; each operator stays disabled until the gate before it is explicitly raised."),minutes:45,html:(lang==='es'?"<p>El playbook day2.yml se detiene antes de cada puerta de preparación; cada operador permanece desactivado hasta que la puerta anterior se levanta explícitamente.</p><ul><li>Orden: observabilidad, seguridad y cumplimiento, logging, service mesh, conectividad, virtualización y almacenamiento, GitOps, identidad, respaldo, Developer Hub, pipelines, IA.</li><li>Aplica solo los operadores seleccionados, con GitOps o Ansible.</li><li>Un instalador guiado idempotente corre como CronJob (install-plan-runner).</li></ul><h3>Resultados esperados</h3><ul><li>Una ejecución detenida no cambia operadores posteriores.</li><li>Cada puerta queda registrada en el informe de estado y en el artefacto JSON del componente.</li><li>Un operador con aprobación manual pausa automáticamente la secuencia.</li></ul>":lang==='de'?"<p>Das Playbook day2.yml stoppt vor jedem Readiness Gate; jeder Operator bleibt deaktiviert, bis das Gate davor explizit aufgehoben wird.</p><ul><li>Reihenfolge: Observability, Sicherheit & Compliance, Logging, Service Mesh, Konnektivität, Virtualisierung & Storage, GitOps, Identity, Backup, Developer Hub, Pipelines, AI.</li><li>Wende nur die ausgewählten Operatoren mit GitOps oder Ansible an.</li><li>Ein idempotenter geführter Installer läuft als CronJob (install-plan-runner).</li></ul><h3>Erwartete Ergebnisse</h3><ul><li>Ein gestoppter Lauf ändert keine späteren Operatoren.</li><li>Jedes Gate wird im Statusbericht und im JSON-Artefakt der Komponente festgehalten.</li><li>Ein Operator mit Manual-Approval hält die Pipeline automatisch an.</li></ul>":lang==='pt'?"<p>O playbook day2.yml para antes de cada gate de prontidão; cada operador fica desativado até a gate anterior ser levantada explicitamente.</p><ul><li>Ordem: observabilidade, segurança e conformidade, logging, service mesh, conectividade, virtualização e armazenamento, GitOps, identidade, backup, Developer Hub, pipelines, IA.</li><li>Aplica apenas os operadores selecionados, com GitOps ou Ansible.</li><li>Um instalador guiado idempotente corre como CronJob (install-plan-runner).</li></ul><h3>Resultados esperados</h3><ul><li>Uma execução parada não altera operadores posteriores.</li><li>Cada gate fica registada no relatório de estado e no artefacto JSON do componente.</li><li>Um operador com aprovação manual pausa automaticamente o pipeline.</li></ul>":"<p>The day2.yml playbook stops before every readiness gate; each operator stays disabled until the gate before it is explicitly raised.</p><ul><li>Order: observability, security & compliance, logging, service mesh, connectivity, virtualization & storage, GitOps, identity, backup, Developer Hub, pipelines, AI.</li><li>Apply only the selected operators, with GitOps or Ansible.</li><li>An idempotent guided installer runs as a CronJob (install-plan-runner).</li></ul><h3>Expected results</h3><ul><li>A stopped run does not change later operators.</li><li>Every gate is recorded in the status report and the component JSON artifact.</li><li>A manual-approval operator pauses the pipeline automatically.</li></ul>"),checks:[]},
{id:"module-5",group:(lang==='es'?"Currículo":lang==='de'?"Lehrplan":lang==='pt'?"Currículo":"Curriculum"),title:"Module 5: Health Check and Day-2 Operations",summary:(lang==='es'?"Un chequeo de salud es la prueba de que el equipo puede trabajar con un clúster instalado. La ejecución escribe informes de texto y JSON.":lang==='de'?"Ein Health-Check ist der Nachweis, ob das Team mit einem installierten Cluster arbeiten kann. Der Lauf gibt Text- und JSON-Berichte aus.":lang==='pt'?"Uma verificação de saúde é a prova de que a equipa pode trabalhar com um cluster instalado. A execução escreve relatórios de texto e JSON.":"A health check is the proof that the team can work with an installed cluster. The run writes text and JSON reports."),minutes:45,html:(lang==='es'?"<p>Un chequeo de salud es la prueba de que el equipo puede trabajar con un clúster instalado. La ejecución escribe informes de texto y JSON.</p><ul><li>Estado del clúster, nodos y MCP.</li><li>Salud de operadores, sincronización GitOps y salud de Argo.</li><li>Clases de almacenamiento, hosts bare metal, redes y máquinas virtuales.</li><li>Las secuencias levantan exactamente una puerta cada vez.</li></ul><h3>Resultados esperados</h3><ul><li>El informe usa la antigüedad del kubeconfig (umbral de 30 días).</li><li>Reejecutar un chequeo fallido no vuelve verde el informe.</li><li>Tras el chequeo, repite solo la aplicación del operador fallido.</li></ul>":lang==='de'?"<p>Ein Health-Check ist der Nachweis, ob das Team mit einem installierten Cluster arbeiten kann. Der Lauf gibt Text- und JSON-Berichte aus.</p><ul><li>Cluster-, Knoten- und MCP-Status.</li><li>Operator-, GitOps-Sync- und Argo-Health.</li><li>Storage-Klassen, Bare-Metal-Hosts, Netzwerke und virtuelle Maschinen.</li><li>Sequenzen heben genau ein Gate auf einmal auf.</li></ul><h3>Erwartete Ergebnisse</h3><ul><li>Der Bericht nutzt das Alter des kubeconfig (30-Tage-Schwelle).</li><li>Einen fehlgeschlagenen Check zu wiederholen macht den Bericht nicht grün.</li><li>Nach dem Health-Check wiederhole nur die Anwendung des fehlgeschlagenen Operators.</li></ul>":lang==='pt'?"<p>Uma verificação de saúde é a prova de que a equipa pode trabalhar com um cluster instalado. A execução escreve relatórios de texto e JSON.</p><ul><li>Estado do cluster, nós e MCP.</li><li>Saúde dos operadores, sincronização GitOps e Argo.</li><li>Classes de armazenamento, hosts bare metal, redes e máquinas virtuais.</li><li>As sequências levantam exatamente uma gate de cada vez.</li></ul><h3>Resultados esperados</h3><ul><li>O relatório usa a idade do kubeconfig (limiar de 30 dias).</li><li>Reexecutar um check falhado não torna o relatório verde.</li><li>Após a verificação, repete apenas a aplicação do operador falhado.</li></ul>":"<p>A health check is the proof that the team can work with an installed cluster. The run writes text and JSON reports.</p><ul><li>Cluster, node, and MCP status.</li><li>Operator health, GitOps sync, and Argo health.</li><li>Storage classes, bare-metal hosts, networks, and virtual machines.</li><li>Sequences raise exactly one gate at a time.</li></ul><h3>Expected results</h3><ul><li>The report uses the kubeconfig age (30-day threshold).</li><li>Re-running a failed check does not turn the report green.</li><li>After the check, re-apply only the failed operator.</li></ul>"),checks:[]},
{id:"module-6",group:(lang==='es'?"Currículo":lang==='de'?"Lehrplan":lang==='pt'?"Currículo":"Curriculum"),title:"Module 6: Deploy a Cluster from ACM",summary:(lang==='es'?"Con el hub funcionando, usa ACM para crear un segundo clúster en lugar de repetir el manual a mano.":lang==='de'?"Nachdem der Hub existiert, nutze ACM, um einen zweiten Cluster zu erstellen, statt das Handbuch von Hand zu wiederholen.":lang==='pt'?"Com o hub em funcionamento, usa o ACM para criar um segundo cluster em vez de repetir o manual à mão.":"With the hub running, use ACM to create a second cluster instead of repeating the runbook by hand."),minutes:45,html:(lang==='es'?"<p>Con el hub funcionando, usa ACM para crear un segundo clúster en lugar de repetir el manual a mano.</p><ul><li>Registra un perfil nuevo con los mismos formularios (GUI) o playbooks.</li><li>Ejecuta validate e install a través del hub.</li><li>Confirma el nuevo clúster en el árbol de la consola de ACM.</li></ul><h3>Resultados esperados</h3><ul><li>El perfil del segundo clúster queda aislado (inventario y Vault propios).</li><li>El informe del hub muestra ambos clústeres preparados.</li></ul>":lang==='de'?"<p>Nachdem der Hub existiert, nutze ACM, um einen zweiten Cluster zu erstellen, statt das Handbuch von Hand zu wiederholen.</p><ul><li>Registriere ein neues Profil mit denselben Formularen (GUI) oder Playbooks.</li><li>Starte validate und install über den Hub.</li><li>Überprüfe den neuen Cluster im Konsolenbaum von ACM.</li></ul><h3>Erwartete Ergebnisse</h3><ul><li>Das Profil des zweiten Clusters ist isoliert (eigenes Inventar und Vault).</li><li>Der Hub-Bericht zeigt beide Cluster als bereit.</li></ul>":lang==='pt'?"<p>Com o hub em funcionamento, usa o ACM para criar um segundo cluster em vez de repetir o manual à mão.</p><ul><li>Regista um novo perfil com os mesmos formulários (GUI) ou playbooks.</li><li>Executa validate e install através do hub.</li><li>Confirma o novo cluster na árvore da consola do ACM.</li></ul><h3>Resultados esperados</h3><ul><li>O perfil do segundo cluster fica isolado (inventário e Vault próprios).</li><li>O relatório do hub mostra ambos os clusters prontos.</li></ul>":"<p>With the hub running, use ACM to create a second cluster instead of repeating the runbook by hand.</p><ul><li>Register a new profile with the same forms (GUI) or playbooks.</li><li>Run validate and install through the hub.</li><li>Confirm the new cluster in the ACM console tree.</li></ul><h3>Expected results</h3><ul><li>The second cluster profile stays isolated (its own inventory and Vault).</li><li>The hub report shows both clusters as ready.</li></ul>"),checks:[]},
{id:"module-7",group:(lang==='es'?"Currículo":lang==='de'?"Lehrplan":lang==='pt'?"Currículo":"Curriculum"),title:"Module 7: Challenge",summary:(lang==='es'?"Reto final: espeja un perfil completo, arráncalo e instálalo desde cero.":lang==='de'?"Abschluss-Challenge: Spiegele ein vollständiges Profil, boote es und installiere es von Grund auf neu.":lang==='pt'?"Desafio final: espelha um perfil completo, arranca-o e instala-o a partir do zero.":"Final challenge: mirror a complete profile, boot it, and install it from scratch."),minutes:45,html:(lang==='es'?"<p>Reto final: espeja un perfil completo, arráncalo e instálalo desde cero.</p><ul><li>Elige una ruta: playbooks o GUI.</li><li>Espeja el release, sincroniza la imagen de descubrimiento y arranca los hosts por Redfish.</li><li>Aplica la base Day-2, levanta las puertas en orden y entrega el informe de salud.</li></ul><h3>Resultados esperados</h3><ul><li>Un perfil limpio corre de cero a un chequeo de salud verde.</li><li>kubeconfig, informes e inventario espejado archivados como evidencia.</li></ul>":lang==='de'?"<p>Abschluss-Challenge: Spiegele ein vollständiges Profil, boote es und installiere es von Grund auf neu.</p><ul><li>Wähle einen Pfad: Playbooks oder GUI.</li><li>Spiegele das Release, synchronisiere das Discovery-Image und boote die Hosts über Redfish.</li><li>Lege die Day-2-Grundlagen an, hebe die Gates in Reihenfolge auf und übergib den Health-Check-Bericht.</li></ul><h3>Erwartete Ergebnisse</h3><ul><li>Ein bereinigtes Profil läuft von Grund auf bis zum grünen Health-Check.</li><li>kubeconfig, Berichte und das gespiegelte Inventar als Nachweise archiviert.</li></ul>":lang==='pt'?"<p>Desafio final: espelha um perfil completo, arranca-o e instala-o a partir do zero.</p><ul><li>Escolhe um caminho: playbooks ou GUI.</li><li>Espelha a release, sincroniza a imagem de descoberta e arranca os hosts por Redfish.</li><li>Aplica a fundação Day-2, levanta as gates por ordem e entrega o relatório de saúde.</li></ul><h3>Resultados esperados</h3><ul><li>Um perfil limpo executa do zero até um relatório de saúde verde.</li><li>kubeconfig, relatórios e o inventário espelhado arquivados como evidência.</li></ul>":"<p>Final challenge: mirror a complete profile, boot it, and install it from scratch.</p><ul><li>Pick a path: playbooks or GUI.</li><li>Mirror the release, sync the discovery image, and boot the hosts through Redfish.</li><li>Apply the Day-2 foundation, raise the gates in order, and hand over the health report.</li></ul><h3>Expected results</h3><ul><li>A clean profile runs from zero to a green health check.</li><li>kubeconfig, reports, and the mirrored inventory archived as evidence.</li></ul>"),checks:[]},
