ción de ACM disponible: espejado primero en entornos desconectados.", "Hosts destino con BMC alcanzables desde la red de aprovisionamiento del hub.", "Modo GitOps listo para entregar la base a los clústeres gestionados."]}, "cfg": {"title": "Configuraciones", "items": ["Variables del hub ACM y el perfil de hub en <code>playbooks/day2/acm-hub.yml</code>.", "Datos de red estática por host para el registro BMH: MACs, direcciones, puertas de enlace y bonds.", "Ajustes de observabilidad multiclúster y la selección de placements/políticas para los clústeres gestionados."]}}, "module-7": {"pre": {"title": "Prerrequisitos", "items": ["Módulos 1 a 6 comprendidos: el reto es sin consultar apuntes.", "Un laboratorio desechable: tres hosts de control y dos workers, o sus equivalentes virtuales.", "Activos de desconectado listos: registro espejo, su CA y la release fijada."]}, "cfg": {"title": "Configuraciones", "items": ["Una copia de inventario nueva creada para el reto: nunca reutilices la de producción.", "Modo desconectado ACTIVADO en <code>00-required.yml</code> y los grupos de espejo completos.", "Un fallo elegido de antemano para inyectar (disk id incorrecto o token caducado)."]}}}, "pt": {"deploy-playbooks": {"pre": {"title": "Pré-requisitos", "items": ["Um bastião com Ansible e as coleções do repositório instaladas.", "Um inventário copiado de <code>inventories/sample</code> — nunca edites o de exemplo no lugar.", "Credenciais de administrador dos BMC e acessibilidade HTTPS a cada endpoint iLO/iDRAC.", "Pull secret da Red Hat e uma chave pública SSH prontos para o Vault.", "Apenas desligado: um registo espelho acessível a partir do bastião, com o seu certificado CA."]}, "cfg": {"title": "Configurações", "items": ["<code>hosts.yml</code>: uma entrada por host — <code>bmc_type</code>, <code>bmc_endpoint</code>, <code>node_role</code>, hostname, IPv4, <code>installation_disk_id</code>.", "<code>group_vars/all/00-required.yml</code>: nome do cluster, domínio DNS, versão do OpenShift, contagens de nós, redes de máquinas/API/ingress e VIPs.", "<code>10-assisted.yml</code>: <code>assisted_auth_mode</code> (<code>saas</code> ou <code>onprem</code>). <code>20-networking.yml</code>: servidores DNS e desenho de bond. <code>30-disconnected.yml</code>: dados do espelho, apenas desligado.", "<code>50-runtime.yml</code>: o endereço HTTP anunciado da ISO do nó de controlo.", "<code>vault.yml</code> (encriptado): credenciais BMC por hostname, pull secret, chave SSH, token do Assisted Installer."]}}, "deploy-gui": {"pre": {"title": "Pré-requisitos", "items": ["Podman (ou Docker) com suporte Compose no bastião e a porta TCP 8080 livre.", "<code>openssl</code> disponível para gerar o token de acesso.", "As mesmas entradas de inventário do caminho de playbooks — a GUI edita os mesmos contratos.", "Um navegador com acesso ao endereço do bastião."]}, "cfg": {"title": "Configurações", "items": ["<code>INSTALLER_UI_AUTH_TOKENS</code> exportado na forma canónica e guardado em <code>.installer-ui.vault</code> (modo 600).", "O serviço Compose <code>installer-ui</code> com o seu volume persistente <code>/data</code> para os perfis.", "Grupos do perfil por ordem: 00 Cluster, 10 Assisted API, 20 Networking, 30 Disconnected, 40 BMC por host, 50 Runtime, 60 Day-2 GitOps, mais o grupo Secrets (encriptado com Vault)."]}}, "operators": {"pre": {"title": "Pré-requisitos", "items": ["Um cluster instalado e saudável (Dia 0 completo) e um kubeconfig de cluster-admin.", "O catálogo de operadores revisto: <code>framework/day2-operator-catalog.yml</code>.", "Modo GitOps: OpenShift GitOps disponível, ou a ação <b>day2-deploy</b> planeada. Modo direto: acesso do nó de controlo à API do cluster.", "Imagens de operadores acessíveis — espelhadas primeiro em ambientes desligados."]}, "cfg": {"title": "Configurações", "items": ["Seleção de componentes: um perfil do catálogo (minimal, enterprise, observability) ou chaves individuais.", "<code>group_vars/all/60-day2-gitops.yml</co e Platte."]}}, "module-4": {"pre": {"title": "Voraussetzungen", "items": ["Ein installierter Cluster und ein Cluster-Admin-Kubeconfig.", "Der gewählte Bereitstellungsmodus: GitOps (abgeglichen) oder Ansible direkt (sofort).", "Katalogprofile geprüft; ein etcd-Backup vor der ersten Änderung erstellt."]}, "cfg": {"title": "Konfigurationen", "items": ["<code>group_vars/all/60-day2-gitops.yml</code>: Repository, Branch, Profile und Git-Push-Bestätigungen.", "Identitätseinstellungen in den Group Vars: LDAP-Bind-Daten, OAuth-Endpunkte oder HTPasswd-Benutzer.", "Zertifikatsmaterial für die benutzerdefinierten API-/Ingress-Zertifikate der Lektion 4.4.8.1."]}}, "module-5": {"pre": {"title": "Voraussetzungen", "items": ["Ein Cluster mit angewendeter Day-2-Basis (Modul 4).", "Ein beschreibbarer Ort für Berichte und Nachweise.", "Das Must-Gather-Image verfügbar — in getrennten Umgebungen zuerst gespiegelt."]}, "cfg": {"title": "Konfigurationen", "items": ["Variablen der Gesundheitsprüfungen im Inventar: Berichtspfade und Prüfungsauswahl.", "Alertmanager-Empfänger (E-Mail, Webhook oder Chat) in der Monitoring-Stufe konfiguriert.", "Backup-Zeitpläne aus der Basis: etcd-Backups und OADP-Richtlinien."]}}, "module-6": {"pre": {"title": "Voraussetzungen", "items": ["Ein gesunder Hub-Cluster mit Cluster-Admin-Zugriff.", "Der ACM-Abonnementkanal verfügbar — in getrennten Umgebungen zuerst gespiegelt.", "Ziel-Hosts mit BMCs, erreichbar aus dem Provisionierungsnetz des Hubs.", "GitOps-Modus bereit, die Basis an verwaltete Cluster zu liefern."]}, "cfg": {"title": "Konfigurationen", "items": ["ACM-Hub-Variablen und das Hub-Profil in <code>playbooks/day2/acm-hub.yml</code>.", "Statische Netzdaten pro Host für die BMH-Registrierung: MACs, Adressen, Gateways und Bonds.", "Multicluster-Observability-Einstellungen und die Placement-/Policy-Auswahl für verwaltete Cluster."]}}, "module-7": {"pre": {"title": "Voraussetzungen", "items": ["Module 1 bis 6 verstanden — die Herausforderung ist ohne Not 0-preflight.yml -i inventories/prod</code> — it must end with no <code>CHANGE_ME</code> placeholders left.", "Discover the hardware: <code>playbooks/day0/discover-bmc.yml</code>; review the BMC report and confirm each <code>installation_disk_id</code>.", "Disconnected only — mirror the release: <code>playbooks/day0/prepare-mirror.yml</code> renders and runs the oc-mirror v2 workflow.", "Boot the hosts: <code>playbooks/02-boot-discovery-iso.yml</code> attaches the ISO through Redfish; watch every host register in the Assisted Installer.", "Install: <code>playbooks/day0/install.yml</code>. When it finishes, eject the media with <code>playbooks/90-eject-media.yml</code> and file the kubeconfig and reports as evidence."]}, "deploy-gui": {"title": "Execution", "items": ["Generate the access token: <code>export INSTALLER_UI_AUTH_TOKENS=\"$(openssl rand -hex 24)=admin\"</code> and save it in <code>.installer-ui.vault</code> with mode 600.", "Build and start: <code>podman compose build --no-cache installer-ui</code> and <code>podman compose up -d</code>; open <code>http://127.0.0.1:8080</code>.", "Sign in with the token (the part before the <code>=</code>).", "Create a profile and fill the groups in order: 00 Cluster, 10 Assisted API, 20 Networking, 30 Disconnected (only if it applies), 40 BMC with one card per host, 50 Runtime, 60 Day-2 GitOps.", "Put every secret in the Secrets group (pull secret, SSH key, BMC credentials, the Red Hat offline token in SaaS mode) and save with the Vault password — secrets are stored encrypted and never shown again.", "Press <b>Validate</b> and fix every field error it lists; nothing runs against an invalid profile.", "Run the actions in the diagram order (preflight, discover, mirror, boot, install), typing <code>MIRROR</code>, <code>BOOT</code> or <code>INSTALL</code> when the GUI asks for confirmation.", "Finish with <b>day2-render</b> to preview the desired state, then <b>day2-deploy</b> (confirmation <code>GITOPS</code>) to bootstrap GitOps; download the run reports as evidence."]}, "operators": {"title": "Execution", "items": ["Open <code>framework/day2-operator-catalog.yml</code> and choose a profile (minimal, enterprise, observability) or individual components.", "Render before you apply: <code>ansible-playbook playbooks/day2/render-gitops.yml</code> (or the GUI <b>day2-render</b> action) and review the generated manifests.", "Let validation check the selection: channels and dependencies are resolved against the catalog before anything is applied.", "Deploy in the foundation order of the diagram below — never skip a stage that a later component depends on.", "Direct mode: run <code>playbooks/install-platform-operator.yml -e component_name=&lt;key&gt;</code> per component. GitOps mode: use the <b>day2-deploy</b> action instead.", "Verify each operator reports <i>Succeeded</i> and its operands are ready before moving to the next stage.", "Re-run any stage safely when in doubt: every playbook is idempotent."]}, "module-1": {"title": "Execution", "items": ["Clone the repository on the bastion and install the collections: <code>ansible-galaxy collection install -r collections/requirements.yml</code>.", "Run <code>./scripts/validate.sh</code> — repository, inventory, Kustomize and manifest checks must all pass before you continue.", "Walk <code>inventories/sample</code> file by file (hosts, group_vars 00 to 60, vault example) and map each group to its contract in <code>framework/input-contracts.yml</code>.", "Prepare the bastion itself with <code>playbooks/configure-bastion.yml</code>.", "Create your working copy and its Vault (<code>playbooks/day0/create-vault.yml</code>) — never edit the sample inventory in place.", "Exit check: preflight against the sample inventory reports only the expected placeholder errors."]}, "module-2": {"title": "Execution", "items": ["Confirm BMC reachability from the bastion: HTTPS must answer on every iLO/iDRAC endpoint in your inventory.", "Run discovery: <code>playbooks/day0/discover-bmc.yml</code> against your inventory.", "Read the generated BMC report host by host: model, firmware, NIC MAC addresses and disk list.", "Resolve each host's <code>installation_disk_id</code> from that report — never guess it.", "Test virtual media on a single host first: <code>playbooks/03-test-virtual-media.yml --limit &lt;host&gt;</code>.", "Fix cabling, firmware or credential issues now: a host that cannot mount media cannot install."]}, "module-3": {"title": "Execution", "items": ["Disconnected only: complete the mirror stage first (prepare-mirror always runs before boot).", "Boot every host: <code>playbooks/02-boot-discovery-iso.yml</code>; confirm each host registers in the Assisted Installer.", "Validate the cluster definition in the Assisted Installer: VIPs, networking mode and host roles.", "Install: <code>playbooks/day0/install.yml</code> and monitor until the cluster reports <i>installed</i>.", "Eject the media: <code>playbooks/90-eject-media.yml</code>, so hosts boot from disk on the next restart.", "Download the kubeconfig and credentials, run the post-install evidence checks, and file the reports."]}, "module-4": {"title": "Execution", "items": ["Start with cluster basics: NTP (<code>playbooks/day2/chrony.yml</code>), node labels, and identity (LDAP, HTPasswd or OAuth).", "Apply the ordered foundation of the diagram below, stage by stage, in order.", "Prefer GitOps mode for anything that must stay reconciled; keep direct mode for one-off fixes.", "After each stage, run its component validation and read the report before continuing.", "Configure the custom API and Ingress certificates (lesson 4.4.8.1): validate, render, apply, verify endpoints, and know the rollback.", "Exit check: the consolidated Day-2 report shows every stage ready."]}, "module-5": {"title": "Execution", "items": ["Run <code>playbooks/day2/health-checks.yml</code> and <code>playbooks/day2/cluster-health.yml</code>; save the structured reports.", "Check etcd health (<code>etcd-health.yml</code>) and take an etcd backup (<code>etcd-backup.yml</code>) before changing anything.", "Review platform and user-workload monitoring; confirm Alertmanager routing delivers a test alert.", "When a check fails, collect <code>must-gather</code>, remediate the cause, and re-run until the report is green.", "Practice rolling back the last change you applied — a rollback you have not rehearsed does not exist.", "Schedule the reports: health evidence is part of operations, not an afterthought."]}, "module-6": {"title": "Execution", "items": ["Install ACM on the hub: <code>playbooks/day2/acm.yml</code> (hub profile in <code>acm-hub.yml</code>) and verify the hub operators are ready.", "Configure multicluster observability (<code>playbooks/day2/multicluster-observability.yml</code>).", "Register the target bare-metal hosts with their static networking (<code>playbooks/day2/acm-bmh-static-networking.yml</code>).", "Create the managed cluster from ACM and watch provisioning reuse the same inventory contracts as a local install.", "Apply the Day-2 foundation to the managed cluster through the GitOps application lifecycle (<code>gitops-application-lifecycle.yml</code>).", "Verify policies and placements report <i>compliant</i> for the new cluster."]}, "module-7": {"title": "Execution", "items": ["Setup: a fresh inventory, three control-plane and two worker hosts (or the lab equivalent), disconnected mode ON.", "From memory, run the full installation path: preflight, discover, mirror, boot, install.", "Apply the ordered Day-2 foundation with at least the observability, gitops, identity and backup stages.", "Introduce one failure (a wrong disk id or an expired token), diagnose it from the reports, and recover.", "Success criteria: cluster installed, foundation green, and a complete evidence bundle — without opening the step-by-step guides."]}, "materials": {"title": "Execution", "items": ["Start from <code>docs/README.md</code>: the index of every guide in the repository.", "Keep <code>docs/playbooks-reference.md</code> open while you work — it maps every playbook, role, GUI action and the role of Helm.", "For any variable doubt, use <code>docs/variable-reference.md</code>; never guess a variable name.", "For incidents, follow <code>docs/troubleshooting.md</code> and the reporting and validation hooks guide.", "The AsciiDoc sources under <code>workshop/documentation/</code> remain the printable reference of this workshop."]}}, "es": {"start": {"title": "Ejecución", "items": ["Elige tu idioma en el combo de banderas: toda la página se recarga en ese idioma.", "Recorre la agenda en orden: primero las tres rutas de despliegue y después los Módulos 1 a 7.", "Prepara un bastión con Podman, Ansible, la CLI de OpenShift (<code>oc</code>), <code>jq</code> y este repositorio clonado.", "Ten a mano el inventario de ejemplo (<code>inventories/sample</code>): todos los procedimientos leen sus contratos de ahí.", "Usa el buscador y el índice de contenido de cada paso para moverte dentro de los procedimientos largos.", "Resultado esperado: terminas capaz de instalar un clúster y ejecutar su base Day-2 completa sin ayuda."]}, "deploy-playbooks": {"title": "Ejecución", "items": ["Copia el inventario de ejemplo: <code>cp -r inventories/sample inventories/prod</code>.", "Edita <code>inventories/prod/hosts.yml</code>: una entrada por host con <code>bmc_type</code>, <code>bmc_endpoint</code>, <code>node_role</code>, hostname, IPv4 y <code>installation_disk_id</code>.", "Rellena <code>group_vars/all/00-required.yml</code> (nombre del clúster, dominio DNS, versión, conteos, redes, VIPs) y después <code>10-assisted.yml</code> y <code>20-networking.yml</code>; completa <code>30-disconnected.yml</code> solo en modo desconectado.", "Crea el Vault desde <code>vault.yml.example</code>, llena todos los secretos y cífralo con <code>ansible-vault encrypt</code>.", "Ejecuta el preflight: <code>ansible-playbook playbooks/00-preflight.yml -i inventories/prod</code>; debe terminar sin ningún <code>CHANGE_ME</code> pendiente.", "Descubre el hardware: <code>playbooks/day0/discover-bmc.yml</code>; revisa el reporte BMC y confirma cada <code>installation_disk_id</code>.", "Solo desconectado: espeja la release con <code>playbooks/day0/prepare-mirror.yml</code>, que renderiza y ejecuta el flujo oc-mirror v2.", "Arranca los hosts: <code>playbooks/02-boot-discovery-iso.yml</code> adjunta la ISO vía Redfish; observa que cada host se registra en el Assisted Installer.", "Instala: <code>playbooks/day0/install.yml</code>. Al terminar, expulsa el medio con <code>playbooks/90-eject-media.yml</code> y archiva el kubeconfig y los reportes como evidencia."]}, "deploy-gui": {"title": "Ejecución", "items": ["Genera el token de acceso: <code>export INSTALLER_UI_AUTH_TOKENS=\"$(openssl rand -hex 24)=admin\"</code> y guárdalo en <code>.installer-ui.vault</code> con permisos 600.", "Construye y arranca: <code>podman compose build --no-cache installer-ui</code> y <code>podman compose up -d</code>; abre <code>http://127.0.0.1:8080</code>.", "Inicia sesión con el token (la parte anterior al <code>=</code>).", "Crea un perfil y llena los grupos en orden: 00 Cluster, 10 Assisted API, 20 Networking, 30 Disconnected (solo si aplica), 40 BMC con una tarjeta por host, 50 Runtime, 60 Day-2 GitOps.", "Pon cada secreto en el grupo Secrets (pull secret, llave SSH, credenciales BMC, el token offline de Red Hat en modo SaaS) y guarda con la contraseña del Vault: los secretos quedan cifrados y nunca se vuelven a mostrar.", "Pulsa <b>Validate</b> y corrige cada error de campo que liste; nada se ejecuta con un perfil inválido.", "Ejecuta las acciones en el orden del diagrama (preflight, discover, mirror, boot, install), escribiendo <code>MIRROR</code>, <code>BOOT</code> o <code>INSTALL</code> cuando la GUI pida confirmación.", "Termina con <b>day2-render</b> para previsualizar el estado deseado y luego <b>day2-deploy</b> (confirmación <code>GITOPS</code>) para arrancar GitOps; descarga los reportes como evidencia."]}, "operators": {"title": "Ejecución", "items": ["Abre <code>framework/day2-operator-catalog.yml</code> y elige un perfil (minimal, enterprise, observability) o componentes individuales.", "Renderiza antes de aplicar: <code>ansible-playbook playbooks/day2/render-gitops.yml</code> (o la acción <b>day2-render</b> de la GUI) y revisa los manifiestos generados.", "Deja que la validación revise la selección: canales y dependencias se resuelven contra el catálogo antes de aplicar nada.", "Despliega en el orden de la base del diagrama siguiente: nunca saltes una etapa de la que dependa un componente posterior.", "Modo directo: ejecuta <code>playbooks/install-platform-operator.yml -e component_name=&lt;clave&gt;</code> por componente. Modo GitOps: usa la acción <b>day2-deploy</b>.", "Verifica que cada operador reporta <i>Succeeded</i> y sus operandos están listos antes de pasar a la siguiente etapa.", "Repite cualquier etapa con seguridad ante la duda: todos los playbooks son idempotentes."]}, "module-1": {"title": "Ejecución", "items": ["Clona el repositorio en el bastión e instala las colecciones: <code>ansible-galaxy collection install -r collections/requirements.yml</code>.", "Ejecuta <code>./scripts/validate.sh</code>: las comprobaciones de repositorio, inventario, Kustomize y manifiestos deben pasar antes de continuar.", "Recorre <code>inventories/sample</code> archivo por archivo (hosts, group_vars 00 a 60, ejemplo de vault) y mapea cada grupo a su contrato en <code>framework/input-contracts.yml</code>.", "Prepara el propio bastión con <code>playbooks/configure-bastion.yml</code>.", "Crea tu copia de trabajo y su Vault (<code>playbooks/day0/create-vault.yml</code>): nunca edites el inventario de ejemplo en su sitio.", "Comprobación de salida: el preflight contra el inventario de ejemplo reporta solo los errores de marcadores esperados."]}, "module-2": {"title": "Ejecución", "items": ["Confirma la alcanzabilidad de los BMC desde el bastión: HTTPS debe responder en cada endpoint iLO/iDRAC de tu inventario.", "Ejecuta el descubrimiento: <code>playbooks/day0/discover-bmc.yml</code> contra tu inventario.", "Lee el reporte BMC generado host por host: modelo, firmware, MAC de las NIC y lista de discos.", "Resuelve el <code>installation_disk_id</code> de cada host desde ese reporte: nunca lo adivines.", "Prueba el medio virtual primero en un solo host: <code>playbooks/03-test-virtual-media.yml --limit &lt;host&gt;</code>.", "Corrige ahora cableado, firmware o credenciales: un host que no puede montar el medio no puede instalar."]}, "module-3": {"title": "Ejecución", "items": ["Solo desconectado: completa primero la etapa de espejo (prepare-mirror siempre va antes del arranque).", "Arranca todos los hosts: <code>playbooks/02-boot-discovery-iso.yml</code>; confirma que cada host se registra en el Assisted Installer.", "Valida la definición del clúster en el Assisted Installer: VIPs, modo de red y roles de los hosts.", "Instala: <code>playbooks/day0/install.yml</code> y monitoriza hasta que el clúster reporte <i>installed</i>.", "Expulsa el medio: <code>playbooks/90-eject-media.yml</code>, para que los hosts arranquen de disco en el próximo reinicio.", "Descarga el kubeconfig y las credenciales, ejecuta las comprobaciones de evidencia post-instalación y archiva los reportes."]}, "module-4": {"title": "Ejecución", "items": ["Empieza por lo básico del clúster: NTP (<code>playbooks/day2/chrony.yml</code>), etiquetas de nodos e identidad (LDAP, HTPasswd u OAuth).", "Aplica la base ordenada del diagrama siguiente, etapa por etapa y en orden.", "Prefiere el modo GitOps para todo lo que deba mantenerse reconciliado; reserva el modo directo para correcciones puntuales.", "Tras cada etapa, ejecuta su validación de componente y lee el reporte antes de continuar.", "Configura los certificados personalizados de API e Ingress (lección 4.4.8.1): validar, renderizar, aplicar, verificar endpoints y conocer el rollback.", "Comprobación de salida: el reporte Day-2 consolidado muestra todas las etapas listas."]}, "module-5": {"title": "Ejecución", "items": ["Ejecuta <code>playbooks/day2/health-checks.yml</code> y <code>playbooks/day2/cluster-health.yml</code>; guarda los reportes estructurados.", "Revisa la salud de etcd (<code>etcd-health.yml</code>) y haz una copia de etcd (<code>etcd-backup.yml</code>) antes de cambiar nada.", "Revisa la monitorización de plataforma y de cargas de usuario; confirma que el enrutado de Alertmanager entrega una alerta de prueba.", "Cuando una comprobación falle, recoge <code>must-gather</code>, remedia la causa y repite hasta que el reporte quede en verde.", "Practica el rollback del último cambio aplicado: un rollback no ensayado no existe.", "Programa los reportes: la evidencia de salud es parte de la operación, no un añadido."]}, "module-6": {"title": "Ejecución", "items": ["Instala ACM en el hub: <code>playbooks/day2/acm.yml</code> (perfil de hub en <code>acm-hub.yml</code>) y verifica que los operadores del hub están listos.", "Configura la observabilidad multiclúster (<code>playbooks/day2/multicluster-observability.yml</code>).", "Registra los hosts bare-metal destino con su red estática (<code>playbooks/day2/acm-bmh-static-networking.yml</code>).", "Crea el clúster gestionado desde ACM y observa cómo el aprovisionamiento reutiliza los mismos contratos de inventario que una instalación local.", "Aplica la base Day-2 al clúster gestionado mediante el ciclo de vida de aplicaciones GitOps (<code>gitops-application-lifecycle.yml</code>).", "Verifica que políticas y placements reportan <i>compliant</i> para el nuevo clúster."]}, "module-7": {"title": "Ejecución", "items": ["Preparación: un inventario nuevo, tres hosts de control y dos workers (o el equivalente de laboratorio), modo desconectado ACTIVADO.", "De memoria, ejecuta la ruta completa de instalación: preflight, discover, mirror, boot, install.", "Aplica la base Day-2 ordenada con al menos las etapas de observability, gitops, identity y backup.", "Introduce un fallo (un disk id incorrecto o un token caducado), diagnósticalo desde los reportes y recupérate.", "Criterios de éxito: clúster instalado, base en verde y paquete de evidencia completo, sin abrir las guías paso a paso."]}, "materials": {"title": "Ejecución", "items": ["Empieza en <code>docs/README.md</code>: el índice de todas las guías del repositorio.", "Ten abierta <code>docs/playbooks-reference.md</code> mientras trabajas: mapea cada playbook, rol, acción de la GUI y el papel de Helm.", "Ante cualquier duda de variable, usa <code>docs/variable-reference.md</code>: nunca adivines el nombre de una variable.", "Para incidentes, sigue <code>docs/troubleshooting.md</code> y la guía de ganchos de reporte y validación.", "Las fuentes AsciiDoc en <code>workshop/documentation/</code> siguen siendo la referencia imprimible de este workshop."]}}, "pt": {"start": {"title": "Execução", "items": ["Escolhe o teu idioma na caixa combinada de bandeiras — a página inteira recarrega nesse idioma.", "Percorre a agenda por ordem: primeiro os três caminhos de implementação e depois os Módulos 1 a 7.", "Prepara um bastião com Podman, Ansible, a CLI do OpenShift (<code>oc</code>), <code>jq</code> e este repositório clonado.", "Mantém o inventário de exemplo (<code>inventories/sample</code>) à mão: todos os procedimentos leem os seus contratos daí.", "Usa a caixa de pesquisa e o índice de cada passo para te moveres dentro dos procedimentos longos.", "Resultado esperado: terminas capaz de instalar um cluster e executar toda a sua base do Dia 2 sem ajuda."]}, "deploy-playbooks": {"title": "Execução", "items": ["Copia o inventário de exemplo: <code>cp -r inventories/sample inventories/prod</code>.", "Edita <code>inventories/prod/hosts.yml</code>: uma entrada por host com <code>bmc_type</code>, <code>bmc_endpoint</code>, <code>node_role</code>, hostname, IPv4 e <code>installation_disk_id</code>.", "Preenche <code>group_vars/all/00-required.yml</code> (nome do cluster, domínio DNS, versão, contagens, redes, VIPs) e depois <code>10-assisted.yml</code> e <code>20-networking.yml</code>; completa <code>30-disconnected.yml</code> apenas no modo desligado.", "Cria o Vault a partir de <code>vault.yml.example</code>, preenche todos os segredos e encripta-o com <code>ansible-vault encrypt</code>.", "Executa o preflight: <code>ansible-playbook playbooks/00-preflight.yml -i inventories/prod</code> — deve terminar sem nenhum <code>CHANGE_ME</code> pendente.", "Descobre o hardware: <code>playbooks/day0/discover-bmc.yml</code>; revê o relatório BMC e confirma cada <code>installation_disk_id</code>.", "Apenas desligado — espelha a release: <code>playbooks/day0/prepare-mirror.yml</code> renderiza e executa o fluxo oc-mirror v2.", "Arranca os hosts: <code>playbooks/02-boot-discovery-iso.yml</code> anexa a ISO via Redfish; observa cada host a registar-se no Assisted Installer.", "Instala: <code>playbooks/day0/install.yml</code>. Ao terminar, ejeta o meio com <code>playbooks/90-eject-media.yml</code> e arquiva o kubeconfig e os relatórios como evidência."]}, "deploy-gui": {"title": "Execução", "items": ["Gera o token de acesso: <code>export INSTALLER_UI_AUTH_TOKENS=\"$(openssl rand -hex 24)=admin\"</code> e guarda-o em <code>.installer-ui.vault</code> com modo 600.", "Constrói e arranca: <code>podman compose build --no-cache installer-ui</code> e <code>podman compose up -d</code>; abre <code>http://127.0.0.1:8080</code>.", "Inicia sessão com o token (a parte antes do <code>=</code>).", "Cria um perfil e preenche os grupos por ordem: 00 Cluster, 10 Assisted API, 20 Networking, 30 Disconnected (só se aplicar), 40 BMC com um cartão por host, 50 Runtime, 60 Day-2 GitOps.", "Coloca cada segredo no grupo Secrets (pull secret, chave SSH, credenciais BMC, o token offline da Red Hat no modo SaaS) e guarda com a palavra-passe do Vault — os segredos ficam encriptados e nunca voltam a ser mostrados.", "Prime <b>Validate</b> e corrige cada erro de campo listado; nada é executado com um perfil inválido.", "Executa as ações pela ordem do diagrama (preflight, discover, mirror, boot, install), escrevendo <code>MIRROR</code>, <code>BOOT</code> ou <code>INSTALL</code> quando a GUI pedir confirmação.", "Termina com <b>day2-render</b> para pré-visualizar o estado desejado e depois <b>day2-deploy</b> (confirmação <code>GITOPS</code>) para arrancar o GitOps; descarrega os relatórios como evidência."]}, "operators": {"title": "Execução", "items": ["Abre <code>framework/day2-operator-catalog.yml</code> e escolhe um perfil (minimal, enterprise, observability) ou componentes individuais.", "Renderiza antes de aplicar: <code>ansible-playbook playbooks/day2/render-gitops.yml</code> (ou a ação <b>day2-render</b> da GUI) e revê os manifestos gerados.", "Deixa a validação verificar a seleção: canais e dependências são resolvidos contra o catálogo antes de aplicar qualquer coisa.", "Implementa pela ordem da base do diagrama seguinte — nunca saltes uma etapa de que um componente posterior dependa.", "Modo direto: executa <code>playbooks/install-platform-operator.yml -e component_name=&lt;chave&gt;</code> por componente. Modo GitOps: usa a ação <b>day2-deploy</b>.", "Verifica que cada operador reporta <i>Succeeded</i> e os seus operandos estão prontos antes de passar à etapa seguinte.", "Repete qualquer etapa em segurança quando tiveres dúvidas: todos os playbooks são idempotentes."]}, "module-1": {"title": "Execução", "items": ["Clona o repositório no bastião e instala as coleções: <code>ansible-galaxy collection install -r collections/requirements.yml</code>.", "Executa <code>./scripts/validate.sh</code> — as verificações de repositório, inventário, Kustomize e manifestos têm de passar antes de continuar.", "Percorre <code>inventories/sample</code> ficheiro a ficheiro (hosts, group_vars 00 a 60, exemplo de vault) e mapeia cada grupo para o seu contrato em <code>framework/input-contracts.yml</code>.", "Prepara o próprio bastião com <code>playbooks/configure-bastion.yml</code>.", "Cria a tua cópia de trabalho e o seu Vault (<code>playbooks/day0/create-vault.yml</code>) — nunca edites o inventário de exemplo no lugar.", "Verificação de saída: o preflight contra o inventário de exemplo reporta apenas os erros de marcadores esperados."]}, "module-2": {"title": "Execução", "items": ["Confirma a acessibilidade dos BMC a partir do bastião: o HTTPS deve responder em cada endpoint iLO/iDRAC do teu inventário.", "Executa a descoberta: <code>playbooks/day0/discover-bmc.yml</code> contra o teu inventário.", "Lê o relatório BMC gerado host a host: modelo, firmware, MAC das NIC e lista de discos.", "Resolve o <code>installation_disk_id</code> de cada host a partir desse relatório — nunca o adivinhes.", "Testa o meio virtual primeiro num único host: <code>playbooks/03-test-virtual-media.yml --limit &lt;host&gt;</code>.", "Corrige já cablagem, firmware ou credenciais: um host que não monta o meio não consegue instalar."]}, "module-3": {"title": "Execução", "items": ["Apenas desligado: completa primeiro a etapa de espelho (prepare-mirror executa sempre antes do arranque).", "Arranca todos os hosts: <code>playbooks/02-boot-discovery-iso.yml</code>; confirma que cada host se regista no Assisted Installer.", "Valida a definição do cluster no Assisted Installer: VIPs, modo de rede e papéis dos hosts.", "Instala: <code>playbooks/day0/install.yml</code> e monitoriza até o cluster reportar <i>installed</i>.", "Ejeta o meio: <code>playbooks/90-eject-media.yml</code>, para os hosts arrancarem do disco no próximo reinício.", "Descarrega o kubeconfig e as credenciais, executa as verificações de evidência pós-instalação e arquiva os relatórios."]}, "module-4": {"title": "Execução", "items": ["Começa pelo básico do cluster: NTP (<code>playbooks/day2/chrony.yml</code>), etiquetas dos nós e identidade (LDAP, HTPasswd ou OAuth).", "Aplica a base ordenada do diagrama seguinte, etapa a etapa e por ordem.", "Prefere o modo GitOps para tudo o que deva manter-se reconciliado; reserva o modo direto para correções pontuais.", "Após cada etapa, executa a sua validação de componente e lê o relatório antes de continuar.", "Configura os certificados personalizados de API e Ingress (lição 4.4.8.1): validar, renderizar, aplicar, verificar endpoints e conhecer o rollback.", "Verificação de saída: o relatório consolidado do Dia 2 mostra todas as etapas prontas."]}, "module-5": {"title": "Execução", "items": ["Executa <code>playbooks/day2/health-checks.yml</code> e <code>playbooks/day2/cluster-health.yml</code>; guarda os relatórios estruturados.", "Verifica a saúde do etcd (<code>etcd-health.yml</code>) e faz um backup do etcd (<code>etcd-backup.yml</code>) antes de alterar o que quer que seja.", "Revê a monitorização da plataforma e das cargas do utilizador; confirma que o encaminhamento do Alertmanager entrega um alerta de teste.", "Quando uma verificação falhar, recolhe <code>must-gather</code>, remedeia a causa e repete até o relatório ficar verde.", "Pratica o rollback da última alteração aplicada — um rollback não ensaiado não existe.", "Agenda os relatórios: a evidência de saúde faz parte da operação, não é um extra."]}, "module-6": {"title": "Execução", "items": ["Instala o ACM no hub: <code>playbooks/day2/acm.yml</code> (perfil de hub em <code>acm-hub.yml</code>) e verifica que os operadores do hub estão prontos.", "Configura a observabilidade multicluster (<code>playbooks/day2/multicluster-observability.yml</code>).", "Regista os hosts bare-metal de destino com a sua rede estática (<code>playbooks/day2/acm-bmh-static-networking.yml</code>).", "Cria o cluster gerido a partir do ACM e observa o aprovisionamento a reutilizar os mesmos contratos de inventário de uma instalação local.", "Aplica a base do Dia 2 ao cluster gerido através do ciclo de vida de aplicações GitOps (<code>gitops-application-lifecycle.yml</code>).", "Verifica que políticas e placements reportam <i>compliant</i> para o novo cluster."]}, "module-7": {"title": "Execução", "items": ["Preparação: um inventário novo, três hosts de control plane e dois workers (ou o equivalente de laboratório), modo desligado ATIVADO.", "De memória, executa o caminho completo de instalação: preflight, discover, mirror, boot, install.", "Aplica a base ordenada do Dia 2 com pelo menos as etapas de observability, gitops, identity e backup.", "Introduz uma falha (um disk id errado ou um token expirado), diagnostica-a a partir dos relatórios e recupera.", "Critérios de sucesso: cluster instalado, base verde e pacote de evidência completo — sem abrir os guias passo a passo."]}, "materials": {"title": "Execução", "items": ["Começa por <code>docs/README.md</code>: o índice de todos os guias do repositório.", "Mantém <code>docs/playbooks-reference.md</code> aberta enquanto trabalhas — mapeia cada playbook, função, ação da GUI e o papel do Helm.", "Para qualquer dúvida de variável, usa <code>docs/variable-reference.md</code>; nunca adivinhes o nome de uma variável.", "Para incidentes, segue <code>docs/troubleshooting.md</code> e o guia de ganchos de relatório e validação.", "As fontes AsciiDoc em <code>workshop/documentation/</code> continuam a ser a referência imprimível deste workshop."]}}, "de": {"start": {"title": "Ausführung", "items": ["Wähle deine Sprache in der Flaggen-Auswahlbox — die ganze Seite lädt in dieser Sprache neu.", "Arbeite die Agenda der Reihe nach ab: zuerst die drei Bereitstellungspfade, dann die Module 1 bis 7.", "Bereite eine Bastion mit Podman, Ansible, der OpenShift-CLI (<code>oc</code>), <code>jq</code> und diesem geklonten Repository vor.", "Halte das Beispielinventar (<code>inventories/sample</code>) bereit: Jedes Verfahren liest seine Verträge von dort.", "Nutze die Suche und das Inhaltsverzeichnis jedes Schritts, um dich in langen Verfahren zu bewegen.", "Erwartetes Ergebnis: Du kannst am Ende einen Cluster installieren und seine komplette Day-2-Basis eigenständig betreiben."]}, "deploy-playbooks": {"title": "Ausführung", "items": ["Kopiere das Beispielinventar: <code>cp -r inventories/sample inventories/prod</code>.", "Bearbeite <code>inventories/prod/hosts.yml</code>: ein Eintrag pro Host mit <code>bmc_type</code>, <code>bmc_endpoint</code>, <code>node_role</code>, Hostname, IPv4-Adresse und <code>installation_disk_id</code>.", "Fülle <code>group_vars/all/00-required.yml</code> (Clustername, DNS-Domain, Version, Knotenzahlen, Netzwerke, VIPs), danach <code>10-assisted.yml</code> und <code>20-networking.yml</code>; <code>30-disconnected.yml</code> nur im getrennten Modus ausfüllen.", "Erstelle den Vault aus <code>vault.yml.example</code>, fülle alle Secrets aus und verschlüssele ihn mit <code>ansible-vault encrypt</code>.", "Führe den Preflight aus: <code>ansible-playbook playbooks/00-preflight.yml -i inventories/prod</code> — er muss ohne verbleibende <code>CHANGE_ME</code>-Platzhalter enden.", "Entdecke die Hardware: <code>playbooks/day0/discover-bmc.yml</code>; prüfe den BMC-Bericht und bestätige jede <code>installation_disk_id</code>.", "Nur getrennt — spiegle das Release: <code>playbooks/day0/prepare-mirror.yml</code> rendert und führt den oc-mirror-v2-Ablauf aus.", "Boote die Hosts: <code>playbooks/02-boot-discovery-iso.yml</code> hängt die ISO per Redfish an; beobachte, wie sich jeder Host im Assisted Installer registriert.", "Installiere: <code>playbooks/day0/install.yml</code>. Danach das Medium mit <code>playbooks/90-eject-media.yml</code> auswerfen und Kubeconfig sowie Berichte als Nachweis ablegen."]}, "deploy-gui": {"title": "Ausführung", "items": ["Erzeuge das Zugriffstoken: <code>export INSTALLER_UI_AUTH_TOKENS=\"$(openssl rand -hex 24)=admin\"</code> und speichere es in <code>.installer-ui.vault</code> mit Modus 600.", "Baue und starte: <code>podman compose build --no-cache installer-ui</code> und <code>podman compose up -d</code>; öffne <code>http://127.0.0.1:8080</code>.", "Melde dich mit dem Token an (der Teil vor dem <code>=</code>).", "Erstelle ein Profil und fülle die Gruppen der Reihe nach: 00 Cluster, 10 Assisted API, 20 Networking, 30 Disconnected (nur falls zutreffend), 40 BMC mit einer Karte pro Host, 50 Runtime, 60 Day-2 GitOps.", "Lege jedes Secret in der Gruppe Secrets ab (Pull Secret, SSH-Schlüssel, BMC-Zugangsdaten, das Red-Hat-Offline-Token im SaaS-Modus) und speichere mit dem Vault-Passwort — Secrets werden verschlüsselt gespeichert und nie wieder angezeigt.", "Drücke <b>Validate</b> und korrigiere jeden gelisteten Feldfehler; mit einem ungültigen Profil läuft nichts.", "Führe die Aktionen in der Diagrammreihenfolge aus (preflight, discover, mirror, boot, install) und tippe <code>MIRROR</code>, <code>BOOT</code> oder <code>INSTALL</code>, wenn die GUI eine Bestätigung verlangt.", "Schließe mit <b>day2-render</b> zur Vorschau des Zielzustands und danach <b>day2-deploy</b> (Bestätigung <code>GITOPS</code>) zum Bootstrap von GitOps ab; lade die Laufberichte als Nachweis herunter."]}, "operators": {"title": "Ausführung", "items": ["Öffne <code>framework/day2-operator-catalog.yml</code> und wähle ein Profil (minimal, enterprise, observability) oder einzelne Komponenten.", "Rendere vor dem Anwenden: <code>ansible-playbook playbooks/day2/render-gitops.yml</code> (oder die GUI-Aktion <b>day2-render</b>) und prüfe die erzeugten Manifeste.", "Lass die Validierung die Auswahl prüfen: Kanäle und Abhängigkeiten werden gegen den Katalog aufgelöst, bevor etwas angewendet wird.", "Stelle in der Basisreihenfolge des folgenden Diagramms bereit — überspringe nie eine Stufe, von der eine spätere Komponente abhängt.", "Direktmodus: <code>playbooks/install-platform-operator.yml -e component_name=&lt;key&gt;</code> pro Komponente ausführen. GitOps-Modus: stattdessen die Aktion <b>day2-deploy</b> nutzen.", "Prüfe, dass jeder Operator <i>Succeeded</i> meldet und seine Operanden bereit sind, bevor du zur nächsten Stufe gehst.", "Wiederhole jede Stufe im Zweifel gefahrlos: Alle Playbooks sind idempotent."]}, "module-1": {"title": "Ausführung", "items": ["Klone das Repository auf der Bastion und installiere die Collections: <code>ansible-galaxy collection install -r collections/requirements.yml</code>.", "Führe <code>./scripts/validate.sh</code> aus — Repository-, Inventar-, Kustomize- und Manifestprüfungen müssen alle bestehen, bevor du weitermachst.", "Gehe <code>inventories/sample</code> Datei für Datei durch (Hosts, group_vars 00 bis 60, Vault-Beispiel) und ordne jede Gruppe ihrem Vertrag in <code>framework/input-contracts.yml</code> zu.", "Bereite die Bastion selbst mit <code>playbooks/configure-bastion.yml</code> vor.", "Erstelle deine Arbeitskopie und ihren Vault (<code>playbooks/day0/create-vault.yml</code>) — bearbeite das Beispielinventar nie an Ort und Stelle.", "Abschlussprüfung: Der Preflight gegen das Beispielinventar meldet nur die erwarteten Platzhalterfehler."]}, "module-2": {"title": "Ausführung", "items": ["Prüfe die BMC-Erreichbarkeit von der Bastion: HTTPS muss auf jedem iLO-/iDRAC-Endpunkt deines Inventars antworten.", "Führe die Entdeckung aus: <code>playbooks/day0/discover-bmc.yml</code> gegen dein Inventar.", "Lies den erzeugten BMC-Bericht Host für Host: Modell, Firmware, NIC-MAC-Adressen und Datenträgerliste.", " Löse die <code>installation_disk_id</code> jedes Hosts aus diesem Bericht auf — rate sie niemals.", "Teste die virtuellen Medien zuerst an einem einzelnen Host: <code>playbooks/03-test-virtual-media.yml --limit &lt;host&gt;</code>.", "Behebe Verkabelungs-, Firmware- oder Zugangsdatenprobleme jetzt: Ein Host, der kein Medium einhängen kann, kann nicht installieren."]}, "module-3": {"title": "Ausführung", "items": ["Nur getrennt: Schließe zuerst die Mirror-Stufe ab (prepare-mirror läuft immer vor dem Boot).", "Boote alle Hosts: <code>playbooks/02-boot-discovery-iso.yml</code>; bestätige, dass sich jeder Host im Assisted Installer registriert.", "Validiere die Clusterdefinition im Assisted Installer: VIPs, Netzwerkmodus und Hostrollen.", "Installiere: <code>playbooks/day0/install.yml</code> und überwache, bis der Cluster <i>installed</i> meldet.", "Wirf das Medium aus: <code>playbooks/90-eject-media.yml</code>, damit die Hosts beim nächsten Neustart von der Platte booten.", "Lade Kubeconfig und Zugangsdaten herunter, führe die Nachweisprüfungen nach der Installation aus und lege die Berichte ab."]}, "module-4": {"title": "Ausführung", "items": ["Beginne mit den Cluster-Grundlagen: NTP (<code>playbooks/day2/chrony.yml</code>), Knotenlabels und Identität (LDAP, HTPasswd oder OAuth).", "Wende die geordnete Basis des folgenden Diagramms Stufe für Stufe und in Reihenfolge an.", "Bevorzuge den GitOps-Modus für alles, was abgeglichen bleiben muss; behalte den Direktmodus für einmalige Korrekturen.", "Führe nach jeder Stufe ihre Komponentenvalidierung aus und lies den Bericht, bevor du weitermachst.", "Konfiguriere die benutzerdefinierten API- und Ingress-Zertifikate (Lektion 4.4.8.1): validieren, rendern, anwenden, Endpunkte prüfen und den Rollback kennen.", "Abschlussprüfung: Der konsolidierte Day-2-Bericht zeigt alle Stufen bereit."]}, "module-5": {"title": "Ausführung", "items": ["Führe <code>playbooks/day2/health-checks.yml</code> und <code>playbooks/day2/cluster-health.yml</code> aus; speichere die strukturierten Berichte.", "Prüfe die etcd-Gesundheit (<code>etcd-health.yml</code>) und erstelle ein etcd-Backup (<code>etcd-backup.yml</code>), bevor du irgendetwas änderst.", "Prüfe Plattform- und Workload-Monitoring; bestätige, dass das Alertmanager-Routing einen Testalarm zustellt.", "Wenn eine Prüfung fehlschlägt, sammle <code>must-gather</code>, behebe die Ursache und wiederhole, bis der Bericht grün ist.", "Übe den Rollback der zuletzt angewendeten Änderung — ein nicht geübter Rollback existiert nicht.", "Plane die Berichte ein: Gesundheitsnachweise sind Teil des Betriebs, kein Anhängsel."]}, "module-6": {"title": "Ausführung", "items": ["Installiere ACM auf dem Hub: <code>playbooks/day2/acm.yml</code> (Hub-Profil in <code>acm-hub.yml</code>) und prüfe, dass die Hub-Operatoren bereit sind.", "Konfiguriere die Multicluster-Observability (<code>playbooks/day2/multicluster-observability.yml</code>).", "Registriere die Ziel-Bare-Metal-Hosts mit ihrer statischen Vernetzung (<code>playbooks/day2/acm-bmh-static-networking.yml</code>).", "Erstelle den verwalteten Cluster aus ACM und beobachte, wie die Bereitstellung dieselben Inventarverträge wie eine lokale Installation wiederverwendet.", "Wende die Day-2-Basis über den GitOps-Anwendungslebenszyklus (<code>gitops-application-lifecycle.yml</code>) auf den verwalteten Cluster an.", "Prüfe, dass Richtlinien und Placements für den neuen Cluster <i>compliant</i> melden."]}, "module-7": {"title": "Ausführung", "items": ["Vorbereitung: ein frisches Inventar, drei Control-Plane- und zwei Worker-Hosts (oder das Laboräquivalent), getrennter Modus EIN.", "Führe aus dem Gedächtnis den vollständigen Installationspfad aus: preflight, discover, mirror, boot, install.", "Wende die geordnete Day-2-Basis mit mindestens den Stufen observability, gitops, identity und backup an.", "Führe einen Fehler ein (eine falsche Disk-ID oder ein abgelaufenes Token), diagnostiziere ihn aus den Berichten und stelle den Zustand wieder her.", "Erfolgskriterien: Cluster installiert, Basis grün und ein vollständiges Nachweispaket — ohne die Schritt-für-Schritt-Anleitungen zu öffnen."]}, "materials": {"title": "Ausführung", "items": ["Beginne bei <code>docs/README.md</code>: dem Index aller Anleitungen im Repository.", "Halte <code>docs/playbooks-reference.md</code> beim Arbeiten offen — sie bildet jedes Playbook, jede Rolle, jede GUI-Aktion und die Rolle von Helm ab.", "Nutze bei jeder Variablenfrage <code>docs/variable-reference.md</code>; rate niemals einen Variablennamen.", "Folge bei Vorfällen <code>docs/troubleshooting.md</code> und der Anleitung zu Berichts- und Validi
