const cards=[{id:"deploy-playbooks",title:"1. Deployment with Playbooks",group:(lang==='es'?"Rutas de despliegue":"Deployment paths"),summary:(lang==='es'?"Instalación conectada o desconectada, Día 2 y GitOps solo con Ansible.":"Connected or disconnected installation, Day-2, and GitOps with Ansible only.")},{id:"deploy-gui",title:"2. Deployment with the GUI Interface",group:(lang==='es'?"Rutas de despliegue":"Deployment paths"),summary:(lang==='es'?"Los mismos procedimientos desde formularios validados en un contenedor en el bastión.":"The same procedures through validated forms in a container on the bastion.")},{id:"operators",title:"3. Operators",group:(lang==='es'?"Rutas de despliegue":"Deployment paths"),summary:(lang==='es'?"Catálogo de más de 50 operadores con entrega directa o GitOps.":"Catalog of more than 50 operators with direct or GitOps delivery.")},{id:"module-1",title:"Module 1: Foundations",group:(lang==='es'?"Currículo":"Curriculum"),summary:(lang==='es'?"Entorno, inventario, perfiles y credenciales.":"Environment, inventory, profiles, and credentials.")},{id:"module-2",title:"Module 2: Redfish Validation",group:(lang==='es'?"Currículo":"Curriculum"),summary:(lang==='es'?"Validar la gestión fuera de banda antes de instalar.":"Validate out-of-band management before installation.")},{id:"module-3",title:"Module 3: OpenShift Installation",group:(lang==='es'?"Currículo":"Curriculum"),summary:(lang==='es'?"ISO de descubrimiento, arranque e instalación con Assisted Installer.":"Discovery ISO, boot, and Assisted Installer installation.")},{id:"module-4",title:"Module 4: Ordered Day-2 Foundation",group:(lang==='es'?"Currículo":"Curriculum"),summary:(lang==='es'?"Configuración posterior a la instalación en orden controlado.":"Post-installation configuration in a controlled order.")},{id:"module-5",title:"Module 5: Health Check and Day-2 Operations",group:(lang==='es'?"Currículo":"Curriculum"),summary:(lang==='es'?"Salud de la plataforma, evidencia y extensión del framework.":"Platform health, evidence, and framework extension.")},{id:"module-6",title:"Module 6: Deploy a Cluster from ACM",group:(lang==='es'?"Currículo":"Curriculum"),summary:(lang==='es'?"ACM como plano de control para desplegar otro clúster.":"ACM as the control plane to deploy another cluster.")},{id:"module-7",title:"Module 7: Challenge",group:(lang==='es'?"Currículo":"Curriculum"),summary:(lang==='es'?"Escenario integral de fin a fin con todo el framework.":"End-to-end integrated scenario across the framework.")}]; const steps=[
{id:"start",title:"OpenShift Automation Framework Workshop",group:(lang==='es'?"Inicio":"Home"),summary:(lang==='es'?"Ruta práctica: instalación bare-metal, Día 2, salud y ACM.":"Hands-on path: bare-metal installation, Day-2, health, and ACM."),html:(lang==='es'?"<section class=\"hero\"><div class=\"hero-copy\"><div class=\"eyebrow\">Open-Industries × OpenDemoDays</div><h1>OpenShift Automation Framework Workshop</h1><p>Este workshop ofrece una ruta práctica y progresiva para automatizar el descubrimiento bare-metal, la instalación de OpenShift, la configuración de plataforma de Día 2, la validación de salud y el despliegue de clústeres gestionados.</p></div></section><h2>Escenarios canónicos de despliegue</h2><p>Las rutas de despliegue al inicio de la navegación ofrecen caminos operativos completos. Elige el laboratorio de Día 0 conectado o desconectado y la interfaz de playbooks o GUI, y después completa un laboratorio de Día 2 con GitOps.</p><div class=\"cards\">"+cards.map((s,i)=>'<a class="card" href="#'+s.id+'"><b>0'+(i+1)+' · '+s.group+'</b><strong>'+s.title+'</strong><span>'+s.summary+'</span></a>').join('')+"</div><h2>Resultados del workshop</h2><p>Al completar el workshop serás capaz de:</p><ul><li>Preparar un entorno de ejecución Ansible repetible y proteger los datos sensibles.</li><li>Descubrir y validar sistemas HPE iLO y Dell iDRAC de distintos proveedores mediante Redfish.</li><li>Instalar y verificar OpenShift con el flujo de Assisted Installer.</li><li>Ejecutar la instalación conectada o desconectada mediante playbooks o la interfaz GUI.</li><li>Configurar la base ordenada de Día 2 y los operadores de plataforma mediante entrega directa o GitOps.</li><li>Renderizar y arrancar el GitOps de Día 2 mediante playbooks o la interfaz GUI.</li><li>Ejecutar comprobaciones de salud, generar evidencia y extender el framework de automatización de forma segura.</li><li>Generar, validar y desplegar un clúster gestionado desde Red Hat Advanced Cluster Management.</li><li>Completar un reto integrado que ejercita el ciclo de vida completo de la automatización.</li></ul>":"<section class=\"hero\"><div class=\"hero-copy\"><div class=\"eyebrow\">Open-Industries × OpenDemoDays</div><h1>OpenShift Automation Framework Workshop</h1><p>This workshop provides a progressive, hands-on path for automating bare-metal discovery, OpenShift installation, Day-2 platform configuration, health validation, and managed-cluster deployment.</p></div></section><h2>Canonical Deployment Scenarios</h2><p>The deployment paths at the top of the navigation provide complete operational paths. Choose the connected or disconnected Day-0 lab and the playbook or GUI interface, then complete one Day-2 GitOps lab.</p><div class=\"cards\">"+cards.map((s,i)=>'<a class="card" href="#'+s.id+'"><b>0'+(i+1)+' · '+s.group+'</b><strong>'+s.title+'</strong><span>'+s.summary+'</span></a>').join('')+"</div><h2>Workshop Outcomes</h2><p>By completing the workshop, you will be able to:</p><ul><li>Prepare a repeatable Ansible execution environment and protect sensitive data.</li><li>Discover and validate mixed-vendor HPE iLO and Dell iDRAC systems through Redfish.</li><li>Install and verify OpenShift with the Assisted Installer workflow.</li><li>Execute connected or disconnected installation through playbooks or the GUI interface.</li><li>Configure ordered Day-2 foundations and platform operators through direct or GitOps delivery.</li><li>Render and bootstrap Day-2 GitOps through playbooks or the GUI interface.</li><li>Run health checks, generate evidence, and extend the automation framework safely.</li><li>Generate, validate, and deploy a managed cluster from Red Hat Advanced Cluster Management.</li><li>Complete an integrated challenge that exercises the full automation lifecycle.</li></ul>")},
{id:"deploy-playbooks",title:"1. Deployment with Playbooks",group:(lang==='es'?"Rutas de despliegue":"Deployment paths"),summary:(lang==='es'?"Instalación conectada o desconectada, Día 2 y GitOps solo con Ansible.":"Connected or disconnected installation, Day-2, and GitOps with Ansible only."),html:(lang==='es'?"<h2>1.1 Connected OpenShift</h2><p>Prepara el inventario desde la plantilla de ejemplo, valida el repositorio y el inventario, descubre los BMC, prueba el medio virtual en un solo host e instala con Assisted Installer:</p><pre><code>./scripts/validate.sh inventories/lab-cluster/hosts.yml<br>ansible-inventory -i inventories/lab-cluster/hosts.yml --list &gt;/dev/null</code></pre><pre><code>ansible-playbook -i inventories/lab-cluster/hosts.yml --ask-vault-pass \\<br>&nbsp;&nbsp;playbooks/day0/discover-bmc.yml<br>ansible-playbook -i inventories/lab-cluster/hosts.yml --ask-vault-pass \\<br>&nbsp;&nbsp;playbooks/03-test-virtual-media.yml --limit worker-0 \\<br>&nbsp;&nbsp;-e test_iso_url=https://mirror.example.com/agent.iso<br>ansible-playbook -i inventories/lab-cluster/hosts.yml --ask-vault-pass \\<br>&nbsp;&nbsp;playbooks/day0/install.yml</code></pre><h2>1.2 Disconnected OpenShift</h2><p>Usa el mismo punto de entrada de instalación. En el inventario define <code>deployment_mode</code>, <code>disconnected_environment</code> y <code>oc_mirror_workflow</code>, prepara el espejo de versiones con oc-mirror v2 y después ejecuta la instalación:</p><pre><code>ansible-playbook -i inventories/lab-cluster/hosts.yml --ask-vault-pass \\<br>&nbsp;&nbsp;playbooks/day0/prepare-mirror.yml</code></pre><pre><code>ansible-playbook -i inventories/lab-cluster/hosts.yml --ask-vault-pass \\<br>&nbsp;&nbsp;playbooks/day0/discover-bmc.yml<br>ansible-playbook -i inventories/lab-cluster/hosts.yml --ask-vault-pass \\<br>&nbsp;&nbsp;playbooks/03-test-virtual-media.yml --limit worker-0 \\<br>&nbsp;&nbsp;-e test_iso_url=https://mirror.example.com/agent.iso<br>ansible-playbook -i inventories/lab-cluster/hosts.yml --ask-vault-pass \\<br>&nbsp;&nbsp;playbooks/day0/install.yml</code></pre><h2>1.3 Day-2 Activities</h2><p>El modo directo aplica los recursos validados con <code>kubernetes.core.k8s</code>; úsalo para administración controlada, recuperación break-glass o entornos que aún no gestiona GitOps:</p><pre><code>ansible-playbook playbooks/install-platform-operator.yml \\<br>&nbsp;&nbsp;-e operator_lifecycle_component=acm \\<br>&nbsp;&nbsp;-e operator_lifecycle_deployment_mode=direct<br>ansible-playbook playbooks/day2/oauth.yml -e day2_deployment_mode=direct</code></pre><h2>1.4 GitOps Initialization</h2><p>Renderiza primero el estado deseado sin tocar el clúster y después arranca OpenShift GitOps con AppProject, Application, aplicación raíz y ApplicationSet estandarizados:</p><pre><code>ansible-playbook playbooks/gitops-foundation.yml \\<br>&nbsp;&nbsp;-e gitops_foundation_mode=render -e gitops_foundation_environment=lab<br>ansible-playbook playbooks/gitops-foundation.yml \\<br>&nbsp;&nbsp;-e gitops_foundation_mode=gitops -e gitops_foundation_environment=production<br>make day2-render<br>make day2-deploy</code></pre>":"<h2>1.1 Connected OpenShift</h2><p>Prepare an inventory from the sample template, validate the repository and inventory, discover the BMCs, test virtual media on one host, and install with the Assisted Installer:</p><pre><code>./scripts/validate.sh inventories/lab-cluster/hosts.yml<br>ansible-inventory -i inventories/lab-cluster/hosts.yml --list &gt;/dev/null</code></pre><pre><code>ansible-playbook -i inventories/lab-cluster/hosts.yml --ask-vault-pass \\<br>&nbsp;&nbsp;playbooks/day0/discover-bmc.yml<br>ansible-playbook -i inventories/lab-cluster/hosts.yml --ask-vault-pass \\<br>&nbsp;&nbsp;playbooks/03-test-virtual-media.yml --limit worker-0 \\<br>&nbsp;&nbsp;-e test_iso_url=https://mirror.example.com/agent.iso<br>ansible-playbook -i inventories/lab-cluster/hosts.yml --ask-vault-pass \\<br>&nbsp;&nbsp;playbooks/day0/install.yml</code></pre><h2>1.2 Disconnected OpenShift</h2><p>Use the same installation entry point. In the inventory set <code>deployment_mode</code>, <code>disconnected_environment</code>, and <code>oc_mirror_workflow</code>, prepare the release mirror with oc-mirror v2, and then run the installation:</p><pre><code>ansible-playbook -i inventories/lab-cluster/hosts.yml --ask-vault-pass \\<br>&nbsp;&nbsp;playbooks/day0/prepare-mirror.yml</code></pre><pre><code>ansible-playbook -i inventories/lab-cluster/hosts.yml --ask-vault-pass \\<br>&nbsp;&nbsp;playbooks/day0/discover-bmc.yml<br>ansible-playbook -i inventories/lab-cluster/hosts.yml --ask-vault-pass \\<br>&nbsp;&nbsp;playbooks/03-test-virtual-media.yml --limit worker-0 \\<br>&nbsp;&nbsp;-e test_iso_url=https://mirror.example.com/agent.iso<br>ansible-playbook -i inventories/lab-cluster/hosts.yml --ask-vault-pass \\<br>&nbsp;&nbsp;playbooks/day0/install.yml</code></pre><h2>1.3 Day-2 Activities</h2><p>Direct mode applies validated resources with <code>kubernetes.core.k8s</code>; use it for controlled administration, break-glass recovery, or environments not yet managed by GitOps:</p><pre><code>ansible-playbook playbooks/install-platform-operator.yml \\<br>&nbsp;&nbsp;-e operator_lifecycle_component=acm \\<br>&nbsp;&nbsp;-e operator_lifecycle_deployment_mode=direct<br>ansible-playbook playbooks/day2/oauth.yml -e day2_deployment_mode=direct</code></pre><h2>1.4 GitOps Initialization</h2><p>Render the desired state first without touching the cluster, then bootstrap OpenShift GitOps with standardized AppProject, Application, root application, and ApplicationSet resources:</p><pre><code>ansible-playbook playbooks/gitops-foundation.yml \\<br>&nbsp;&nbsp;-e gitops_foundation_mode=render -e gitops_foundation_environment=lab<br>ansible-playbook playbooks/gitops-foundation.yml \\<br>&nbsp;&nbsp;-e gitops_foundation_mode=gitops -e gitops_foundation_environment=production<br>make day2-render<br>make day2-deploy</code></pre>")},
{id:"deploy-gui",title:"2. Deployment with the GUI Interface",group:(lang==='es'?"Rutas de despliegue":"Deployment paths"),summary:(lang==='es'?"Los mismos procedimientos desde formularios validados en un contenedor en el bastión.":"The same procedures through validated forms in a container on the bastion."),html:(lang==='es'?"<h2>Arrancar la GUI en el nodo bastión</h2><p>La GUI es una aplicación web en Go que se despliega iniciando un contenedor en el nodo bastión. Descubre los mismos valores por defecto de inventario y el mismo catálogo de operadores, crea perfiles cifrados con Ansible Vault y ejecuta únicamente playbooks permitidos, con RBAC (viewer, operator, admin), frases de confirmación exactas (MIRROR, BOOT, INSTALL, EJECT, GITOPS), salida en vivo con secretos redactados e historial persistente.</p><pre><code>export INSTALLER_UI_ADMIN_TOKEN=&lt;token-aleatorio-de-16+-caracteres&gt;<br>make gui-build<br>make gui-run<br># Alternativa: podman compose up --build</code></pre><p>Abre <code>http://127.0.0.1:8080</code> en el navegador del bastión.</p><h2>2.1 Connected OpenShift</h2><p>Completa el perfil conectado en los formularios guiados (clúster, Assisted Installer API, red, BMC/Redfish, runtime y secretos), guarda y valida el perfil, y ejecuta en orden: validación, preflight, descubrimiento, espejo (si aplica), arranque del ISO e instalación.</p><h2>2.2 Disconnected OpenShift</h2><p>En el mismo perfil activa el modo desconectado: la GUI prepara el espejo con oc-mirror v2 (acción con confirmación MIRROR) y usa el registro local durante la instalación, sin cambiar el contrato de variables.</p><h2>2.3 Day-2 Activities</h2><p>Selecciona los operadores y operandos de Día 2 por perfil o individualmente y ejecuta las acciones permitidas de Día 2 con el mismo control de roles y confirmaciones.</p><h2>2.4 GitOps Initialization</h2><p>Renderiza el estado deseado de Día 2 sin tocar Git ni el clúster, revísalo y después publica y arranca GitOps con la confirmación GITOPS.</p>":"<h2>Start the GUI on the bastion node</h2><p>The GUI is a Go web application deployed by starting a container on the bastion node. It discovers the same inventory defaults and operator catalog, creates Ansible Vault-encrypted profiles, and runs only allowlisted playbooks, with RBAC (viewer, operator, admin), exact confirmation phrases (MIRROR, BOOT, INSTALL, EJECT, GITOPS), live output with secrets redacted, and persistent history.</p><pre><code>export INSTALLER_UI_ADMIN_TOKEN=&lt;token-aleatorio-de-16+-caracteres&gt;<br>make gui-build<br>make gui-run<br># Alternativa: podman compose up --build</code></pre><p>Open <code>http://127.0.0.1:8080</code> in the bastion browser.</p><h2>2.1 Connected OpenShift</h2><p>Complete the connected profile in the guided forms (cluster, Assisted Installer API, networking, BMC/Redfish, runtime, and secrets), save and validate the profile, and run in order: validation, preflight, discovery, mirror (if applicable), ISO boot, and installation.</p><h2>2.2 Disconnected OpenShift</h2><p>In the same profile enable disconnected mode: the GUI prepares the mirror with oc-mirror v2 (MIRROR confirmation action) and uses the local registry during installation, without changing the variable contract.</p><h2>2.3 Day-2 Activities</h2><p>Select Day-2 operators and operands by profile or individually and run the allowlisted Day-2 actions with the same role and confirmation controls.</p><h2>2.4 GitOps Initialization</h2><p>Render the Day-2 desired state without touching Git or the cluster, review it, and then publish and bootstrap GitOps with the GITOPS confirmation.</p>")},
{id:"operators",title:"3. Operators",group:(lang==='es'?"Rutas de despliegue":"Deployment paths"),summary:(lang==='es'?"Catálogo de más de 50 operadores con entrega directa o GitOps.":"Catalog of more than 50 operators with direct or GitOps delivery."),html:(lang==='es'?"<h2>3.1 GitOps Deployment and Configuration</h2><p>El flujo canónico de Día 2 selecciona operadores de un catálogo de más de 50 componentes Red Hat, certificados y del ecosistema, resuelve dependencias, renderiza recursos Kustomize y Argo CD, crea un image set de operador con oc-mirror v2 y puede publicar el resultado en un repositorio Git configurable.</p><pre><code>ansible-playbook playbooks/install-platform-operator.yml \\<br>&nbsp;&nbsp;-e operator_lifecycle_component=acm \\<br>&nbsp;&nbsp;-e operator_lifecycle_deployment_mode=gitops<br>make day2-render<br>make day2-deploy</code></pre><h2>Modos de despliegue</h2><ul><li><code>direct</code>: aplicar los recursos con Ansible (también disponible para Día 2 controlado).</li><li><code>render</code>: generar los manifiestos de estado deseado sin aplicarlos.</li><li><code>gitops</code>: renderizar los manifiestos y reconciliarlos mediante OpenShift GitOps.</li></ul><p>Cada componente declara sus modos soportados en <code>framework/components.yml</code> y el catálogo completo vive en <code>framework/day2-operator-catalog.yml</code>. Los modos directo y GitOps describen el mismo estado deseado de Kubernetes: el directo lo aplica de inmediato y GitOps lo publica para la reconciliación de Argo CD.</p>":"<h2>3.1 GitOps Deployment and Configuration</h2><p>The canonical Day-2 workflow selects operators from a catalog of more than 50 Red Hat, certified, and requested ecosystem components, resolves dependencies, renders Kustomize and Argo CD resources, creates an oc-mirror v2 operator image set, and can publish the result to a configurable Git repository.</p><pre><code>ansible-playbook playbooks/install-platform-operator.yml \\<br>&nbsp;&nbsp;-e operator_lifecycle_component=acm \\<br>&nbsp;&nbsp;-e operator_lifecycle_deployment_mode=gitops<br>make day2-render<br>make day2-deploy</code></pre><h2>Deployment modes</h2><ul><li><code>direct</code>: apply resources with Ansible (also available for controlled Day-2).</li><li><code>render</code>: generate desired-state manifests without applying them.</li><li><code>gitops</code>: render manifests and reconcile through OpenShift GitOps.</li></ul><p>Each component declares its supported modes in <code>framework/components.yml</code> and the full catalog lives in <code>framework/day2-operator-catalog.yml</code>. Direct and GitOps modes describe equivalent Kubernetes desired state: direct mode applies it immediately; GitOps mode publishes it for Argo CD reconciliation.</p>")},
{id:"module-1",title:"Module 1: Foundations",group:(lang==='es'?"Currículo":"Curriculum"),summary:(lang==='es'?"Entorno, inventario, perfiles y credenciales.":"Environment, inventory, profiles, and credentials."),html:(lang==='es'?"<p>Establece la estación de trabajo, el repositorio, el inventario, las dependencias, los perfiles y las credenciales que necesita cada ejercicio posterior.</p><h2>Actividades</h2><ul><li>Revisar el mapa de fuentes del workshop y la arquitectura.</li><li>Seleccionar el modo de ejecución directo o GitOps.</li><li>Preparar el entorno de control y las colecciones requeridas.</li><li>Construir un inventario mixto con intención BMC explícita.</li><li>Entender los perfiles del framework y la precedencia de variables.</li><li>Proteger contraseñas, pull secrets, tokens y material privado con Ansible Vault.</li></ul><h2>Laboratorios</h2><ul><li>1.0 Workshop Source Map</li><li>1.1 Workshop Overview</li><li>1.2 Environment Details</li><li>1.3 Architecture-Aligned Workshop</li><li>1.4 Direct and GitOps Modes</li><li>1.5 Prepare the Environment</li><li>1.6 Configure Mixed-Vendor Inventory</li><li>1.7 Framework, Inventory, and Profiles</li><li>1.8 Dependency and Inventory Reference</li><li>1.9 Protect Credentials</li></ul><div class=\"callout\"><b>Resultado esperado:</b> Un entorno de ejecución y un inventario validados que el resto de módulos puede usar de forma segura.</div>":"<p>Establish the workstation, repository, inventory, dependency, profile, and credential foundations required by every later exercise.</p><h2>Activities</h2><ul><li>Review the workshop source map and architecture.</li><li>Select direct or GitOps execution mode.</li><li>Prepare the control environment and required collections.</li><li>Build a mixed-vendor inventory with explicit BMC intent.</li><li>Understand framework profiles and variable precedence.</li><li>Protect passwords, pull secrets, tokens, and private material with Ansible Vault.</li></ul><h2>Labs</h2><ul><li>1.0 Workshop Source Map</li><li>1.1 Workshop Overview</li><li>1.2 Environment Details</li><li>1.3 Architecture-Aligned Workshop</li><li>1.4 Direct and GitOps Modes</li><li>1.5 Prepare the Environment</li><li>1.6 Configure Mixed-Vendor Inventory</li><li>1.7 Framework, Inventory, and Profiles</li><li>1.8 Dependency and Inventory Reference</li><li>1.9 Protect Credentials</li></ul><div class=\"callout\"><b>Expected result:</b> A validated execution environment and inventory that can be used safely by the remaining modules.</div>")},
{id:"module-2",title:"Module 2: Redfish Validation",group:(lang==='es'?"Currículo":"Curriculum"),summary:(lang==='es'?"Validar la gestión fuera de banda antes de instalar.":"Validate out-of-band management before installation."),html:(lang==='es'?"<p>Valida la gestión fuera de banda antes de intentar la instalación.</p><h2>Actividades</h2><ul><li>Revisar el modelo de integración de Redfish y Assisted Installer.</li><li>Descubrir endpoints HPE iLO y Dell iDRAC.</li><li>Normalizar la evidencia de sistema, NIC, almacenamiento y medio virtual.</li><li>Seleccionar direcciones MAC de aprovisionamiento deterministas.</li><li>Probar alcanzabilidad del ISO, inserción de medio virtual, arranque de una sola vez y reinicio.</li></ul><h2>Laboratorios</h2><ul><li>2.1 Redfish and Assisted Installer</li><li>2.2 Discover iLO and iDRAC</li><li>2.3 Validate Virtual Media</li></ul><div class=\"callout\"><b>Resultado esperado:</b> Cada host destino tiene acceso BMC verificado, identidad de red determinista y medio virtual funcional.</div>":"<p>Validate out-of-band management before attempting installation.</p><h2>Activities</h2><ul><li>Review the Redfish and Assisted Installer integration model.</li><li>Discover HPE iLO and Dell iDRAC endpoints.</li><li>Normalize system, NIC, storage, and virtual-media evidence.</li><li>Select deterministic provisioning MAC addresses.</li><li>Test ISO reachability, virtual-media insertion, one-time boot, and restart behavior.</li></ul><h2>Labs</h2><ul><li>2.1 Redfish and Assisted Installer</li><li>2.2 Discover iLO and iDRAC</li><li>2.3 Validate Virtual Media</li></ul><div class=\"callout\"><b>Expected result:</b> Every target host has verified BMC access, deterministic network identity, and working virtual-media capability.</div>")},
{id:"module-3",title:"Module 3: OpenShift Installation",group:(lang==='es'?"Currículo":"Curriculum"),summary:(lang==='es'?"ISO de descubrimiento, arranque e instalación con Assisted Installer.":"Discovery ISO, boot, and Assisted Installer installation."),html:(lang==='es'?"<p>Crea el ISO de descubrimiento, arranca los sistemas destino, supervisa la validación de Assisted Installer y completa la instalación de OpenShift.</p><h2>Actividades</h2><ul><li>Crear los recursos Cluster e InfraEnv.</li><li>Generar y exponer el ISO de descubrimiento.</li><li>Aplicar NMState estático y mapeos MAC-interfaz donde se requiera.</li><li>Arrancar los hosts mediante el medio virtual de Redfish.</li><li>Resolver fallos de validación de Assisted Installer.</li><li>Verificar operadores del clúster, nodos, autenticación y preparación de la plataforma.</li></ul><h2>Laboratorios</h2><ul><li>3.1 Create and Boot the ISO</li><li>3.2 Install and Verify OpenShift</li></ul><div class=\"callout\"><b>Resultado esperado:</b> Un clúster OpenShift instalado y operativo, con la evidencia de instalación conservada para diagnóstico y auditoría.</div>":"<p>Create the discovery ISO, boot the target systems, monitor Assisted Installer validation, and complete the OpenShift installation.</p><h2>Activities</h2><ul><li>Create Cluster and InfraEnv resources.</li><li>Generate and expose the discovery ISO.</li><li>Apply static NMState and MAC-to-interface mappings where required.</li><li>Boot hosts through Redfish virtual media.</li><li>Resolve Assisted Installer validation failures.</li><li>Verify cluster operators, nodes, authentication, and platform readiness.</li></ul><h2>Labs</h2><ul><li>3.1 Create and Boot the ISO</li><li>3.2 Install and Verify OpenShift</li></ul><div class=\"callout\"><b>Expected result:</b> An installed and operational OpenShift cluster with installation evidence retained for troubleshooting and audit.</div>")},
{id:"module-4",title:"Module 4: Ordered Day-2 Foundation",group:(lang==='es'?"Currículo":"Curriculum"),summary:(lang==='es'?"Configuración posterior a la instalación en orden controlado.":"Post-installation configuration in a controlled order."),html:(lang==='es'?"<p>Aplica la configuración posterior a la instalación en un orden controlado, de modo que los servicios dependientes solo se introduzcan cuando la plataforma esté lista.</p><h2>Actividades</h2><ul><li>NTP y estabilización de MachineConfigPool.</li><li>Etiquetas de nodo y metadatos de ubicación de cargas.</li><li>LDAP, HTPasswd, OAuth y recursos de gestión de identidad.</li><li>ACM, ACS, almacenamiento, virtualización, MTV, AAP, certificados, PKI, registros, red, monitoreo, logging, observabilidad, bare-metal, balanceador de carga, RHOSO y OADP.</li><li>Despliegue directo y salida GitOps renderizada con los mismos contratos de variables.</li></ul><h2>Laboratorios</h2><ul><li>4.1 Configure NTP</li><li>4.2 Assign Node Labels</li><li>4.3 Configure Identity and Authentication</li><li>4.4 Platform Operator Lifecycle</li><li>4.4.8.1 Custom API and Ingress Certificates</li></ul><div class=\"callout\"><b>Resultado esperado:</b> Una base de Día 2 gobernada por políticas con preparación verificable de operadores, almacenamiento, red, identidad, observabilidad y respaldo.</div>":"<p>Apply post-installation configuration in a controlled order so dependent services are introduced only after the platform is ready.</p><h2>Activities</h2><ul><li>NTP and MachineConfigPool stabilization.</li><li>Node labels and workload-placement metadata.</li><li>LDAP, HTPasswd, OAuth, and identity-management resources.</li><li>ACM, ACS, storage, virtualization, MTV, AAP, certificate, PKI, registry, networking, monitoring, logging, observability, bare-metal, load-balancer, RHOSO, and OADP components.</li><li>Direct deployment and rendered GitOps output using the same variable contracts.</li></ul><h2>Labs</h2><ul><li>4.1 Configure NTP</li><li>4.2 Assign Node Labels</li><li>4.3 Configure Identity and Authentication</li><li>4.4 Platform Operator Lifecycle</li><li>4.4.8.1 Custom API and Ingress Certificates</li></ul><div class=\"callout\"><b>Expected result:</b> A policy-driven Day-2 baseline with verifiable operator, storage, networking, identity, observability, and backup readiness.</div>")},
{id:"module-5",title:"Module 5: Health Check and Day-2 Operations",group:(lang==='es'?"Currículo":"Curriculum"),summary:(lang==='es'?"Salud de la plataforma, evidencia y extensión del framework.":"Platform health, evidence, and framework extension."),html:(lang==='es'?"<p>Evalúa la salud de la plataforma, genera evidencia accionable, diagnostica fallos y entiende cómo extender el framework de automatización.</p><h2>Actividades</h2><ul><li>Ejecutar comprobaciones de clúster, nodos, operadores, almacenamiento, red, certificados, etcd y cargas.</li><li>Producir informes estructurados y evidencia de remediación.</li><li>Distinguir advertencias de fallos bloqueantes.</li><li>Añadir un componente nuevo al framework con los contratos de rol y variables establecidos.</li><li>Validar el renderizado de plantillas y las puertas de calidad del repositorio.</li></ul><h2>Laboratorios</h2><ul><li>5.1 Health, Reporting, and Troubleshooting</li><li>5.2 Adding a New Component</li><li>5.3 Template System and Rendering</li><li>5.4 Complete Day-2 Implementation Catalog</li></ul><div class=\"callout\"><b>Resultado esperado:</b> Un flujo repetible de comprobación de salud y un método documentado para añadir automatización sin romper el comportamiento existente.</div>":"<p>Assess platform health, generate actionable evidence, troubleshoot failures, and understand how to extend the automation framework.</p><h2>Activities</h2><ul><li>Run cluster, node, operator, storage, networking, certificate, etcd, and workload checks.</li><li>Produce structured reports and remediation evidence.</li><li>Distinguish warnings from blocking failures.</li><li>Add a new framework component using the established role and variable contracts.</li><li>Validate template rendering and repository quality gates.</li></ul><h2>Labs</h2><ul><li>5.1 Health, Reporting, and Troubleshooting</li><li>5.2 Adding a New Component</li><li>5.3 Template System and Rendering</li><li>5.4 Complete Day-2 Implementation Catalog</li></ul><div class=\"callout\"><b>Expected result:</b> A repeatable health-check workflow and a documented method for adding new automation without breaking existing behavior.</div>")},
{id:"module-6",title:"Module 6: Deploy a Cluster from ACM",group:(lang==='es'?"Currículo":"Curriculum"),summary:(lang==='es'?"ACM como plano de control para desplegar otro clúster.":"ACM as the control plane to deploy another cluster."),html:(lang==='es'?"<p>Usa Red Hat Advanced Cluster Management como plano de control para generar y desplegar otro clúster OpenShift.</p><h2>Actividades</h2><ul><li>Generar una plantilla de clúster reutilizable.</li><li>Generar la definición de red del clúster.</li><li>Validar las variables de la plantilla y los recursos renderizados.</li><li>Desplegar el clúster mediante flujos directos o GitOps.</li><li>Verificar el estado de ManagedCluster, ClusterDeployment, AgentClusterInstall, InfraEnv y Agent.</li></ul><h2>Laboratorios</h2><ul><li>6.1 Generate Cluster Template</li><li>6.2 Generate Cluster Network Definition</li><li>6.3 Configure BareMetalHost Static LACP Networking</li><li>6.4 Validate Cluster Template</li><li>6.5 Deploy Cluster</li><li>6.6 Verify Managed Cluster</li></ul><div class=\"callout\"><b>Resultado esperado:</b> Un despliegue de clúster gestionado por ACM validado, con plantillas reutilizables y evidencia de despliegue.</div>":"<p>Use Red Hat Advanced Cluster Management as the control plane for generating and deploying another OpenShift cluster.</p><h2>Activities</h2><ul><li>Generate a reusable cluster template.</li><li>Generate the cluster network definition.</li><li>Validate template variables and rendered resources.</li><li>Deploy the cluster through direct or GitOps workflows.</li><li>Verify ManagedCluster, ClusterDeployment, AgentClusterInstall, InfraEnv, and Agent status.</li></ul><h2>Labs</h2><ul><li>6.1 Generate Cluster Template</li><li>6.2 Generate Cluster Network Definition</li><li>6.3 Configure BareMetalHost Static LACP Networking</li><li>6.4 Validate Cluster Template</li><li>6.5 Deploy Cluster</li><li>6.6 Verify Managed Cluster</li></ul><div class=\"callout\"><b>Expected result:</b> A validated ACM-managed cluster deployment with reusable templates and deployment evidence.</div>")},
{id:"module-7",title:"Module 7: Challenge",group:(lang==='es'?"Currículo":"Curriculum"),summary:(lang==='es'?"Escenario integral de fin a fin con todo el framework.":"End-to-end integrated scenario across the framework."),html:(lang==='es'?"<p>Completa un escenario de fin a fin que combina todas las capacidades del workshop.</p><h2>Actividades</h2><ul><li>Diagnosticar problemas de BMC de distintos proveedores, completar los prerrequisitos de instalación, aplicar la base de Día 2, verificar la salud de la plataforma, extender el framework y validar un despliegue de clúster basado en ACM.</li></ul><h2>Laboratorios</h2><ul><li>7.1 Integrated Automation Challenge</li><li>7.2 Reference and Troubleshooting</li></ul><div class=\"callout\"><b>Resultado esperado:</b> Un paquete de evidencia completo que demuestra que el participante puede operar el framework desde la preparación inicial hasta la instalación, la configuración de Día 2, la validación de salud y la entrega de clústeres gestionados.</div>":"<p>Complete an end-to-end scenario that combines all workshop capabilities.</p><h2>Activities</h2><ul><li>Diagnose mixed-vendor BMC issues, complete installation prerequisites, apply Day-2 foundations, verify platform health, extend the framework, and validate an ACM-based cluster deployment.</li></ul><h2>Labs</h2><ul><li>7.1 Integrated Automation Challenge</li><li>7.2 Reference and Troubleshooting</li></ul><div class=\"callout\"><b>Expected result:</b> A complete evidence package demonstrating that the participant can operate the automation framework from initial preparation through installation, Day-2 configuration, health validation, and managed-cluster delivery.</div>")},
{id:"materials",title:"Resources",group:(lang==='es'?"Recursos":"Resources"),summary:(lang==='es'?"Enlaces y archivos del workshop.":"Workshop links and files."),html:(lang==='es'?"<h2>Enlaces del workshop</h2><ul><li><a href=\"https://github.com/psehgaft/ocp-ansible-agent-installer\">Repositorio del workshop</a></li><li><a href=\"https://github.com/psehgaft/ocp-ansible-agent-installer/tree/main/workshop/documentation\">Fuentes AsciiDoc completas del workshop</a></li><li><a href=\"https://github.com/psehgaft/ocp-ansible-agent-installer/blob/main/docs/deployment-scenarios.md\">Runbook ejecutivo de despliegue</a></li><li><a href=\"https://github.com/psehgaft/ocp-ansible-agent-installer/blob/main/docs/day0-bare-metal-installation.md\">Guía de instalación bare-metal Día 0</a></li><li><a href=\"https://github.com/psehgaft/ocp-ansible-agent-installer/blob/main/docs/day2-gitops-operator-deployment.md\">Guía de despliegue de operadores Día 2 con GitOps</a></li><li><a href=\"https://github.com/psehgaft/ocp-ansible-agent-installer/blob/main/docs/gui-interface.md\">Guía de la interfaz GUI</a></li></ul><h2>Archivos del workshop</h2><p>Las guías, manifiestos y material de referencia viven en el repositorio, en <code>docs/</code> y <code>workshop/documentation/</code>, y se enlazan desde la sección correspondiente.</p>":"<h2>Workshop links</h2><ul><li><a href=\"https://github.com/psehgaft/ocp-ansible-agent-installer\">Workshop repository</a></li><li><a href=\"https://github.com/psehgaft/ocp-ansible-agent-installer/tree/main/workshop/documentation\">Full AsciiDoc workshop sources</a></li><li><a href=\"https://github.com/psehgaft/ocp-ansible-agent-installer/blob/main/docs/deployment-scenarios.md\">Executive deployment runbook</a></li><li><a href=\"https://github.com/psehgaft/ocp-ansible-agent-installer/blob/main/docs/day0-bare-metal-installation.md\">Day-0 bare-metal installation guide</a></li><li><a href=\"https://github.com/psehgaft/ocp-ansible-agent-installer/blob/main/docs/day2-gitops-operator-deployment.md\">Day-2 GitOps operator deployment guide</a></li><li><a href=\"https://github.com/psehgaft/ocp-ansible-agent-installer/blob/main/docs/gui-interface.md\">GUI interface guide</a></li></ul><h2>Workshop files</h2><p>Guides, manifests, and reference material live in the repository under <code>docs/</code> and <code>workshop/documentation/</code> and are linked from the corresponding section.</p>")}
