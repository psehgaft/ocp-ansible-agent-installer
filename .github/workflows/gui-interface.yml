name: GUI Interface

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python test dependencies
        run: pip install -r requirements-ci.txt -r requirements.txt
      - name: Verify Go formatting
        run: |
          gofmt -l cmd internal | tee /tmp/gofmt-files
          test ! -s /tmp/gofmt-files
      - name: Go static and race tests
        run: |
          go vet ./...
          go test -race ./...
      - name: Configuration helper tests
        run: pytest -q tests/test_gui_config.py
      - name: Build UI binary
        run: go build -trimpath -o /tmp/installer-ui ./cmd/installer-ui
      - name: API smoke test
        run: |
          INSTALLER_UI_REPOSITORY_ROOT="$PWD" \
          INSTALLER_UI_DATA_ROOT=/tmp/installer-ui-data \
          INSTALLER_UI_LISTEN=127.0.0.1:18080 \
          /tmp/installer-ui >/tmp/installer-ui.log 2>&1 &
          ui_pid=$!
          trap 'kill ${ui_pid} 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz | jq -e '.status == "ok"'
          curl -fsS http://127.0.0.1:18080/api/schema | jq -e '.operators | length >= 52'
      - name: Linux Podman Compose build and health smoke test
        env:
          INSTALLER_UI_AUTH_TOKENS: ci-smoke-token-000000000000000000000000=admin
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y podman python3-venv
          python3 -m venv "$RUNNER_TEMP/podman-compose"
          "$RUNNER_TEMP/podman-compose/bin/python" -m pip install --upgrade pip 'podman-compose>=1.4.0'
          export PODMAN_COMPOSE_PROVIDER="$RUNNER_TEMP/podman-compose/bin/podman-compose"
          podman info
          trap 'podman compose down --volumes --remove-orphans || true' EXIT
          podman compose config --quiet
          podman compose build --no-cache installer-ui
          podman compose up -d installer-ui
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 \
            http://127.0.0.1:8080/healthz | jq -e '.status == "ok"'