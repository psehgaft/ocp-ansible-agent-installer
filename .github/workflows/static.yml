name: Build and publish workshop site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workshop/index.html"
      - ".github/workflows/static.yml"

permissions:
  contents: read
  pages: write
id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site from the Open Demo Days template
        run: |
          mkdir -p www/ocp-redfish-installer/main
          cp workshop/index.html www/index.html
          cat > www/ocp-redfish-installer/main/index.html <<'REDIRECT'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=../../">
            <link rel="canonical" href="../../">
            <title>OpenShift Automation Framework Workshop</title>
          </head>
          <body>
            <p>The workshop moved to the <a href="../../">OpenShift Automation Framework Workshop</a> home.</p>
          </body>
          </html>
          REDIRECT
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
