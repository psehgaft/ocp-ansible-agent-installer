name: Quality - Destructive

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPROVE-DESTRUCTIVE
        required: true
        type: string

permissions:
  contents: read

jobs:
  destructive:
    if: ${{ inputs.confirmation == 'APPROVE-DESTRUCTIVE' }}
    runs-on: ubuntu-latest
    environment: destructive-tests
    env:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate destructive-test credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${KUBECONFIG_B64}" ]]; then
            echo "ERROR: KUBECONFIG_B64 is not configured in the destructive-tests environment." >&2
            exit 1
          fi

      - name: Install Python dependencies
        run: pip install -r requirements-ci.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r collections/requirements.yml

      - name: Materialize kubeconfig
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s' "${KUBECONFIG_B64}" | base64 --decode > "${RUNNER_TEMP}/kubeconfig"
          chmod 0600 "${RUNNER_TEMP}/kubeconfig"

      - name: Run explicitly approved destructive tests
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: pytest -q -m destructive
