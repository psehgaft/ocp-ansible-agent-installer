---
- name: Load platform operator catalog
  ansible.builtin.include_vars:
    file: "{{ operator_lifecycle_catalog_file }}"
    name: operator_catalog_data

- name: Validate selected component
  ansible.builtin.assert:
    that:
      - operator_lifecycle_component | length > 0
      - operator_lifecycle_component in operator_catalog_data.components
      - operator_lifecycle_deployment_mode in ['direct', 'render', 'gitops']
    fail_msg: "Select a valid operator component and deployment mode."

- name: Publish selected component metadata
  ansible.builtin.set_fact:
    operator_component: "{{ operator_catalog_data.components[operator_lifecycle_component] }}"

- name: Validate OLM lifecycle metadata
  ansible.builtin.assert:
    that:
      - operator_component.installation_type == 'olm'
      - operator_component.olm is defined
    fail_msg: >-
      {{ operator_lifecycle_component }} is not installed through OLM. Use its
      dedicated configuration role instead.

- name: Render operator subscription manifest
  ansible.builtin.template:
    src: operator-subscription.yml.j2
    dest: >-
      {{ operator_lifecycle_render_root }}/{{ operator_lifecycle_component }}/operator-subscription.yml
    mode: "0644"
  when: operator_lifecycle_deployment_mode in ['render', 'gitops']

- name: Apply operator subscription directly
  kubernetes.core.k8s:
    kubeconfig: "{{ operator_lifecycle_kubeconfig }}"
    state: present
    template: operator-subscription.yml.j2
  when: operator_lifecycle_deployment_mode == 'direct'

- name: Wait for subscription to resolve an installed CSV
  kubernetes.core.k8s_info:
    kubeconfig: "{{ operator_lifecycle_kubeconfig }}"
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    name: "{{ operator_lifecycle_component }}"
    namespace: "{{ operator_component.namespace }}"
  register: operator_subscription_result
  until:
    - operator_subscription_result.resources | length == 1
    - operator_subscription_result.resources[0].status.installedCSV | default('') | length > 0
  retries: "{{ operator_lifecycle_wait_retries }}"
  delay: "{{ operator_lifecycle_wait_delay }}"
  when: operator_lifecycle_deployment_mode == 'direct'

- name: Wait for ClusterServiceVersion success
  kubernetes.core.k8s_info:
    kubeconfig: "{{ operator_lifecycle_kubeconfig }}"
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    name: "{{ operator_subscription_result.resources[0].status.installedCSV }}"
    namespace: "{{ operator_component.namespace }}"
  register: operator_csv_result
  until:
    - operator_csv_result.resources | length == 1
    - operator_csv_result.resources[0].status.phase | default('') == 'Succeeded'
  retries: "{{ operator_lifecycle_wait_retries }}"
  delay: "{{ operator_lifecycle_wait_delay }}"
  when: operator_lifecycle_deployment_mode == 'direct'

- name: Publish normalized operator validation result
  ansible.builtin.include_role:
    name: component_validation
  vars:
    component_validation_name: "{{ operator_lifecycle_component }}"
    component_validation_status: >-
      {{ 'passed' if operator_lifecycle_deployment_mode != 'direct'
         or (operator_csv_result.resources[0].status.phase | default('') == 'Succeeded')
         else 'failed' }}
    component_validation_requested_state: enabled
    component_validation_effective_state: >-
      {{ 'rendered' if operator_lifecycle_deployment_mode in ['render', 'gitops'] else 'installed' }}
    component_validation_deployment_mode: "{{ operator_lifecycle_deployment_mode }}"
    component_validation_version: >-
      {{ operator_subscription_result.resources[0].status.installedCSV | default(operator_component.olm.channel) }}
    component_validation_installation:
      subscription: >-
        {{ 'ready' if operator_lifecycle_deployment_mode != 'direct'
           or (operator_subscription_result.resources | default([]) | length == 1) else 'failed' }}
      csv: >-
        {{ 'succeeded' if operator_lifecycle_deployment_mode != 'direct'
           or (operator_csv_result.resources[0].status.phase | default('') == 'Succeeded') else 'failed' }}
      workloads: pending
    component_validation_functional_checks: {}
    component_validation_warnings: >-
      {{ ['Operator workloads and operands require component-specific functional validation.'] }}
    component_validation_errors: []
    component_validation_remediation_recommendation: >-
      Review Subscription, InstallPlan, CSV conditions, and operator namespace workloads when validation fails.
    component_validation_evidence:
      - resource: "Subscription/{{ operator_lifecycle_component }}"
        namespace: "{{ operator_component.namespace }}"
      - resource: >-
          ClusterServiceVersion/{{ operator_subscription_result.resources[0].status.installedCSV | default('render-only') }}
        namespace: "{{ operator_component.namespace }}"
