---
- name: Validate oc CLI is available
  ansible.builtin.command: oc version --client
  register: _oc_version
  changed_when: false
  run_once: true

- name: Validate cluster access (oc whoami)
  ansible.builtin.command: oc whoami
  environment:
    KUBECONFIG: "{{ rhoso_kubeconfig | default(omit) }}"
  register: _oc_whoami
  changed_when: false
  run_once: true

- name: Ensure openstack namespace exists (create if missing)
  ansible.builtin.command: oc get ns "{{ rhoso_project_name }}" -o name
  environment:
    KUBECONFIG: "{{ rhoso_kubeconfig | default(omit) }}"
  register: _ns_check
  failed_when: false
  changed_when: false
  run_once: true

- name: Create openstack namespace if missing
  ansible.builtin.command: oc new-project "{{ rhoso_project_name }}"
  environment:
    KUBECONFIG: "{{ rhoso_kubeconfig | default(omit) }}"
  when: _ns_check.rc != 0
  changed_when: true
  run_once: true

- name: Check required CRDs exist (NMState NNCP)
  ansible.builtin.command: oc get crd nodenetworkconfigurationpolicies.nmstate.io -o name
  environment:
    KUBECONFIG: "{{ rhoso_kubeconfig | default(omit) }}"
  register: _crd_nncp
  changed_when: false
  run_once: true

- name: Check required CRDs exist (NetworkAttachmentDefinition)
  ansible.builtin.command: oc get crd network-attachment-definitions.k8s.cni.cncf.io -o name
  environment:
    KUBECONFIG: "{{ rhoso_kubeconfig | default(omit) }}"
  register: _crd_nad
  changed_when: false
  run_once: true

- name: Check MetalLB CRDs exist when enabled
  ansible.builtin.command: oc get crd ipaddresspools.metallb.io l2advertisements.metallb.io -o name
  environment:
    KUBECONFIG: "{{ rhoso_kubeconfig | default(omit) }}"
  register: _crd_metallb
  changed_when: false
  when: rhoso_enable_metallb | bool
  run_once: true

- name: Ensure MetalLB namespace exists when enabled
  ansible.builtin.command: oc get ns "{{ rhoso_metallb_namespace }}" -o name
  environment:
    KUBECONFIG: "{{ rhoso_kubeconfig | default(omit) }}"
  register: _metallb_ns
  changed_when: false
  when: rhoso_enable_metallb | bool
  run_once: true

- name: Initialize TBD guardrail findings
  ansible.builtin.set_fact:
    _tbd_hits: []
  changed_when: false
  run_once: true

- name: Check basic required values for TBD markers
  ansible.builtin.set_fact:
    _tbd_hits: "{{ _tbd_hits + [item.name] }}"
  loop:
    - name: rhoso_isolated_base_iface
      invalid: "{{ (rhoso_isolated_base_iface | string) == 'TBD!' }}"
    - name: rhoso_worker_nodes
      invalid: "{{ (rhoso_worker_nodes | default([]) | length) == 0 }}"
  when: item.invalid | bool
  changed_when: false
  run_once: true

- name: Check network definitions for TBD markers
  ansible.builtin.set_fact:
    _tbd_hits: "{{ _tbd_hits + ['rhoso_isolated_networks[' ~ item.0|string ~ '].' ~ item.1] }}"
  loop: "{{ range(0, rhoso_isolated_networks | default([]) | length) | list | product(_rhoso_required_network_keys) | list }}"
  vars:
    _rhoso_required_network_keys:
      - subnet_cidr
      - pod_ipam_start
      - pod_ipam_end
      - vlan_id
      - mtu
      - prefix_length
      - metallb_pool_start
      - metallb_pool_end
  when:
    - (rhoso_isolated_networks[item.0].get(item.1, 'TBD!') | string) == 'TBD!'
  changed_when: false
  run_once: true

- name: Check per-node network addresses for TBD markers
  ansible.builtin.set_fact:
    _tbd_hits: "{{ _tbd_hits + ['ocp_worker_node_ips.' ~ item.0 ~ '.' ~ item.1] }}"
  loop: >-
    {{
      (rhoso_worker_nodes | default([]))
      | product(rhoso_isolated_networks | default([]) | map(attribute='name') | list)
      | list
    }}
  when:
    - (ocp_worker_node_ips.get(item.0, {}).get(item.1, 'TBD!') | string) == 'TBD!'
  changed_when: false
  run_once: true

- name: Fail if TBD values are present
  ansible.builtin.fail:
    msg: |
      One or more required variables are still set to "TBD!".
      Please fill them in before applying RHOSO networking.

      Missing values:
      {{ _tbd_hits | unique | to_nice_yaml }}
  when:
    - rhoso_fail_on_tbd | bool
    - (_tbd_hits | default([]) | length) > 0
  run_once: true

- name: Preflight summary
  ansible.builtin.debug:
    msg:
      - "Cluster user: {{ _oc_whoami.stdout | trim }}"
      - "Namespace: {{ rhoso_project_name }}"
      - "NNCP CRD: {{ _crd_nncp.stdout | trim }}"
      - "NAD CRD: {{ _crd_nad.stdout | trim }}"
      - "MetalLB enabled: {{ rhoso_enable_metallb | bool }}"
      - "OVN global forwarding patch enabled: {{ rhoso_enable_ovn_global_forwarding | bool }}"
  run_once: true
