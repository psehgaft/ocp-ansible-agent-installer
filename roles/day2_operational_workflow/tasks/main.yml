---
- name: Validate operational workflow input
  ansible.builtin.assert:
    that:
      - day2_deployment_mode in ['direct', 'render', 'gitops']
      - day2_operation_domain | length > 0

- name: Apply operational resources directly
  kubernetes.core.k8s:
    state: present
    definition: "{{ item }}"
  loop: "{{ day2_operation_resources }}"
  when: day2_deployment_mode == 'direct'

- name: Run read-only operational checks
  ansible.builtin.command:
    argv: "{{ item }}"
  loop: "{{ day2_operation_checks }}"
  register: day2_check_commands
  changed_when: false
  failed_when: false
  when:
    - day2_deployment_mode == 'direct'
    - day2_operation_checks | length > 0

- name: Publish operational results
  ansible.builtin.set_fact:
    day2_operation_results: >-
      {{ (day2_check_commands.results | default([])) | map(attribute='stdout') | list }}

- name: Create rendered operational directory
  ansible.builtin.file:
    path: "{{ day2_render_root }}/day2/{{ day2_operation_domain }}"
    state: directory
    mode: '0750'
  when: day2_deployment_mode in ['render', 'gitops']

- name: Render operational desired state
  ansible.builtin.copy:
    dest: "{{ day2_render_root }}/day2/{{ day2_operation_domain }}/resources.yml"
    content: "{{ day2_operation_resources | to_nice_yaml(indent=2, explicit_start=True) }}"
    mode: '0640'
  when: day2_deployment_mode in ['render', 'gitops']
