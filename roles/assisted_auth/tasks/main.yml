---
- name: Load optional mirror CA bundle
  ansible.builtin.set_fact:
    assisted_additional_trust_bundle: >-
      {{
        lookup('ansible.builtin.file', mirror_ca_file) | trim
        if mirror_ca_file | default('') | length > 0
        else assisted_infra_env_api.additional_trust_bundle | default('')
      }}
  no_log: true

- name: Obtain SaaS access token from the offline token
  when: assisted_auth_mode == 'saas'
  ansible.builtin.uri:
    url: "{{ assisted_sso_url | default('https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token') }}"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: refresh_token
      client_id: cloud-services
      refresh_token: "{{ vault_assisted_offline_token | default(assisted_offline_token | default('')) }}"
    return_content: true
    status_code: [200]
  register: _assisted_token
  no_log: true

- name: Set effective Assisted Installer access token
  ansible.builtin.set_fact:
    assisted_access_token_effective: >-
      {{
        _assisted_token.json.access_token
        if assisted_auth_mode == 'saas'
        else vault_assisted_access_token | default(assisted_access_token | default(''))
      }}
  no_log: true

- name: Assert Assisted Installer token is available
  ansible.builtin.assert:
    that:
      - assisted_access_token_effective is defined
      - assisted_access_token_effective | length > 0
    fail_msg: >-
      Put vault_assisted_offline_token (SaaS) or vault_assisted_access_token (on-premises)
      in the encrypted inventory vault.
  no_log: true
