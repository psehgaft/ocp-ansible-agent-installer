---
- name: Read pull secret and SSH public key
  ansible.builtin.set_fact:
    pull_secret: "{{ lookup('ansible.builtin.file', pull_secret_file) | trim }}"
    ssh_public_key: "{{ lookup('ansible.builtin.file', ssh_public_key_file) | trim }}"
  no_log: true

- name: Obtain SaaS access token from the offline token
  when: assisted_auth_mode == 'saas'
  ansible.builtin.uri:
    url: "https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: refresh_token
      client_id: cloud-services
      refresh_token: "{{ assisted_offline_token }}"
    return_content: true
    status_code: [200]
  register: _assisted_token
  no_log: true

- name: Set effective Assisted Installer access token
  ansible.builtin.set_fact:
    assisted_access_token_effective: >-
      {{
        _assisted_token.json.access_token
        if assisted_auth_mode == 'saas'
        else assisted_access_token
      }}
  no_log: true

- name: Assert Assisted Installer token is available
  ansible.builtin.assert:
    that:
      - assisted_access_token_effective is defined
      - assisted_access_token_effective | length > 0
    fail_msg: >-
      Provide assisted_offline_token for SaaS or assisted_access_token for on-premises service.
  no_log: true
