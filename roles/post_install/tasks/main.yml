---
- name: Download kubeconfig
  ansible.builtin.uri:
    url: "{{ assisted_api_url }}/clusters/{{ cluster_id }}/downloads/credentials?file_name=kubeconfig"
    method: GET
    headers:
      Authorization: "Bearer {{ assisted_access_token_effective }}"
      Accept: application/octet-stream
    status_code: [200]
    return_content: true
  register: _kubeconfig
  no_log: true

- name: Write kubeconfig
  ansible.builtin.copy:
    dest: "{{ output_kubeconfig }}"
    content: "{{ _kubeconfig.content }}"
    mode: "0600"
  no_log: true

- name: Download kubeadmin password
  ansible.builtin.uri:
    url: "{{ assisted_api_url }}/clusters/{{ cluster_id }}/downloads/credentials?file_name=kubeadmin-password"
    method: GET
    headers:
      Authorization: "Bearer {{ assisted_access_token_effective }}"
      Accept: application/octet-stream
    status_code: [200]
    return_content: true
  register: _kubeadmin_password
  no_log: true

- name: Write kubeadmin password
  ansible.builtin.copy:
    dest: "{{ output_kubeadmin_password }}"
    content: "{{ _kubeadmin_password.content | trim }}"
    mode: "0600"
  no_log: true

- name: Verify OpenShift API access
  ansible.builtin.command:
    argv:
      - oc
      - --kubeconfig
      - "{{ output_kubeconfig }}"
      - get
      - clusterversion
  register: _oc_verify
  changed_when: false
  failed_when: false

- name: Persist OpenShift verification output
  ansible.builtin.copy:
    dest: "{{ artifacts_dir }}/{{ cluster_name }}/raw/oc-get-clusterversion.txt"
    mode: "0600"
    content: |
      rc={{ _oc_verify.rc }}
      stdout:
      {{ _oc_verify.stdout }}
      stderr:
      {{ _oc_verify.stderr }}
