---
- name: Validate cluster operations input
  ansible.builtin.assert:
    that:
      - day2_deployment_mode in ['direct', 'render', 'gitops']
      - day2_cluster_domain | length > 0
      - not day2_require_resources or day2_cluster_resources | length > 0
    fail_msg: "Invalid Day-2 cluster operations input for {{ day2_cluster_domain }}."

- name: Apply cluster resources directly
  kubernetes.core.k8s:
    state: present
    definition: "{{ item }}"
  loop: "{{ day2_cluster_resources }}"
  when: day2_deployment_mode == 'direct'

- name: Create rendered domain directory
  ansible.builtin.file:
    path: "{{ day2_render_root }}/day2/{{ day2_cluster_domain }}"
    state: directory
    mode: '0750'
  when: day2_deployment_mode in ['render', 'gitops']

- name: Render cluster desired state
  ansible.builtin.copy:
    dest: "{{ day2_render_root }}/day2/{{ day2_cluster_domain }}/resources.yml"
    content: "{{ day2_cluster_resources | to_nice_yaml(indent=2, explicit_start=True) }}"
    mode: '0640'
  when: day2_deployment_mode in ['render', 'gitops']
