---
- name: Check persisted virtual-media state
  ansible.builtin.stat:
    path: "{{ artifacts_dir }}/{{ cluster_name }}/raw/virtual-media-{{ inventory_hostname }}.json"
  register: _virtual_media_state

- name: Load persisted virtual-media state
  ansible.builtin.set_fact:
    _persisted_virtual_media: >-
      {{
        lookup(
          'ansible.builtin.file',
          artifacts_dir ~ '/' ~ cluster_name ~ '/raw/virtual-media-' ~ inventory_hostname ~ '.json'
        ) | from_json
      }}
  when: _virtual_media_state.stat.exists
  no_log: true

- name: Determine an image URL for Redfish eject requests
  ansible.builtin.set_fact:
    _eject_image_url: >-
      {{
        _persisted_virtual_media.image_url
        if _persisted_virtual_media is defined
        else (
          effective_iso_url
          | default(
              iso_existing_url
              | default('http://127.0.0.1/discovery.iso')
            )
        )
      }}

- name: Eject virtual media using Manager category
  community.general.redfish_command:
    category: Manager
    command: VirtualMediaEject
    resource_id: "{{ bmc_manager_id_effective }}"
    baseuri: "{{ bmc_baseuri_effective }}"
    username: "{{ bmc_username_effective }}"
    password: "{{ bmc_password_effective }}"
    virtual_media:
      image_url: "{{ _eject_image_url | trim }}"
    timeout: "{{ bmc_timeout }}"
    validate_certs: "{{ bmc_validate_certs }}"
    ca_path: "{{ bmc_ca_path if bmc_ca_path | length > 0 else omit }}"
  failed_when: false
  no_log: true

- name: Eject virtual media using Systems category as a compatibility fallback
  community.general.redfish_command:
    category: Systems
    command: VirtualMediaEject
    resource_id: "{{ bmc_system_id_effective }}"
    baseuri: "{{ bmc_baseuri_effective }}"
    username: "{{ bmc_username_effective }}"
    password: "{{ bmc_password_effective }}"
    virtual_media:
      image_url: "{{ _eject_image_url | trim }}"
    timeout: "{{ bmc_timeout }}"
    validate_certs: "{{ bmc_validate_certs }}"
    ca_path: "{{ bmc_ca_path if bmc_ca_path | length > 0 else omit }}"
  failed_when: false
  no_log: true
