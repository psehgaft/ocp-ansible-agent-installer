- name: "Gather NIC inventory from iDRAC (Redfish)"
  community.general.redfish_info:
    category: Systems
    command: GetNicInventory
    baseuri: "{{ idrac_ip }}"
    username: "{{ idrac_user }}"
    password: "{{ idrac_password }}"
    timeout: 120
    validate_certs: "{{ validate_certs | default(false) }}"
  register: _nic

- name: "Gather disk inventory from iDRAC (Redfish) (best-effort)"
  community.general.redfish_info:
    category: Systems
    command: GetDiskInventory
    baseuri: "{{ idrac_ip }}"
    username: "{{ idrac_user }}"
    password: "{{ idrac_password }}"
    timeout: 120
    validate_certs: "{{ validate_certs | default(false) }}"
  register: _disk
  failed_when: false

- name: "Normalize NIC list"
  ansible.builtin.set_fact:
    idrac_nics: "{{ (_nic.redfish_facts.nic.entries | default([])) }}"
    idrac_disks: "{{ (_disk.redfish_facts.disk.entries | default([])) }}"
  no_log: true

- name: "Flatten NIC data structure to get actual NIC objects"
  ansible.builtin.set_fact:
    flat_nics: "{{ idrac_nics[0][1] if (idrac_nics | length > 0 and idrac_nics[0] | length > 1) else [] }}"

- name: "Pick a provisioning MAC address (prefer LinkStatus Up if available)"
  ansible.builtin.set_fact:
    provisioning_mac: >-
      {{
        (
          (flat_nics
            | selectattr('LinkStatus','defined')
            | selectattr('LinkStatus','equalto','LinkUp')
            | map(attribute='MACAddress')
            | list)
          +
          (flat_nics | map(attribute='MACAddress') | list)
        )
        | select('string')
        | map('lower')
        | list
        | first
      }}
  when: flat_nics | length > 0

- name: "Fail if no MAC address was discovered"
  ansible.builtin.fail:
    msg: "No NIC MAC addresses were discovered from iDRAC for {{ inventory_hostname }} (idrac_ip={{ idrac_ip }})."
  when: provisioning_mac is not defined or provisioning_mac | length == 0

- name: "Persist discovered iDRAC facts (raw) for reporting"
  ansible.builtin.copy:
    dest: "{{ artifacts_dir }}/{{ cluster_name }}/raw/idrac-{{ inventory_hostname }}.json"
    content: |
      {{
        {
          "inventory_hostname": inventory_hostname,
          "idrac_ip": idrac_ip,
          "provisioning_mac": provisioning_mac,
          "nics": idrac_nics,
          "disks": idrac_disks
        } | to_nice_json
      }}
  delegate_to: localhost
