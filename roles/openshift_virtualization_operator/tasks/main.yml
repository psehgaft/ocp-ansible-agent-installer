---
- name: Validate OpenShift Virtualization variables
  ansible.builtin.assert:
    that:
      - virtualization_install_plan_approval in ['Automatic', 'Manual']
      - virtualization_channel | length > 0

- name: Apply OpenShift Virtualization OLM resources
  ansible.builtin.command: "{{ oc_bin | default('oc') }} apply -f -"
  args:
    stdin: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: {{ virtualization_namespace }}
      ---
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: {{ virtualization_operatorgroup }}
        namespace: {{ virtualization_namespace }}
      spec:
        targetNamespaces:
          - {{ virtualization_namespace }}
      ---
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: {{ virtualization_subscription_name }}
        namespace: {{ virtualization_namespace }}
      spec:
        channel: {{ virtualization_channel }}
        installPlanApproval: {{ virtualization_install_plan_approval }}
        name: {{ virtualization_package_name }}
        source: {{ operator_source }}
        sourceNamespace: {{ operator_source_namespace }}
      {% if virtualization_starting_csv | length > 0 %}
        startingCSV: {{ virtualization_starting_csv }}
      {% endif %}
  environment: "{{ oc_env }}"
  register: _virtualization_apply
  changed_when: "'created' in _virtualization_apply.stdout or 'configured' in _virtualization_apply.stdout"

- name: Wait for OpenShift Virtualization installed CSV
  when: virtualization_install_plan_approval == 'Automatic'
  ansible.builtin.command: >-
    {{ oc_bin | default('oc') }} -n {{ virtualization_namespace }} get subscription {{ virtualization_subscription_name }}
    -o jsonpath='{.status.installedCSV}'
  environment: "{{ oc_env }}"
  register: _virtualization_csv
  retries: "{{ virtualization_operator_retries }}"
  delay: "{{ virtualization_operator_delay }}"
  until: _virtualization_csv.stdout | length > 0
  changed_when: false

- name: Wait for OpenShift Virtualization CSV to succeed
  when: virtualization_install_plan_approval == 'Automatic'
  ansible.builtin.command: >-
    {{ oc_bin | default('oc') }} -n {{ virtualization_namespace }} wait csv/{{ _virtualization_csv.stdout }}
    --for=jsonpath='{.status.phase}'=Succeeded --timeout=30m
  environment: "{{ oc_env }}"
  changed_when: false

- name: Create HyperConverged operand
  when:
    - virtualization_install_plan_approval == 'Automatic'
    - virtualization_create_hyperconverged | bool
  ansible.builtin.command: "{{ oc_bin | default('oc') }} apply -f -"
  args:
    stdin: |
      apiVersion: hco.kubevirt.io/v1beta1
      kind: HyperConverged
      metadata:
        name: {{ virtualization_hyperconverged_name }}
        namespace: {{ virtualization_namespace }}
      spec: {}
  environment: "{{ oc_env }}"
  register: _virtualization_hco_apply
  changed_when: "'created' in _virtualization_hco_apply.stdout or 'configured' in _virtualization_hco_apply.stdout"
