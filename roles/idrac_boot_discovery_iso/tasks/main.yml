---
- name: "Optionally prepare local HTTP ISO server (only when iso_delivery_mode=local_http)"
  when: iso_delivery_mode == 'local_http'
  block:
    - name: "Ensure artifacts directory exists for ISO storage"
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true
      
    - name: "Download discovery ISO to artifacts_dir"
      ansible.builtin.get_url:
        url: "{{ hostvars[ansible_play_batch[0]].discovery_iso_url }}"
        dest: "{{ artifacts_dir }}/{{ cluster_name }}/discovery.iso"
        mode: "0644"
        headers:
          Authorization: "Bearer {{ hostvars[ansible_play_batch[0]].assisted_access_token }}"
      delegate_to: localhost
      run_once: true

    - name: "Ensure remote discovery ISO directory exists using ansible ad-hoc"
      ansible.builtin.shell:
        cmd: "ansible -i '{{ iso_http_server }},' all -m file -a 'path={{ iso_http_dir }} state=directory mode=0755'"
      delegate_to: localhost
      run_once: true

    - name: "Copy discovery ISO to remote HTTP server using ansible ad-hoc"
      ansible.builtin.shell:
        cmd: "ansible -i '{{ iso_http_server }},' all -m copy -a 'src={{ artifacts_dir }}/{{ cluster_name }}/discovery.iso dest={{ iso_http_dir }}/discovery.iso mode=0644'"
      delegate_to: localhost
      run_once: true

    - name: "Start a simple containerized HTTP server for the ISO (podman) ad-hoc"
      ansible.builtin.shell:
        cmd: "ansible -i '{{ iso_http_server }},' all -m shell -b -a 'podman run -d --name ocp-iso-httpd --replace -p {{ iso_http_port }}:8080 -v {{ iso_http_dir }}:/var/www/html:Z registry.access.redhat.com/ubi9/httpd-24:latest'"
      delegate_to: localhost
      run_once: true

    - name: "Set ISO URL for iDRAC to fetch (local_http)"
      ansible.builtin.set_fact:
        effective_iso_url: "http://{{ iso_http_server }}:{{ iso_http_port }}/discovery.iso"
      delegate_to: localhost

# TEMP
- name: "Set ISO URL for iDRAC to fetch (local_http)"
  ansible.builtin.set_fact:
    effective_iso_url: "http://{{ iso_http_server }}:{{ iso_http_port }}/discovery.iso"
  delegate_to: localhost

- name: "Set ISO URL for iDRAC to fetch (direct_url)"
  when: iso_delivery_mode == 'direct_url'
  ansible.builtin.set_fact:
    effective_iso_url: "{{ hostvars[ansible_play_batch[0]].discovery_iso_url }}"
  delegate_to: localhost

# Disconnect Virtual Media First (in case it's still connected from a previous run) to ensure a clean state
- name: "Disconnect any existing virtual media (cleanup from previous runs)"
  dellemc.openmanage.idrac_virtual_media:
    idrac_ip: "{{ idrac_ip }}"
    idrac_user: "{{ idrac_user }}"
    idrac_password: "{{ idrac_password }}"
    validate_certs: "{{ validate_certs | default(false) }}"
    virtual_media:
      - index: 1
        insert: false
  ignore_errors: true
#  no_log: true

- name: "Mount Discovery ISO via iDRAC Virtual Media and reboot"
  dellemc.openmanage.idrac_virtual_media:
    idrac_ip: "{{ idrac_ip }}"
    idrac_user: "{{ idrac_user }}"
    idrac_password: "{{ idrac_password }}"
    validate_certs: "{{ validate_certs | default(false) }}"
    force: true
    virtual_media:
      - index: 1
        insert: true
        image: "{{ effective_iso_url }}"
        media_type: CD
  register: _vm
#  no_log: true

- name: Force next boot to virtual media cd
  dellemc.openmanage.idrac_boot:
    idrac_ip: "{{ idrac_ip }}"
    idrac_user: "{{ idrac_user }}"
    idrac_password: "{{ idrac_password }}"
    validate_certs: "{{ validate_certs | default(false) }}"
    boot_source_override_target: "cd"
    boot_source_override_enabled: once
#  no_log: true

- name: "Power cycle server to boot from virtual media"
  ansible.builtin.include_role:
    name: dellemc.openmanage.idrac_server_powerstate
  vars:
    hostname: "{{ idrac_ip }}"
    username: "{{ idrac_user }}"
    password: "{{ idrac_password }}"
    reset_type: "PowerCycle"
    state: "reboot"
#  no_log: true

- name: "Wait for server to boot iso image."
  ansible.builtin.wait_for:
    host: "{{ node_ipv4_address }}"
    port: 22
    delay: 10
    timeout: 600
