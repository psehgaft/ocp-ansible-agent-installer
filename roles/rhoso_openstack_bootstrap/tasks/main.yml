---
# -----------------------------------------------------------------------------
# Role: rhoso_openstack_bootstrap
# Purpose:
#   - Create the 'openstack' project (namespace)
#   - Label it for privileged pod creation by OpenStack operators
#   - Render and apply the 'osp-secret' Secret with RHOSO service credentials
#
# Notes:
#   - This role uses the 'oc' CLI for maximum portability.
#   - Ensure KUBECONFIG is available (inventory var rhoso_kubeconfig or env var).
# -----------------------------------------------------------------------------

- name: Ensure required variables are set
  ansible.builtin.assert:
    that:
      - rhoso_project_name is defined
      - rhoso_osp_secret_name is defined
      - rhoso_osp_secret is defined
      - os_director_ip is defined
    fail_msg: "Missing required vars: rhoso_project_name, rhoso_osp_secret_name, rhoso_osp_secret, os_director_ip"
  run_once: true

- name: Pull passwords if they don't already exist
  when: not lookup('file', '{{ artifacts_dir }}/{{ cluster_name }}/auth/overcloud-passwords.yaml', errors='ignore')
  ansible.builtin.shell: "ansible -i '{{ os_director_ip }},' all -m ansible.builtin.fetch -b --become-user=stack -a 'flat=yes src=/home/stack/overcloud-deploy/{{ os_fabric_name }}/{{os_fabric_name}}-passwords.yaml dest={{ artifacts_dir }}/{{ cluster_name }}/auth/overcloud-passwords.yaml'"
  run_once: true

- name: Set fact for overcloud passwords
  ansible.builtin.set_fact:
    overcloud_passwords: "{{ lookup('file', '{{ artifacts_dir }}/{{ cluster_name }}/auth/overcloud-passwords.yaml') | from_yaml }}"
  run_once: true

- name: Set rhoso_osp_secret from overcloud_passwords
  ansible.builtin.set_fact:
    rhoso_osp_secret: "{{ overcloud_passwords }}"
  run_once: true

- name: Validate oc CLI is available
  ansible.builtin.command: oc version --client
  register: _oc_version
  changed_when: false
  run_once: true

- name: Validate cluster access (oc whoami)
  ansible.builtin.command: oc whoami
  environment:
    KUBECONFIG: "{{ rhoso_kubeconfig | default(omit) }}"
  register: _oc_whoami
  changed_when: false
  run_once: true

# --- Optional: Generate missing values (if enabled) ---------------------------------------------
- name: Generate missing 32-char passwords (optional)
  ansible.builtin.set_fact:
    rhoso_osp_secret: "{{ rhoso_osp_secret | combine({item: lookup('ansible.builtin.password', '/dev/null length=32 chars=ascii_letters,digits')}) }}"
  when:
    - rhoso_generate_missing_secrets | bool
    - rhoso_osp_secret.get(item, '') | length == 0
  run_once: true
  loop:
    - AdminPassword
    - AodhPassword
    - BarbicanPassword
    - CeilometerPassword
    - CinderPassword
    - DbRootPassword
    - DesignatePassword
    - GlancePassword
    - HeatAuthEncryptionKey
    - HeatPassword
    - IronicInspectorPassword
    - IronicPassword
    - ManilaPassword
    - MetadataSecret
    - NeutronPassword
    - NovaPassword
    - OctaviaHeartbeatKey
    - OctaviaPassword
    - PlacementPassword
    - SwiftPassword

- name: Generate BarbicanSimpleCryptoKEK (Fernet key) if missing (optional)
  ansible.builtin.command: >
    python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode('UTF-8'))"
  register: _fernet_key
  changed_when: false
  when:
    - rhoso_generate_missing_secrets | bool
    - (rhoso_osp_secret.get('BarbicanSimpleCryptoKEK', '') | length) == 0
  run_once: true

- name: Set BarbicanSimpleCryptoKEK generated value (optional)
  ansible.builtin.set_fact:
    rhoso_osp_secret: "{{ rhoso_osp_secret | combine({'BarbicanSimpleCryptoKEK': _fernet_key.stdout | trim}, recursive=True) }}"
  when:
    - rhoso_generate_missing_secrets | bool
    - _fernet_key is defined
    - (_fernet_key.stdout | trim | length) > 0
  run_once: true

# --- Validate password lengths ------------------------------------------------------------------
- name: Enforce HeatAuthEncryptionKey length == 32
  ansible.builtin.assert:
    that:
      - (rhoso_osp_secret.HeatAuthEncryptionKey | length) == 32
    fail_msg: "HeatAuthEncryptionKey must be exactly 32 characters (per RHOSO docs)."
  run_once: true

- name: Enforce 32-char length for other service passwords (optional)
  ansible.builtin.assert:
    that:
      - (rhoso_osp_secret.AdminPassword | length) == 32
      - (rhoso_osp_secret.AodhPassword | length) == 32
      - (rhoso_osp_secret.BarbicanPassword | length) == 32
      - (rhoso_osp_secret.CeilometerPassword | length) == 32
      - (rhoso_osp_secret.CinderPassword | length) == 32
      - (rhoso_osp_secret.DbRootPassword | length) == 32
      - (rhoso_osp_secret.DesignatePassword | length) == 32
      - (rhoso_osp_secret.GlancePassword | length) == 32
      - (rhoso_osp_secret.HeatPassword | length) == 32
      - (rhoso_osp_secret.IronicInspectorPassword | length) == 32
      - (rhoso_osp_secret.IronicPassword | length) == 32
      - (rhoso_osp_secret.ManilaPassword | length) == 32
      - (rhoso_osp_secret.MetadataSecret | length) == 32
      - (rhoso_osp_secret.NeutronPassword | length) == 32
      - (rhoso_osp_secret.NovaPassword | length) == 32
      - (rhoso_osp_secret.OctaviaHeartbeatKey | length) == 32
      - (rhoso_osp_secret.OctaviaPassword | length) == 32
      - (rhoso_osp_secret.PlacementPassword | length) == 32
      - (rhoso_osp_secret.SwiftPassword | length) == 32
    fail_msg: "One or more service passwords are not 32 characters. Set rhoso_enforce_32char_passwords=false if you intentionally use a different length."
  when: rhoso_enforce_32char_passwords | bool
  run_once: true

# --- Create project/namespace and label it ------------------------------------------------------
- name: Check if project exists
  ansible.builtin.command: oc get project "{{ rhoso_project_name }}" -o name
  environment:
    KUBECONFIG: "{{ rhoso_kubeconfig | default(omit) }}"
  register: _project_check
  failed_when: false
  changed_when: false
  run_once: true

- name: Create project (oc new-project) if missing
  ansible.builtin.command: oc new-project "{{ rhoso_project_name }}"
  environment:
    KUBECONFIG: "{{ rhoso_kubeconfig | default(omit) }}"
  when: _project_check.rc != 0
  run_once: true

- name: Apply required namespace labels for RHOSO operators
  ansible.builtin.command: >
    oc label ns "{{ rhoso_project_name }}"
    security.openshift.io/scc.podSecurityLabelSync=false
    pod-security.kubernetes.io/enforce=privileged
    --overwrite
  environment:
    KUBECONFIG: "{{ rhoso_kubeconfig | default(omit) }}"
  register: _label_apply
  changed_when: "'labeled' in _label_apply.stdout or 'labeled' in _label_apply.stderr"
  run_once: true

- name: Verify namespace labels (json)
  ansible.builtin.command: oc get namespace "{{ rhoso_project_name }}" -o json
  environment:
    KUBECONFIG: "{{ rhoso_kubeconfig | default(omit) }}"
  register: _ns_json
  changed_when: false
  run_once: true

- name: Assert labels are present
  ansible.builtin.assert:
    that:
      - (_ns_json.stdout | from_json).metadata.labels['pod-security.kubernetes.io/enforce'] == 'privileged'
      - (_ns_json.stdout | from_json).metadata.labels['security.openshift.io/scc.podSecurityLabelSync'] == 'false'
    fail_msg: "Namespace labels are not set correctly for RHOSO."
  run_once: true

# --- Render Secret manifest and apply -----------------------------------------------------------
- name: Ensure render directory exists
  ansible.builtin.file:
    path: "{{ ocp_render_dir }}"
    state: directory
    mode: "0700"
  run_once: true

- name: Render osp-secret manifest (template)
  ansible.builtin.template:
    src: osp-secret.yaml.j2
    dest: "{{ ocp_render_dir }}/osp-secret.yaml"
    mode: "0600"
  run_once: true

- name: Apply osp-secret
  ansible.builtin.command: oc apply -f "{{ ocp_render_dir }}/osp-secret.yaml" -n "{{ rhoso_project_name }}"
  environment:
    KUBECONFIG: "{{ rhoso_kubeconfig | default(omit) }}"
  register: _secret_apply
  changed_when: "'created' in _secret_apply.stdout or 'configured' in _secret_apply.stdout"
  run_once: true

- name: Verify osp-secret exists
  ansible.builtin.command: oc get secret "{{ rhoso_osp_secret_name }}" -n "{{ rhoso_project_name }}" -o name
  environment:
    KUBECONFIG: "{{ rhoso_kubeconfig | default(omit) }}"
  register: _secret_check
  changed_when: false
  run_once: true

- name: Show final status summary
  ansible.builtin.debug:
    msg:
      - "Project: {{ rhoso_project_name }}"
      - "Namespace labels enforced: privileged + scc.podSecurityLabelSync=false"
      - "Secret applied: {{ rhoso_osp_secret_name }}"
  run_once: true
