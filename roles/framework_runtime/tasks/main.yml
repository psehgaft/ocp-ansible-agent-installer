---
- name: Load framework defaults
  ansible.builtin.include_vars:
    file: "{{ framework_defaults_file }}"
    name: framework_defaults

- name: Load selected deployment profile
  ansible.builtin.include_vars:
    file: "{{ framework_profile_file }}"
    name: framework_profile_data

- name: Load component catalog
  ansible.builtin.include_vars:
    file: "{{ framework_catalog_file }}"
    name: framework_catalog_data

- name: Load compatibility metadata
  ansible.builtin.include_vars:
    file: "{{ framework_compatibility_file }}"
    name: framework_compatibility_data

- name: Validate framework runtime inputs
  ansible.builtin.assert:
    that:
      - platform_deployment_mode in framework_allowed_deployment_modes
      - platform_openshift_version in framework_compatibility_data.framework_supported_openshift_versions
      - framework_profile_data.profile_features is mapping
      - framework_catalog_data.components is mapping
    fail_msg: >-
      Invalid framework runtime configuration. Verify deployment mode, OpenShift
      version, profile, and component catalog metadata.

- name: Build effective feature map
  ansible.builtin.set_fact:
    platform_effective_features: >-
      {{ framework_defaults.platform_features
         | combine(framework_profile_data.profile_features | default({}), recursive=True)
         | combine(platform_features | default({}), recursive=True) }}

- name: Select enabled components
  ansible.builtin.set_fact:
    platform_enabled_components: >-
      {{ platform_effective_features
         | dict2items
         | selectattr('value', 'equalto', true)
         | map(attribute='key')
         | list }}

- name: Resolve component dependency order
  ansible.builtin.set_fact:
    platform_component_execution_order: >-
      {{ framework_catalog_data.components
         | resolve_component_order(platform_enabled_components) }}

- name: Validate component deployment mode and OpenShift compatibility
  ansible.builtin.assert:
    that:
      - platform_deployment_mode in framework_catalog_data.components[item].deployment_modes
      - >-
        item not in framework_compatibility_data.framework_component_compatibility or
        platform_openshift_version in
        framework_compatibility_data.framework_component_compatibility[item].openshift
    fail_msg: >-
      Component {{ item }} does not support deployment mode
      {{ platform_deployment_mode }} or OpenShift {{ platform_openshift_version }}.
  loop: "{{ platform_component_execution_order }}"

- name: Publish framework runtime plan
  ansible.builtin.set_fact:
    platform_runtime_plan:
      profile: "{{ platform_profile }}"
      deployment_mode: "{{ platform_deployment_mode }}"
      openshift_version: "{{ platform_openshift_version }}"
      enabled_components: "{{ platform_enabled_components }}"
      execution_order: "{{ platform_component_execution_order }}"
