---
- name: Set Assisted Installer hostnames and roles
  ansible.builtin.uri:
    url: "{{ assisted_api_url }}/infra-envs/{{ infra_env_id }}/hosts/{{ inventory_to_ai_host_id[item] }}"
    method: PATCH
    headers:
      Authorization: "Bearer {{ assisted_access_token_effective }}"
      Content-Type: application/json
      Accept: application/json
    body_format: json
    body:
      host_name: "{{ hostvars[item].node_hostname }}"
      host_role: "{{ hostvars[item].node_role }}"
    status_code: [200, 201, 202]
    return_content: true
  loop: "{{ groups['baremetal'] }}"
  no_log: true

- name: Wait for cluster readiness
  ansible.builtin.uri:
    url: "{{ assisted_api_url }}/clusters/{{ cluster_id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ assisted_access_token_effective }}"
      Accept: application/json
    status_code: [200]
    return_content: true
  register: _cluster_ready
  retries: "{{ assisted_ready_retries }}"
  delay: "{{ assisted_ready_delay }}"
  until: _cluster_ready.json.status | default('') in ['ready', 'installed']
  no_log: true

- name: Start OpenShift installation
  ansible.builtin.uri:
    url: "{{ assisted_api_url }}/clusters/{{ cluster_id }}/actions/install"
    method: POST
    headers:
      Authorization: "Bearer {{ assisted_access_token_effective }}"
      Content-Type: application/json
      Accept: application/json
    status_code: [200, 202]
    return_content: true
  register: _install_start
  when: _cluster_ready.json.status != 'installed'
  no_log: true

- name: Wait for terminal installation status
  ansible.builtin.uri:
    url: "{{ assisted_api_url }}/clusters/{{ cluster_id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ assisted_access_token_effective }}"
      Accept: application/json
    status_code: [200]
    return_content: true
  register: _cluster_final
  retries: "{{ assisted_install_retries }}"
  delay: "{{ assisted_install_delay }}"
  until: _cluster_final.json.status | default('') in ['installed', 'error', 'cancelled']
  no_log: true

- name: Persist final cluster status
  ansible.builtin.copy:
    dest: "{{ artifacts_dir }}/{{ cluster_name }}/raw/cluster-final.json"
    content: "{{ _cluster_final.json | to_nice_json }}"
    mode: "0600"

- name: Fail when installation did not complete successfully
  ansible.builtin.fail:
    msg: >-
      Cluster installation ended in status={{ _cluster_final.json.status | default('unknown') }}.
      Review artifacts/{{ cluster_name }}/raw and the Assisted Installer events.
  when: _cluster_final.json.status | default('') != 'installed'
