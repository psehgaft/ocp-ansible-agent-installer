---
- name: Download Assisted Installer events
  ansible.builtin.uri:
    url: "{{ assisted_api_url }}/events?cluster_id={{ cluster_id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ assisted_access_token_effective }}"
      Accept: application/json
    status_code: [200]
    return_content: true
  register: _events
  no_log: true

- name: Persist Assisted Installer events
  ansible.builtin.copy:
    dest: "{{ artifacts_dir }}/{{ cluster_name }}/raw/events.json"
    content: "{{ _events.json | to_nice_json }}"
    mode: "0600"

- name: Render installation report
  ansible.builtin.template:
    src: install-report.md.j2
    dest: "{{ artifacts_dir }}/{{ cluster_name }}/reports/install-report.md"
    mode: "0600"
