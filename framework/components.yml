---
# Declarative framework component catalog.
# Functional roles are implemented incrementally in subsequent pull requests.
components:
  assisted_installer:
    category: day0
    role: assisted_cluster
    requires: []
    deployment_modes: [direct]
    gitops_path: null
  redfish:
    category: day0
    role: bmc_discovery
    requires: []
    deployment_modes: [direct]
    gitops_path: null
  gitops:
    category: platform
    role: gitops_operator
    requires: []
    deployment_modes: [direct, render, gitops]
    gitops_path: gitops/operators/gitops
  acm:
    category: management
    role: acm_operator
    requires: []
    recommends: [gitops]
    deployment_modes: [direct, render, gitops]
    gitops_path: gitops/operators/acm
  acs:
    category: security
    role: acs_operator
    requires: []
    deployment_modes: [direct, render, gitops]
    gitops_path: gitops/operators/acs
