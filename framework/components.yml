---
# Declarative platform component catalog.
# Operator installation metadata is intentionally separated from operand roles.
components:
  gitops:
    display_name: Red Hat OpenShift GitOps
    category: cicd
    enabled: false
    role: gitops_operator
    namespace: openshift-gitops-operator
    installation_type: olm
    olm: {package: openshift-gitops-operator, channel: latest, source: redhat-operators, source_namespace: openshift-marketplace}
    requires: []
    supported_openshift: ["4.18", "4.19"]
    deployment_modes: [direct, render, gitops]
    validation_hooks: [subscription_ready, csv_succeeded, operator_workload_ready]
    gitops: {path: gitops/operators/gitops, sync_wave: 10}

  acm:
    display_name: Red Hat Advanced Cluster Management
    category: management
    enabled: false
    role: acm_operator
    namespace: open-cluster-management
