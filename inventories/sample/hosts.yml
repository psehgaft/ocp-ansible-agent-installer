---
all:
  children:
    baremetal:
      children:
        control_plane:
          hosts:
            master-0:
              # REQUIRED: Select ilo, idrac, generic, or auto.
              bmc_type: ilo
              # REQUIRED: Full HTTPS endpoint of the HPE iLO or Dell iDRAC controller.
              bmc_endpoint: "https://CHANGE_ME_ILO_IP_1"
              # REQUIRED: BMC account with Redfish, virtual media, boot, and power privileges.
              bmc_username: "Administrator"
              # REQUIRED: Use a vaulted variable; never place the real password here.
              bmc_password: "{{ vault_bmc_passwords[inventory_hostname] }}"
              # REQUIRED: Assisted Installer role. Use master or worker.
              node_role: master
              # REQUIRED: Final OpenShift node hostname.
              node_hostname: master-0
              # REQUIRED: Static installation-network IPv4 address without prefix.
              node_ipv4_address: "192.168.50.21"
              # OPTIONAL: Pin logical NIC names to exact MACs when Redfish ordering is ambiguous.
              # mac_interface_map_override:
              #   - logical_nic_name: nic0
              #     mac_address: "aa:bb:cc:dd:ee:01"
              #   - logical_nic_name: nic1
              #     mac_address: "aa:bb:cc:dd:ee:02"

            master-1:
              bmc_type: idrac
              bmc_endpoint: "https://CHANGE_ME_IDRAC_IP_1"
              bmc_username: "root"
              bmc_password: "{{ vault_bmc_passwords[inventory_hostname] }}"
              node_role: master
              node_hostname: master-1
              node_ipv4_address: "192.168.50.22"

            master-2:
              # auto performs vendor detection from Redfish data. Explicit values are preferred in production.
              bmc_type: auto
              bmc_endpoint: "https://CHANGE_ME_BMC_IP_3"
              bmc_username: "CHANGE_ME_BMC_USER"
              bmc_password: "{{ vault_bmc_passwords[inventory_hostname] }}"
              node_role: master
              node_hostname: master-2
              node_ipv4_address: "192.168.50.23"

        workers:
          hosts:
            worker-0:
              bmc_type: ilo
              bmc_endpoint: "https://CHANGE_ME_ILO_IP_2"
              bmc_username: "Administrator"
              bmc_password: "{{ vault_bmc_passwords[inventory_hostname] }}"
              node_role: worker
              node_hostname: worker-0
              node_ipv4_address: "192.168.50.31"

            worker-1:
              bmc_type: idrac
              bmc_endpoint: "https://CHANGE_ME_IDRAC_IP_2"
              bmc_username: "root"
              bmc_password: "{{ vault_bmc_passwords[inventory_hostname] }}"
              node_role: worker
              node_hostname: worker-1
              node_ipv4_address: "192.168.50.32"
