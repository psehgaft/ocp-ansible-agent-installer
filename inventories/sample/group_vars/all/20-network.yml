---
# Host addressing controls whether InfraEnv receives static NMState configuration.
node_network_config_mode: static  # static | dhcp

# Used by the generated static NMState configuration.
node_ipv4_prefix: 24
node_ipv4_gateway: 192.168.50.1
node_dns_servers:
  - 192.168.50.5
  - 192.168.50.6

install_network_mode: bond  # single | bond
install_network_interface: nic0
install_network_bond_name: bond0
install_network_bond_ports: [nic0, nic1]
install_network_bond_mode: 802.3ad
install_network_bond_options:
  miimon: "100"
install_network_mtu: 1500
install_network_ipv6_enabled: false

# Optional: replace the generated NMState document per host with node_nmstate_config.
# The per-host value must be a complete NMState mapping.
