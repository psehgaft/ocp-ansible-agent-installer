---
# =============================================================================
# OpenShift cluster settings — review every CHANGE_ME value before execution.
# =============================================================================

# REQUIRED: Assisted Installer endpoint. The default is the Red Hat SaaS service.
assisted_api_url: "https://api.openshift.com/api/assisted-install/v2"

# REQUIRED: saas uses assisted_offline_token; onprem uses assisted_access_token.
assisted_auth_mode: "saas"  # saas | onprem

# REQUIRED: Cluster identity.
cluster_name: "CHANGE_ME_CLUSTER_NAME"
base_dns_domain: "example.com"

# REQUIRED: Confirm that the requested release is available in your Assisted Installer service.
openshift_version: "4.18"
cpu_architecture: "x86_64"

# REQUIRED: Must match the hosts declared in the inventory.
control_plane_count: 3
compute_count: 2

# REQUIRED: Bare-metal machine network and VIPs.
machine_network_cidr: "192.168.50.0/24"
api_vip: "192.168.50.10"
ingress_vip: "192.168.50.11"

# OpenShift SDN defaults. Change only when the network design requires it.
service_network_cidr: "172.30.0.0/16"
cluster_network_cidr: "10.128.0.0/14"
cluster_network_host_prefix: 23

# REQUIRED: Static installation network shared settings.
node_ipv4_prefix: 24
node_ipv4_gateway: "192.168.50.1"
node_dns_servers:
  - "192.168.50.5"
  - "192.168.50.6"
ntp_servers:
  - "time.example.com"

# REQUIRED: Choose single or bond for the primary installation interface.
install_network_mode: "bond"  # single | bond
install_network_interface: "nic0"       # Used when mode=single.
install_network_bond_name: "bond0"      # Used when mode=bond.
install_network_bond_ports:
  - "nic0"
  - "nic1"
install_network_bond_mode: "802.3ad"
install_network_mtu: 1500

# REQUIRED: Files on the Ansible control node.
pull_secret_file: "./secrets/pull-secret.json"
ssh_public_key_file: "./secrets/id_rsa.pub"

# =============================================================================
# BMC / Redfish settings.
# =============================================================================

# Use true with a trusted CA in production. False is intended only for labs.
bmc_validate_certs: false
# bmc_ca_path: "/etc/pki/ca-trust/source/anchors/bmc-ca.pem"

bmc_timeout: 120
bmc_boot_device: "Cd"
bmc_virtual_media_category: "Manager"  # Manager | Systems
bmc_virtual_media_fallback_to_systems: true
bmc_power_command: "PowerForceRestart"
bmc_wait_for_node_ssh: true
bmc_boot_wait_delay: 30
bmc_boot_wait_timeout: 1200

# Optional per-host override when automatic NIC selection is not acceptable.
# Put provisioning_mac_override in the host entry, for example:
# provisioning_mac_override: "aa:bb:cc:dd:ee:ff"
# You can also use a regex against NIC name/ID:
# provisioning_nic_match: "Embedded.1-1|LOM 1"
provisioning_nic_match: ""

# =============================================================================
# Discovery ISO delivery.
# =============================================================================

# local_http downloads the ISO and starts a Podman web server on the control node.
# existing_http uses iso_existing_url.
# direct_url gives the Assisted Installer image URL directly to the BMC.
iso_delivery_mode: "local_http"  # local_http | existing_http | direct_url

# REQUIRED for local_http: address reachable from every iLO/iDRAC management network.
iso_http_advertise_address: "CHANGE_ME_CONTROL_NODE_IP"
iso_http_bind_address: "0.0.0.0"
iso_http_port: 8080
iso_http_container_name: "ocp-assisted-iso-httpd"
iso_http_container_image: "registry.access.redhat.com/ubi9/httpd-24:latest"

# REQUIRED only for existing_http.
iso_existing_url: "https://CHANGE_ME_WEB_SERVER/discovery.iso"

# Assisted Installer ISO type.
assisted_image_type: "minimal-iso"  # minimal-iso | full-iso

# =============================================================================
# Local output paths and execution controls.
# =============================================================================

artifacts_dir: "./artifacts"
output_kubeconfig: "{{ artifacts_dir }}/{{ cluster_name }}/auth/kubeconfig"
output_kubeadmin_password: "{{ artifacts_dir }}/{{ cluster_name }}/auth/kubeadmin-password"

# Reuse persisted Assisted Installer state in artifacts/raw on reruns.
assisted_reuse_state: true
assisted_host_registration_retries: 120
assisted_host_registration_delay: 10
assisted_ready_retries: 180
assisted_ready_delay: 20
assisted_install_retries: 360
assisted_install_delay: 20
